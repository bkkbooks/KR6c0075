body:
  text: 六釋題解文二一總釋名題二別解文義初二一經題二譯人初金剛般若波羅蜜經釋此經題略作三法一能所作對二分別義相三為存古式能所作對者通題八字能所具有四對一能詮所詮對二能到所到對三能揀所揀對四能喻所喻對能詮所詮對者謂理不自明必得義以析之義不自顯必得經以詮之是則經為能詮上七字為所詮能到所到對者以梵言波羅蜜此云彼岸到譯隨梵言為語仍倒若依此方順義回文合云到彼岸是知般若為能到涅槃彼岸為所到也能揀所揀對中復具兩重一揀諸經二揀當會揀諸經者以佛說修多羅藏通名為經若不揀別恐濫前後所說故以般若揀之見者即知非餘經故則般若為能餘經皆所揀當會者般若一會所說經分八部皆帶般若之名若不揀別恐濫餘部故加金剛二字揀之見者即知非道行光讚等故則金剛二字為能餘部皆所能喻所喻對者以般若理微劣機難入取像金剛庶有發明故法華云諸有智者要以譬喻而得開悟是知金剛為能喻般若為所喻分別義相者先釋所詮次釋能詮釋所詮中首言金剛者梵言跋折羅亦云嚩左羅天帝所有力士所執金中最剛故以金剛名之其體最堅一切無能壞其用最利能壞於一切如涅槃云譬如金剛無能壞者而能碎壞一切諸物無著云金剛難壞金剛能斷又晉武帝起居注云武帝十三年燉煌有人獻金剛寶生於金中色如紫石瑛狀如蕎麥百鍊不銷可以切玉如泥是知堅利之極也用此為喻喻下般若不知般若者可以準思般若正翻為慧智度論云因位名般若果位名智是則慧為智之因智為慧之果纂要疏云若依大品經若字通智慧二義故智與慧名義少殊體性無別刊定記釋云此明字界字緣若字是字界般那都為緣若以般為緣助於若字則名為慧若以那為緣助於若字則名為智常途亦有不分以智即是慧慧即是智故般若二字一往翻為智慧如法華云我所得智慧微妙最第一是果中亦名為慧又云色力及智慧斯等皆減少是因中亦名為智既有教可憑今亦不分然譯主不翻仍存梵言者以尊重故金剛鎞云般若者衆生之心有實相觀照之殊實相者心本無相以遠離虗妄真實有體不可破壞無相之相強名實相此亦即是心體可同金剛之堅觀照者心本非照以遠離分別真明皎然有執皆破無照之照強名觀照此亦即是心用可同金剛之利法喻合明故云金剛般若以斯命名蓋欲衆生即金剛之堅利識般若之體用因中破執依實相而起觀照果中證理依觀照而契實相如珠發光光照珠體故知下之涅槃彼岸即是究竟實相曾無一法從外來者楞嚴云圓滿菩提歸無所得於此可見波羅蜜譯梵為華回倒為正已於能所作對中明今約此方正語釋之刊定記云彼岸即是涅槃為對生死之此故號涅槃為彼到之一字義兼事理若於因中信知本有實相般若依之而起觀照般若觀照功極當下執空頓悟實相般若即是到於彼岸此理到也若於既悟之後自覺習氣難除雖曰執空任運還起對境逢緣力不自由由是重起觀照抵對妄習加以六度萬行漸次磨礪果到妄盡理圓始稱究竟彼岸此事到也學般若者切忌以悟為證自滯中途纂要云離生死此岸度煩惱中流到涅槃彼岸今疏云執空妄盡即是度煩惱耳又永康云西域風俗所作究竟皆云到彼岸據此則是稱讚般若以此經所詮般若於諸般若中為最勝故釋能詮者即是經字梵語修多羅或云修妬路或云蘇怛覽約義翻為契經喫謂契理契機以能上符佛理下叶人心故經謂貫穿攝持以能貫穿所應說義攝持所應度生故若按西域修多羅一名而召四實謂聖教席經井索線也古德見此方聖教稱經遂半取席經為順兩方聖教之義又恐濫於儒道之經故上以契字揀之若通作梵言說者應云欲底修多羅以欲底翻為契故不翻井索及線者有二意一別指彼物故二此方不貴故或言經者常義謂過去諸佛已說現在諸佛今說未來諸佛當說三世無能易故或言經者法義謂菩薩依之成佛二乘依之回心衆生依之發意一切皆應遵故此經是佛所說非餘四人合上所詮理應信受為存古式者復有四義一辨虗實二判離合三成比量四明題法辨虗實者但言金剛不知所喻何法但言經字不知所詮何義二皆為虗般若波羅蜜為實判離合者經是能詮屬體般若能生信發解起行證果屬用經上加即字持業釋也又金剛般若等是所詮實法得勝之義經之一字是能詮虗文得劣之義密下加之字依主釋也又經非般若以能詮般若名般若經有財釋也又般若乃大部之名此既別行仍稱般若者以相近故鄰近釋也若謂般若有二二即般若亦通帶數若謂金剛是喻般若是法舉法及喻比類發明亦通相違成比量者般若是有法無能破者能破一切宗因云體最堅用最利故同喻如金剛異喻如餘金明題法者立題之法通有七種謂人法喻三單復具足今是法喻為題經題竟二譯人姚秦三藏法師鳩摩羅什譯姚秦者譯經朝代若論正統當言東晉以譯經在秦故以秦朝紀之揀異前秦符氏故曰姚秦乃後秦姚興在位時也三藏法師者譯主德號三藏者經律論也法師二字義兼兩利若以三藏聖法為自宗師則是自利若以三藏聖法師範人天則是利他譯主兼二故總以三藏法師稱之鳩摩羅什者譯主發諱華梵行實詳見第一門中譯者易也易梵語成華言也總釋名題竟二別解文義三一序分二正宗分三流通分此是道安法師所判凡屬佛經無論豐約皆準此科以其冥符西域理應今古通遵初二一證信序二發起序初證信者謂說聽時處主伴分明證是佛說令人生信故亦名通序諸經通有故亦名經後序佛說經時未有此序既說之後結集建立故建立此序有因有意建立因者謂佛於將涅槃時阿難愁惱阿泥樓豆謂言汝是持佛法人且須裁抑當詣佛所咨問後事阿難言云何後事阿泥樓豆告曰汝問佛在世時以佛為師佛滅度後以誰為師佛在世時依佛而住佛滅度後依誰而住佛在世時惡性比邱佛自調伏佛滅度後如何調伏佛在世時說法度生佛滅度後結集法藏一切經首當置何語阿難承教一一咨問佛告阿難我滅度後當以戒為師依四念處住惡性比邱默而擯之一切經首當置如是我聞一時佛在某處與某大衆若干等語建立意者有三一斷疑二息諍三異邪斷疑者謂如來滅後結集法藏時阿難升座感身相好如佛衆起三疑一疑佛重起說法二疑他方佛來三疑阿難成佛一說此言三疑頓斷故息諍者謂阿難與衆德位相等若不推從佛聞則諍論起故唱此言顯是佛說羣諍自息故異邪者西域外道經初多置阿憂二字今言如是等為異彼故如是我聞一時佛在舍衛國祗樹給孤獨園與大比邱衆千二百五十人俱準智度論此段具六種成就以六緣缺一教則不興興則必具故云成就首言如是即信成就以信者言如是不信者則言不如是故論云佛法大海信為能入故居其首華嚴云信為道元功德母長養一切諸善法是故根力善法皆以信為首也若連下我聞則是指法之詞謂如是之法我從佛聞也次言我聞即聞成就以聾者無聞佛不與說故我者揀他顯是自己親聞非私淑讀古者類故聞謂耳根發識聲在可聞處作心欲聞即便得聞今唯言我不言耳識等者蓋是廢別從總以我為一身之總故又雖言我聞實不計我以阿難此時已證四果已達我空故也經云願樂欲聞佛乃有說故云成就楞嚴云此方真教體清淨在音聞欲取三摩提實以聞中入是故七聖財中亦以聞為財也三言一時者時成就也一者始終究竟之謂時者遷流轉變之法體是不相應行或否或泰皆可言時今云一者應是清泰之時以否則說聽不能究竟不得稱一故不紀歲月者以如來說法通乎上下滅後結集達於遐邇約上下延促不等約遐邇紀歷不同歲月難稽故惟言一時蓋即取說無異座聽無異席二俱究竟為一時也古德云時節若至其理自彰法華云今正是其時時為如實說則時之所關亦大矣哉四言佛者即主成就具云佛陀耶此云覺者謂自覺覺他覺圓滿故異彼凡夫二乘及與菩薩以凡夫不自覺二乘不覺他菩薩覺不滿故讓如來獨擅其名若以本經釋義者自覺則無有定法名阿耨菩提覺他則滅度一切衆生而無度相覺滿則離一切相即名為佛的指其人即本師釋迦文也此法唯佛能證唯佛能說餘則不能故讓佛為主又設若無佛望前則信無所歸聞無所從時唯虗度望後則衆無所依處亦空陳是知餘五成就皆賴主成就耳五言舍衛等即處成就也舍衛亦名舍婆提新云室羅筏悉底蓋五天梵音不同此云豐德或云聞物以國豐四德為物所聞故四德者謂欲塵財寶多聞解脫也義淨三藏譯為名稱大城亦聞物義此城在中印土憍薩羅國今但言舍衛者以南印土亦有憍薩羅國恐濫彼故此總處也下乃別處祗園者祗陀太子所施樹也祗陀此云戰勝是波斯匿王太子生時王征外國戰勝而還因以為名園中樹木是其所施故名祗樹給園者給孤獨長者所施園也長者本名須達多是波斯匿王大臣或名須達拏此云善施以好善行施為名給孤獨是其德號給周給也幼而無父曰孤老而無子曰獨長者善施又偏能周給此二世美其德故以此稱買園建舍長者為主故云給孤獨園按刊定記引云波斯匿王有一大臣名須達多為兒聘婦躬至王舍城寄止長者刪檀那家刪檀那中夜而起莊嚴舍宅營辦肴膳須達問言欲請國王為婚姻之會耶答言非也為欲請佛須達聞已身毛皆豎復問何等名佛刪檀那即為備述佛之功德須達喜問佛在何處刪檀那言今在迦蘭陀竹林精舍時須達多一心念佛忽然天明見有光明即尋光處至城門下佛神力故門自開闢尋路而往爾時如來出外經行須達見已歡喜踴躍不知禮法時首陀天化作四人至世尊所接足禮拜胡跪問訊右繞三匝却住一面須達見已依而行之世尊即為說法須達聞已得證初果乃請佛言唯願臨顧至舍衛城受我微供佛言卿舍衛國頗有精舍能容我衆共居止否須達多言必見垂顧便當營辦爾時世尊默然受請令舍利弗同往舍衛指授處所唯太子園可容佛僧於是須達躬詣太子議買其園太子戲曰能以金甎布地即賣與卿須達即出金藏為磚布地太子感發并樹施之共搆精舍請佛及僧於中住止此猶略述廣如涅槃賢愚等經及四分律西域記說今說此經即在此處設無此處佛僧何依六成就中此亦叵少依真諦記住處有二一境界處為化俗故即舍衛也二依止處為統僧故即祗園也善見論云舉舍衛令遠人知舉祗園令近人知故六言與大比邱等即衆成就也與者共義顯聽非一人復有所共之衆故人非泛常故名為大依纂要有二義一名高謂稱譽廣遠是人皆知到處皆聞故二德重謂行業隆外現聲聞內祕菩薩故然此二義亦互相資以德重故顯名不浪得以名高故顯德是實有是則名德俱大故總以大稱比邱名含三義一破惡謂修戒定慧能破見思煩惱惡故二怖魔謂魔王驚怖恐出三界損其黨故三乞士謂離四邪命乞食資身利檀那故翻一遺二故存梵名五不翻中含多不翻和合名衆謂多人共住事理俱和事和則戒同持見同解利同均身同住口無諍意同悅理和則擇滅無為同證設不爾者雖多非衆也千二百五十人者佛初成道度憍陳如五人次度三迦葉波兼徒總一千次度舍利弗目犍連各兼徒一百次度耶舍長者子五十人經舉大數故減五人此等皆向修異道空無所獲遇佛得證感恩不捨為常隨衆也非無餘衆意準流通中知不具敘證信序竟二發起序發起者乞食往復食訖敷坐默示住降發起正說故亦名別序別在當經故亦名經前序未說經前先以相顯引發上根密令當機故爾時世尊食時著衣持鉢入舍衛大城乞食於其城中次第乞已還至本處飯食訖收衣鉢洗足已敷座而坐爾時者大衆成就機感盈前時也機感盈前不得不說說不遽說必待請問故爾默示住降以發當機之問端也世尊者十號之一成實論云具上九號為物欽崇故曰世尊天上人間所共尊故食時者人間飯食時也按金剛蒙引約十二時分四食分丑寅卯三諸天食分辰巳午三人間食分未申酉三畜生食分戌亥子三鬼神食分今論乞食且約辰時為言此有二意一者當日初分求乞易得不惱自他故二者乞已還園正當巳時如常齊法故著衣者著僧伽黎衣以律載凡入王宮及升座說法聚落乞食應著此故持鉢者持四天王所獻紺琉璃鉢以是維衛佛所遺之法器故又佛必著衣持鉢者亦是為衆作軌寓有四意一異俗二揀外三肅己四益他異俗者在家著樂多尚錦衣寶器縱恣身心出家異彼以身所著衣唯許粗疏麻布手所持鉢唯許鐵瓦二器故揀外者外道盲修裸形捧飯致招訶醜僧衆揀彼以伽黎著身不至裸露如畜應器持手不至摶食似鬼故肅己者衣像水田著之則身有所矜不敢妄行鉢唯應量持之則心有所限無復過貪故益他者有威可畏有儀可仰生他敬信故入者由遠及近自外向內纂要云園在城東南五六里故須入也舍衛乃中印名都故稱為大準西域記云國周六十餘里內城周二十里智度論云居家九億據此則地廣人稠亦可以大城稱之乞食者為欲顯示頭陀功德令放逸者知慙愧故準纓絡女經說化佛身如全段金剛無生熟二藏涅槃云如來之身非雜食身今云乞食者利益他故又佛教比丘離四邪命乞食自活故自乞食所謂有諸己而後求諸人也若準纓絡經說佛自乞食有十種意避繁不引今略取三意一折伏餘衆憍慢故二憐愍障閡衆生故三顯示不應畜積故折伏憍慢者以佛為王種出世成佛尚爾乞食何況餘衆豈可自生憍慢而不行乞憐愍障礙者如婦女受制老病無能等不得見佛不得行施皆名障礙佛為愍此自行乞食令其得見隨便行施示不應畜者以末法僧倫多事畜積致于非法佛慧預知因示乞食令知畜積法所不應於其城中者已到舍衛正當人民等居住處也次第者挨門沿戶無所揀擇必如此乞者依纂要有五意一內證平等理故謂佛性平等無有高下凡小未證此理遂於衆生見有差別佛既證此一體同觀以不見有貧富等相故能次第而乞二心無貪慢故無貪則不趣富貴無慢則不傲貧賤持心平等慈無偏利故能次第無所揀擇三表顯威德故以小乘律中不許入惡象家恐彼損害不許入淫女沽酒家恐生染心以其無有威德故爾禁制佛乞不爾故次第也四破二乘分別心故如大迦葉捨富乞貧意在令生福德須菩提捨貧乞富意在不欲惱他各有遮限皆為分別佛為破此故爾次第楞嚴云開闡無遮即斯意也五為息凡夫猜嫌故謂捨富從貧多致凡夫生猜捨貧從富多致凡夫生嫌佛以次第而乞二過俱免楞嚴云度諸疑謗即斯意也然此五意雖出纂要而釋義稍詳為取易明不費尋討後二義易前為後者為取順便易釋以猜嫌由偏乞致故乞而云已者非謂乞偏一城但滿鉢則已也還至本處者由城返園正當巳午如常齊法時也若論佛不須食為令他福得滿亦應隨衆以佛若不食他福不得滿故若依寶雲經說隨所乞得分為四分一擬與同梵行者二擬施貧病乞人三施水陸衆生四分自食十二頭陀經唯說三分除梵行者刊定記釋云以自乞故今約有因緣故不暇自乞者故應分與故梵行與貧病乞人而言擬與擬施蓋不一定以來者則與之施之不來則不須也若水陸衆生一定應施故不言擬然處字下文缺飯食影在下句以有訖即有正食時故飯食訖者無論美惡精粗一飽則訖也衣鉢不收心有勞慮不能成定故須收好佛實不爾但示現為後軌耳為護生故跣足行乞恐著塵染故須洗已而坐問阿含經說佛行離地四指蓮華承足何用洗為答不欲衒異隨順世間故敷座者自敷坐具於座魏譯云如常敷座以如來每說般若皆自敷坐具為般若是諸佛之母表敬法故今亦如常而坐者端身正住一念不生所謂身體及手足靜然安不動其心常淡泊未曾有散亂也魏譯云結跏趺坐今雖不言跏趺準常可知以諸佛坐必跏趺無異式故智論云見畫跏趺坐魔王尚驚怖何況入道人端身不傾動是故佛及弟子通依此法又跏趺有四種利益一由身攝斂速發輕安二能經時久不速疲倦三不共外道彼無此法四形相端嚴起他敬信由此四義可為後軌故知佛坐必用跏趺此是隨文銷釋若明發起正說意者有說著衣持鉢次第行乞通名為戒敷座而坐乃名為定意顯因戒生定因定發慧今以欲談般若深慧先示戒定而為發起此亦有理但本疏所取意在言外良以此經妙旨惟在降心住心要知一有所住則覺心便亡才欲施降而妄心愈熾是須以無降而降無住而住乃為真降心真住心也試觀世尊於未到食時其心本自不動一到食時便爾著衣持鉢入城便入初無繫念於祗園乞食便乞何曾有心於彼此以任繁華射眼佛自乞已還歸所謂如如而去如如而來於我本覺真心何曾動著絲毫此正如來密示住心法也遽爾收緣洗足敷座而坐一念不生萬慮皆亡五蘊既空四相何有此又如來密示降心法也準楞嚴經阿難乞食於未乞之先則曰方行等慈度諸疑謗等已有許多計算於將乞之際則曰徐步郭門嚴整威儀又有許多做飾於正乞之時則曰肅恭齊法然既曰肅恭則是住著是覺心已無所住至被摩登伽女攝入淫席其妄心又何能降哉兩經對觀則降心住心之旨思過半矣但此意人所難知唯有空生覷破故向下開口便讚又以如來境界非初心所能及由是連興二問以敬正說之端所謂發起者意在是耳敘分竟二正宗分四一略明降住生信分二推廣降住開解分三究竟降住起修分四決定降住成證分初四一當機誠請二如來許說三當機願聞四如來開示初二一承前讚善二因機設問初時長老須菩提在大衆中即從座起偏袒右肩右膝著地合掌恭敬而白佛言希有世尊如來善護念諸菩薩善付囑諸菩薩時即如來乞食還園食訖晏坐時也空生仰觀調御明明護念付囑俯察羣機昏昏如盲如聾正當請問故爾修敬讚德以啓發問之端長老者德臘俱尊之稱唐譯云具壽唯顯臘尊魏譯云慧命唯顯德尊空生兼二故什師以長老譯之須菩提當機人也含多義故經存梵名謂或翻空生以初生時其家庫藏空故或翻善吉以相師占云此子善吉不須慮故或翻善現以既生七日其家庫藏復現父母稱善故按西域記云是東方青龍陀佛影現釋迦之會示跡聲聞發揚空理據此則初生藏空等即後來解空之兆從座起者有所咨詢不應坐故如曾子避席之類偏袒右肩者執弟子禮取服勞之便右膝著地者示下役相取領命之速此上皆身業虔誠合掌者端秉一心恭敬者尊重其事此表意業虔誠而白佛言等乃發語讚歎又口業虔誠也去來動靜任運合道唯佛一人餘非所論空生見此不勝歎異故曰希有世尊天親論云善護念者依根熟菩薩說謂與智慧力令成就佛法與教化力令攝受衆生善付囑者依根未熟菩薩說懼其退失付授智者囑令教化此約起後意說謂先讚後請也今約承前另為一理言善護念者約未得住心者說言覺心難住或三月不違或日月一至如來時時加護心心憶念務令常得安住善付囑者約未得降心者說言妄心難降或對境而起或任運而興如來付以方法囑令降伏務令永以不生二俱言善者若待起心護念則護念有時若待發言付囑則付囑無多不名為善今以如來入城還園如如不動密示住心標榜後進正是加護憶念又以食訖晏坐一念不生密示降心模範新意正是付授誠囑如天不言四時運行而無閒地不言萬物生成而不遺是不唯護念付囑且二者俱善空生開口歎希良有以也孔子曰二三子以我為隱乎吾無隱乎爾吾無行而不與二三子者是邱也今佛不自說必待空生注破為令引發同類機故偈巧護義應知加彼身同行不退得未得是名善付囑合云上二句頌善護念義巧即善也護亦攝念謂身護必由心念起故應知者應知即在日用動用中也加即加被亦是護義彼指未得住心者言身指佛身同行者謂同行乞食之事蓋佛不須食但為加護於彼示現自身與其同行彼若果能同佛行處而行不患乎覺心不能住矣下二句頌善付囑義不退二字雙通得與未得言妄心已降則是不退已得妄心未降即是不退未得但降與未降得與未得初心不自覺知故如來示現食訖晏坐一念不生無妄可降即是降心彼若果能如佛降處而降即不退已得設未能者即不退未得當自黽勉務令同佛親切提持無踰此者故云是名善付囑也承前讚善竟二因機設問世尊善男子善女人發阿耨多羅三藐三菩提心云何應住云何降伏其心先稱世尊者示問有所屬故世尊去來動靜總為護念付囑空生雖知其奈餘衆未諭第恐妄擬聖境有類畫鵠故特舉善男善女等以問也男子以剛健為德女人以柔順成美此雖稱善猶通外教今言善男善女者顯是佛教中人以是宿植善根現從佛化之男女故發者許發謂許身於佛發起上求下化之心期證無上果也然義通能所以上之善男善女為能發下之阿耨等為所發故梵語阿耨多羅此云無上梵語三藐此云正等梵語三菩提此云正覺合云無上正等正覺言無上者究竟圓滿之號正等正覺者悲智雙運之稱以正等即悲謂平等普度無偏黨故正覺即智謂覺了自心離邪外故亦可正覺揀凡夫以凡夫有我不能自覺縱有所覺亦屬邪外非正覺故正等揀二乘以二乘無平等心不能修善度生縱有所度亦墮偏黨非正等故無上揀菩薩以菩薩雖修善度生不能修一切善度一切生猶有可上非究竟故故後文云以無我無人無衆生無壽者修一切善法即得阿耨多羅三藐三菩提是知無上屬果正等正覺屬因所發之心通乎因果先言無上者正是所求故欲求無上須假度生故次云正等欲度衆生要先自悟故次云正覺逆次而言即是自覺覺他覺圓滿也良以初發是心輕若鴻毛不能同佛隨緣安住故問云何應住意是求佛說出有何方法能令相應而住又以妄心數起狀如野燒不能同佛自然降伏故問云何降伏意是求佛說出有何方法能使任運而降然此二問亦互相資以覺心住則妄心不降而降妄心降則覺心不住而住所謂漢賊不兩立者可為譬耳當機誠請竟二如來許說二一讚善印是二誡聽許說初佛言善哉善哉須菩提如汝所說如來善護念諸菩薩善付囑諸菩薩空生二問皆有切於初心故重言善哉以讚之讚已呼名者示讚有所屬蓋明獎空生密感衆心也如汝所說者非印其所問乃印其讚佛之說猶云如汝所說者是矣如來二句原是空生讚佛之語今佛極力承當猶是欲令會衆於如來著衣持鉢去來動靜處薦取護念付囑之意二誡聽許說汝今諦聽當為汝說善男子善女人發阿耨多羅三藐三菩提心應如是住如是降伏其心汝今諦聽者諦有二義一者真實義謂誡以真實心聽勿得以生滅心而聽實相法故楞嚴云汝等尚以緣心聽法此法亦緣故須真心二者審思義謂誡以審思而聽勿得過耳成空如不聞故智論云聽者端視如渴飲一心入於語義中踊躍聞法生歡喜如是之人可為說故應審思具上二義既無緣心聽法之𠍴亦無漏文失義之過此而不說則為失人故云當為說也前當機設問原為善男善女發心者起見今如來許說故亦約善男善女發心者言之上云當為汝說但是許說不知當說何法此云應如是住等乃應其所問而再許之佛意以初發心人固不能如我所住如我所降亦自應有漸次住心漸次降心之法謂應當如是如是而住如是如是而降是知自下所說乃至正宗分盡唯一住心降心無異法也如來許說竟三當機願聞唯然世尊願樂欲聞文語曰唯野語曰阿皆應諾之詞故老子云唯之與阿相去幾何今於唯下繼之以然者蓋直應連應猶既云阿復言是也金剛鎞云聞有三種曰聞言曰聞義曰聞意聞言者耳根發識但聞於言聞義者意識於言採取其義聞意者神凝心一尋義取意良以說者依意而現於義由義而發於言聽者因言而尋於義以義而取於意得意忘義而遺言則近道矣今云願樂欲聞者知不唯聞言聞義將必至得意忘義而況於言乎觀後之涕淚悲泣自歎從昔未聞則願樂欲聞之語為不虗也若以字義釋者願是心許樂是好樂欲是希求若唯是心許而不好樂聞或不切又雖亦好樂而不希求聞或不深故曰願曰樂曰欲華嚴十地品云如渴思冷水如饑思美食如病思良藥如衆蜂依蜜我等亦如是願聞甘露法即願樂欲聞義也四如來開示三一開示降住二成就信心三較量持福初三一降心之方二住心之方三兼釋伏疑初三一標示二正明三徵釋初佛告須菩提諸菩薩摩訶薩應如是降伏其心佛告者前許今說也菩薩者略梵語具云菩提薩埵此翻覺有情釋有三義一約自利二約利他三兼二利約自利者謂覺已分證餘有情識故約利他者謂說法度生覺悟有情故兼二利者謂上求佛覺下化有情故摩訶薩亦略言也具言摩訶菩提薩埵摩訶云大謂是大菩薩故問請許皆為初心何故此約大菩薩說耶答此有二義一約發心勝劣二約說經前後發心勝劣者若發住相之心或滯有漏但稱菩薩今發離相之心定是無漏故兼以摩訶薩稱之說經前後者此經前後分為四分信解二分為初心說修證二分為深位說是則諸菩薩者對前二分稱之摩訶薩者對後二分稱之然菩薩與摩訶薩各有降心之法故兩言之前雖總許但以言不并彰且先示降心故再為別標而言應如是降又如是二字對上二種菩薩意含淺深猶言諸菩薩應如是如是而降以有信降解降異故摩訶薩應如是如是而降以有修降證降異故據此則上釋諸菩薩摩訶薩二義之中後義為正標示竟二正明所有一切衆生之類若卵生若胎生若濕生若化生若有色若無色若有想若無想若非有想非無想我皆令入無餘涅槃而滅度之如是滅度無量無數無邊衆生實無衆生得滅度者所有句總顯所度之廣一切者總該之詞衆處受生衆法相生各有其類繁難俱悉故以一切衆生之類該之若卵下略分十種異生從古注家所說各異有取楞嚴十二類生之義釋者然數既不符無庸強會有約受生差別依止差別境界差別之義釋者受生差別意指四生依止差別意指有色無色境界差別意指有想無想等但語出論文不甚曉暢今取易明略以三界各別收之胎卵濕化約欲界言以欲界五趣雜居四生具故如古德頌云人旁生具四人四生者常人胎生毗舍佉母卵生奈女濕生劫初之人化生旁生四者如正法念云化生金趐鳥能食四生龍餘可例知地獄及諸天中有唯化生三皆化生鬼通胎化二地行羅剎及鬼子母屬胎生餘皆化生也若釋其相者卵謂從卵殼出胎謂因胎藏生濕謂因濕氣有化謂因變化成楞嚴云卵唯想生胎因情有濕以合感化以離應蓋約一念之差而分四生之異上二界唯有化生生不具故不以生論有色約色界言雖有凡聖外道皆具身相故總以有色名之望欲界言色相勝妙故獨擅有色之名無色約空處言以其無身相故上三雖亦無身另有可稱故無色之名獨讓空處有想約識處言以其無色唯以想心相續為命故無想約無所有處言以其諸識都滅雖賴耶獨存而無分別分別尚無豈復有想故以無想名之非有想非無想即非非想處天也以此天欲盡賴耶深入滅定以定障故似賴耶盡故作非有想滅定稍虧似賴耶存故作非無想如楞嚴云如存不存若盡非盡是也此分二類楞嚴云此等窮空不盡空理從不還天聖道窮者如是一類名不回心鈍阿羅漢若從無想諸外道天窮空不歸迷漏無聞便入輪轉合前卵胎濕化乃至有想無想是為十種異生我皆下示以度生降心我之一字即指發心菩薩如來代彼說故若論菩薩不應計我為揀所度假名為我非彼凡夫遍計及外道邪計令者使令謂說法度之也而言皆令者顯示平等心故涅槃略梵語也具云般涅槃那此云圓寂謂無真不圓無妄不寂故秦言滅度謂證寂滅度生死故故下言而滅度之使華梵互影也無餘有二一約小乘若子縛已斷果縛猶存名有餘依以猶有最後身智為所依故若灰身泯智滯寂沈空為無餘依以不受後有無餘所依身故二約大乘若五住究盡二死永亡證轉依果住於涅槃為有餘依以猶有涅槃為所依故若不住涅槃還度衆生雖度衆生不住生死名無餘依以無餘涅槃無餘生死為所依故今約大乘言之準唯識論說有四種涅槃一自性清淨涅槃凡聖同有真本自圓而妄本自寂故二有餘依涅槃出煩惱障有苦依身故三無餘依涅槃身出生死苦無依故四無住處涅槃悲智相兼生死涅槃兩無住故四中初唯性具次二小乘後一大乘今是後一而滅度之之字非但語詞寓有證得之義若連上文則是令入涅槃而滅度證得也無著云何故願此不可得義生所攝故何故句難詞也意以五性衆生三分半不得成佛是不可得度者何故願皆令入是明知不可而虗發是願何所益乎生所句通詞也意以三分半衆生亦是衆生所攝既是衆生所攝莫不有心涅槃云凡是有心定當作佛何不可度又云卵濕無想有頂則不能云何普入有三因緣一難處生者待時故二非難處生未成熟者成熟之三已成熟者解脫之卵濕等亦難詞意以卵濕二生是畜生難無想有頂是長壽天難既有難緣所障則不能入云何普入普即皆也有三下亦通詞意以難處者納種待時非難處種未成熟者令成熟已得成熟者令解脫是雖種熟脫三淺深不同而今後中間遠近得度何不可入又金剛鎞云為菩薩者但當發此滿足之心行此滿足之行不必其一時即有此滿足之事地獄未空誓不成佛一夫不被若己溺之可證此義如是滅度等者正教以降心之法言一切衆生略明十類詳分則有無量無邊若待如是滅度恐無盡時此念一萌則是妄心設不能降其行必退故示以實無衆生得滅度者言實無衆生等依古德說有五義一性空故二同體故三本寂故四無念故五法界故今合本寂無念為一為順始終頓圓四教義故言性空者謂一切衆生緣會而生緣會而生則生法本無本無即性空義也言同體者謂自身他身同一真如真如無別豈復見有衆生為我所度言本寂者以無念故謂無念則無分別無分別則不見衆生故本寂也言法界者謂一真法界無法不融言我則一切皆我誰為所度言生則一切皆生誰為能度能度所度稱性混融豈復見有衆生滅度始終頓圓依次分配雖淺深不同同一無生滅度知此義者則終日度生不見生相一切衆生一時成佛盡亦可不盡亦可度亦得不度亦得既無疲勞焉有退墮此降心之第一法也正明竟三徵釋何以故須菩提若菩薩有我相人相衆生相壽者相即非菩薩何以故者徵起之辭言既曰如是滅度而又言實無衆生得滅者何也須菩提等乃重呼當機而釋成之意謂設若菩薩計我為能度則有我相計他為所度即有人相若更計所度無量無邊必待長時度脫則有衆生壽者二相如是度生必見退墮故云即非菩薩是知為遣四相故示以實無等以既無所度則無能度能所尚無況計數多及與時長則四相俱遣任運成就菩薩行矣偈廣大第一常其心不顛倒利益深心住此乘功德滿合云此通頌上科及此科義也言一切衆生我皆令入涅槃即廣大心不唯令入涅槃且是令入無餘涅槃即第一心實無衆生滅度不見生相則無疲勞即是常心為遣四相故言實無等即是不顛倒心如是利益成深遠心而住菩薩之行則此大乘自利利他一切功德皆圓滿也降心之方竟二住心之方三一正示其方二徵釋其意三勸如教住初三一標示二指釋三結示初復次須菩提菩薩於法應無所住行於布施降心約度生住心約布施者以度生降心難逆事難忍故布施住心難順境易入故復次等者謂復於降心之次再呼當機進示住心法也法該內外中間及自身報恩果報等法言但有所住則覺心便晦欲令覺心安住故示以於法應無所住修一切行皆當如此且約行於布施言之以布施率萬行之首又能含攝於萬行故偈檀義攝於六資生無畏法此中一二三名為修行住合云此頌布施能攝萬行之義檀略梵語也具云檀那此翻布施義含三施能攝六度此總標也資生句先釋檀義有三一資生即財施資養形命故二無畏施能與無畏故三法施隨機授法故此中句次釋攝於六義言此中第一資生即攝六度中布施謂一攝一也此中第二無畏即攝六度中持成忍辱謂二攝二也以持戒不殺忍辱不報能令人無畏故此中第三法施即攝六度中進禪慧三謂三攝三也以精進則為人不倦禪慧則能與授法故既三施能攝六度則六度可開萬行是知但行布施則為修菩薩行而住菩薩地矣標示竟二指釋所謂不住色布施不住聲香味觸法布施所謂者指釋之詞言上云應無所住者不住何等法也故云所謂不住等準天親論但指三事謂自身報恩果報今云不住六塵者以六塵即含三事謂若計六塵為己受用不行布施即是住於自身若於受者望其以六塵酬我即是住於報恩若計我能施將來得大福德即是住於果報是知不住六塵則三事皆不復住又三事中初有施物相次有受施相後有能施相既已不住三事則中間無物外無受者內無施者是為三輪體空如是布施乃成無漏因矣偈自身及報恩果報斯不著護存己不施防求於異事合云此通頌此科及上科義也上二句標斯字即指三事謂三事皆不著也下二句釋護猶遮也亦同下句防字存為己想不行布施是所應遮以住自身相故防猶止也異事者異含二義一對自名異求異事即是望彼酬我二對因名異求異事即是要來世福此二皆所應防以住報恩及果報相故指釋竟三結示須菩提菩薩應如是布施不住於相菩薩者即前發心菩薩示以應如是布施等者以不住於相則安住覺心一色一香有施皆回向菩提一聲一味無因而不契佛果發菩提心願成佛果者理應爾也正示其方竟二徵釋其意何以故若菩薩不住相布施其福德不可思量須菩提於意云何東方虗空可思量不不也世尊須菩提南西北方四維上下虗空可思量不不也世尊須菩提菩薩無住相布施福德亦復如是不可思量文分三義一徵釋二喻例三法合在文可見初中徵者謂以何以故而言應如是布施等耶釋中言不住相布施福德不可思量者以是無漏因故反顯住相布施縱有福德亦可思量以是有漏之因如永嘉云住相布施生天福猶如仰箭射虗空勢力盡箭還墜招得來生不如意爭似無為實相門一超直入如來地是也喻例中首舉東方虗空者以是方之首故不住之施是無漏因如虗空性不可破壞故以虗空喻之正以虗空不可破壞所以橫遍豎窮難可思量以喻無漏之因廣大甚深非心識思量所能及也問以可思量不者令其因喻知法答以不也者是空生於喻中已知故更以南西北方四維上下虗空喻者顯空不住方隨方異稱以喻無漏之因不住諸位隨位各證雖隨位各證亦互相攝故皆以不可思量喻之蓋欲以一空知一切空一位見一切位故法合中言不住相施福德亦如是等正見如來所謂應如是布施等者非無謂耳徵釋其意竟三勸如教住須菩提菩薩但應如所教住言如上所教即是住心之方而發心菩薩但應如我所教而住無勞別求住心之法住心之方竟三兼釋伏疑偈調伏彼事中遠離取相心及斷種種疑亦防生成心合云此是結前起後頌也調伏彼事中謂調攝覺心令住於彼行施事中降伏妄心令滅於彼度生事中遠離取相心者若見有生可度有施可行皆為取相前於度生則曰實無衆生等於行施則曰不住色聲等則是於取相心已能遠離此結前也及斷種種疑亦防生成心者謂及此又復斷種種疑亦是防其因前生疑及展轉成疑之心此起後也經文分二一釋因生疑二防轉成疑初疑云布施一法通乎上下下濟衆生不住生相可矣以為超有漏因故上供諸佛豈可不住佛相然佛是無漏不住佛相恐不成無漏之因施何益哉為有斯疑故爾釋斷須菩提於意云何可以身相見如來不不也世尊不可以身相得見如來何以故如來所說身相即非身相於意云何者探問之詞也如來意謂設汝疑佛相為可住者吾今問汝於汝意地之下以為云何將謂可以金色之身三十二相得見真如來不若果以身相得見是則可住設不爾者則非真實云何欲住而要依之成無漏因其猶以手攀空而欲依之為不墜因固知其不可得矣答以不也者因問方醒不可以身相得見者是空生已知雖上供諸佛佛相亦不可住良以法身如水報身如水面之光應身如光所現影若認影為真而欲依之必遭陷溺之患故不可也二防轉成疑二一防報相可住疑二防究竟無佛疑初疑云應化之身三十二相固不可住或別有報身無量相海為可住耶恐轉此疑故爾防斷佛告須菩提凡所有相皆是虗妄佛意不惟應化身相為不可住即報身無量相海亦不可住良以報身如水面之光光即是水豈離水而有光是知報相即是法身豈離法身而有報相特由十地菩薩微細念相不盡妄見有報身無量相海若住此相不見法身故總遣之曰凡所有相皆是虗妄蓋是令其不住報相親見如來真法身故二防究竟無佛疑疑云報化不住法身無相又不可見將究竟無佛可供耶恐轉此疑故爾防斷若見諸相非相即見如來佛意以住應相仍滯有漏住報相不見法身其猶住影有陷溺之患住光無得水之益若見應報諸相非是真相不生住者不唯報身是佛而應身亦是佛其猶識影是幻了光無體不惟全光全水而全影亦全水故云即見如來謂親見如來真法身故是知但不住相供報應佛即是供養法身如來不患其不成無漏之因豈究竟無佛可供哉偈分別有為體防彼成就得三相異體故離彼是如來合云此總頌因生疑及轉成疑中義也分別有為體者分別指能緣心智有為體指所緣佛身佛身有報有應分別有粗有細雖有粗有細同一未離念相故總名分別雖有報有應總是修因所成故同號有為如唯識云應身有為有漏報身有為無漏可證此義防者不可義防彼成就得者謂不可以此有為身相成就建立得見如來義故三相句具釋上成下二義釋上者言有為身相不可以成就得者正以既屬有為即具生住滅之三相非是法身體故成下者正以有為之身屬於三相非是真體所以離彼即是如來言離彼者即是不住於相不住於相全相全真故云是如來也總結開示降住竟二成就信心四一顯信具德二展轉徵釋三結示進信四重釋伏疑初二一深生實信德二一念淨信德初三一當機問信二如來答有三顯示其德初須菩提白佛言世尊頗有衆生得聞如是言說章句生實信不上文因取無漏果取無為因果俱深取信良難以衆生修因多著有漏期果多趣有為故當機恐有不信失大利益故白佛以問也頗者可也還也問以可還有者即恐有不信之意言說二字義通能所佛為能言說章句為所言說蓋通指因深果深文也文中有章段有句逗故言章句此但舉能詮即該所詮以章詮大旨句詮細義不言可知故實信者非但信其章句必能信其旨義以但信章句為浮兼信旨義乃實如才聞度生無相行施無住便信其為無漏之因才聞不以相見離相是佛便信其是無為之果決定忍可不生疑懼是為生實信者不者兩可之詞應上頗字蓋是問以或有或無希佛明示耳魏譯云頗有衆生於未來世等意以佛答有如來滅後等言故爾足譯取問答必相應故今本不言於未來世者意以空生恐現在即有不信如來答後世尚有能信有以後況今意故或亦梵本原無故什師不譯當機問信竟二如來答有佛告須菩提莫作是說如來滅後後五百歲有持戒修福者於此章句能生信心以此為實佛意以高山流水自有知音耳提面命豈無信者故教以莫作是說恐中下之機以難信生怯怖心耳又莫作是說者示以莫說現在故向下約未來以況如來滅後正法像法各一千年末法一萬年於中初五百歲解脫堅固次五百歲禪定堅固三五百歲多聞堅固四五百歲塔寺堅固五五百歲鬬諍堅固今云後五百歲者當末法五百年正是鬬諍堅固顯當惡世時也持戒者三聚精修修福者三施齊行此二為能信之緣顯破戒無福者不能信故良以持戒者必信罪福修福者必信因果故曰於此章句能生信心而言以此為實者以無漏因為真實之因以無為果為真實之果決定忍可不生疑懼空生所問實信是也此中有兩重況顯一滅後尚信何況現在二後五百歲尚信何況前四且不可以難信生怯有失大利偈說因果深義於後惡世時不空以有實菩薩三德備合云此單頌此科義也因取無漏果取無為即指前之所說揀彼有漏有為故曰深義以彼為淺義易知信故於後惡世時即指如來滅後後五百歲時也不空二字應作逗謂教不空設以有實三字連下讀之謂以有真實菩薩持戒修福生信三德備故是蓋以戒德福德助成信德也三顯示其德當知是人不於一佛二佛三四五佛而種善根已於無量千萬佛所種諸善根言生信固以戒福助成戒福亦由宿善所發故曰當知是人不於一佛二佛三四五佛而種善根意以見佛若少供佛聞法亦少供佛聞法既少宿世善根不深現世未必能持戒修福而助成信心信心豈易言生哉已於無量千萬等者正顯其見佛多供佛多聞法多善根既深乃能於現世之中持戒修福助成信心據此則欲信般若者當願生生世世見佛供佛聞法種善根也偈修戒於過去及種諸善根合云此亦單頌此科義也意以今生持戒亦由修戒於過去佛時今生修福亦由種善於過去佛時蓋善習致之然也經中但云種善亦該持戒以戒亦善法攝故深生實信德竟二一念淨信德聞是章句乃至一念生淨信者須菩提如來悉知悉見是諸衆生得如是無量福德佛意以宿種善根今生實信得福無量不待言矣設有聞是章句或經年受持或月日讀誦乃至不必如此但只一念之間頓空四相於此因果深義生清淨信無介纖疑者其所得福德亦非淺鮮故重呼當機而再告之言如來悉知悉見者顯其得福無虗天親論云若不說見或謂如來以比智知若不說知或謂如來以肉眼見故須二語意顯如來知處悉見非比智知見處悉知非肉眼見故得如是無量福德者謂亦得如是前人無量福德良以頓漸雖殊能信無二況後云信心清淨即生實相其所得福德豈讓前人哉偈戒具於諸佛亦說功德滿合云此亦單頌此科義也言雖一念淨信亦由持戒具足於過去諸佛之所不言種善者戒亦該善以三聚中有善法戒故亦說功德滿者如來悉知悉見其功德自應無量故亦同前人說其功德圓滿總結顯信具德竟二展轉徵釋三一承徵承釋二轉徵轉釋三再徵再釋初何以故是諸衆生無復我相人相衆生相壽者相無法相亦無非法相初徵起言如上所說二種能信之人以何義故得無量福德耶是諸下釋成無我相者即已達我空無我執也纂要云執取自體為我計我展轉趣於餘趣為人計我盛衰苦樂種種變異相續為衆生計我一報命根不斷而住為壽者前一為本後三皆依我上而起此總一我相也無法相者已達法空無法執也無非法者已達空空無空執也以非法即是空無非法即并空亦空故然既三空俱朗見處同佛如是而信宜乎其得福無量偈彼壽者及法遠離於取相亦說知彼相依八八義別差別相續體不斷至命住復趣於異道是我相四種一切空無物實有不可說依言辭而說是法相四種彼人依信心恭敬生實相聞聲不正取正說如是取佛不見果知願智力現見求供養恭敬彼人不能說合云此單頌承徵承釋義也於中前十六句合頌無我無法後四句別頌亦無非法前中首二句略明二相俱離彼字指能信之人壽者即是我相及法即是法相不言我相而云壽者者以我相有四壽者難破菩薩以別代總令知壽命無常則我相易攻餘亦易破耳遠離於取相者謂於我於法已能遠離取相心也亦說下是彌勒許彼之詞言不唯佛說彼能離於我法我亦說其知彼我法二相云何知也言我法二相相依而生八相則有八義差別下偈自見差別者盛衰苦樂種種變異相續者前滅後生即衆生相所依之體計以為我即是我相相續不斷而至計命久住即壽者相計我展轉復趣異道即是人相是皆依我執起故云我相四種一切者總該諸法即是有相若了性空本無有物即是空相若謂二俱實有此不可說謂不可說其實有空義實有有義即雙非相為度衆生離二邊故依言詞而說有依言詞而說空即雙亦相是皆依法執起故云法相四種彼人者仍指能信之人依信心者依於二種信心恭敬者尊重於法尊重於法心開意解實相理顯義言生也實相既生依實相而聞法雖聞說我之聲不直取於我相雖聞說法之聲不直取於法相故云聞聲不正取正猶直也若說我空法空是為正說如是取者謂依佛所說如是而取二空義故故經云無我相無法相也佛不下四句頌無非法言上云如是而取亦非決定取於空義以何義故不決定取耶以佛不見果知故果者決定義謂佛不立見我決定知二空義故若爾何故說空但以大願大智力故為遣二執示現見有我空法空之義此法唯佛能說若世間邪師及佛教之為利說法者求供養求恭敬彼人不能說此是知能信之人隨順佛意亦不決定取空故經云亦無非法相二轉徵轉釋何以故是諸衆生若心取相即為著我人衆生壽者若取法相即著我人衆生壽者初轉徵言上許是諸衆生無我無法兼無非法者何以故耳是諸下轉釋言無論我相法相非法相但若心中有所取相即著我人衆生壽者以既有所取之相即有能取之我既有能取之我則人等三相相依而興既四相依然豈能於此離相因果深生實信及頓生淨信也哉若取下防辨恐有辨云二乘已達我空但取法相似應無我何言若心取相即著我人衆生等耶故此防云若取法相即著我人衆生壽者三再徵再釋何以故若取非法相則著我人衆生壽者是故不應取法不應取非法何以句再徵若取下再釋以若取非法尚著四相況復取法不言可知總以能所未忘我未真空圓覺經迷智四相可證此義迷智四相者心有所證不忘能所為我悟我為非此智不祛為人了我人非存有所了為衆生覺所了者業智潛續為壽者詳在彼文茲不繁述是故下總結謂以是上來取法取非法皆為著我義故所以汝諸聲聞雖不取我還要知不應取法不應取非法以但有能取即屬我相故也此上二科彌勒不頌者以是相因而說非正意故總結展轉徵釋竟三結示進信以是義故如來常說汝等比邱知我說法如筏喻者法尚應捨何況非法以是義故者謂以是我相法相非法相三相皆不應取之故所以如來尋常作是說也汝等比邱知我說法者是如來尋常之間呼諸比邱教以應知我所說法之意如我初說我空為度我執次說法空為度法執後說空空為度空執故曰如筏喻者言初結小筏為渡河而至江次結中筏為渡江而至海後結大筏為渡海而至寶山是知守小筏不能渡江守中筏不能渡海守大筏不能上山採寶是三筏雖有勝劣而及時俱應捨離佛法亦然故云法尚應捨此中法字不同前法相之法蓋是指佛所說法下句非法亦不同前之非法蓋是指世間所有名譽利養等事言佛所說法及時尚應捨離何況世間名譽利養等非佛法者益應無所取著此又世尊為後世之口口談空步步行有者作解粘去縛法耳偈彼不住隨順於法中證智如人捨船筏法中義亦然合云此是約義而頌文勢與經文稍異經文承三相俱不應取引尋常所說為喻此中指能信之人直取捨船筏為喻若釋其義者彼指能信之人信知佛所說法皆為隨順時機不生住取故曰彼不住隨順但於佛所說法隨分取證故曰於法中證智智謂我空智法空智空空智也雖證三空之智然亦不住三空故曰如人捨船筏以喻方法法必同喻故曰法中義亦然結示進信竟四重釋伏疑三一防疑示問二當機裁答三徵起釋成初疑云如上所說一切皆不應取不合有得有說何故如來得道說法為防斯疑故先示問須菩提於意云何如來得阿耨多羅三藐三菩提耶如來有所說法耶佛意以實際理地一法不立建化門頭一法不少若謂有得有說即墮常見亦違前語若謂無得無說又落斷見亦乖化門故問以如來得菩提耶如來有所說法耶觀二耶字則如來已操必勝之勢左來左擒右來右擒且看空生識機不識機耳古德云辭雖得否雙兼意則在於無得此說似不解空生答詞二當機裁答須菩提言如我解佛所說義無有定法名阿耨多羅三藐三菩提亦無有定法如來可說空生亦善戰老將借彼之勢還攻於彼故曰如我解佛所說義蓋即指前說一切皆不應取之義意以雖一切皆不應取亦非一向無得但只無有定法名阿耨菩提以凡言得菩提者俱屬應化之身有機則現無機則隱故亦非一向無說但只無有定法可說以凡言說法者俱屬方便有機則說無機則默故是知有得有說固不可說無得無說亦不可說則空生可謂善解中道者矣雖然不因提起幾乎忘却偈應化非真佛亦非說法者合云意以應化之身隨機隱顯故非真佛此頌無定法可得方便之智隨機說默故非說者此頌無定法可說三徵起釋成何以故如來所說法皆不可取不可說非法非非法所以者何一切賢聖皆以無為法而有差別首句承徵蓋承前雙徵得無定得說無定說意也如來下承釋單釋說無定說者以說例得故如來句通指昔年所說皆不可取者謂不可有能取所取執故所謂遠離諸性相能取所取執是也不可說三字連下讀之通貫非法及非非法言不可說非法者謂不可說其不是法以是如己所證漸次說故言不可說非非法者謂不可說其是法以既是漸次而說皆為方便非真實義故所以句轉徵言既不可說非法又不可說非非法所以然者何也一切下轉釋一切賢聖者總該三賢十聖佛也無為者自性清淨之心本自具足非作得故故曰無為三乘賢聖離此無可取證故曰皆以謂皆以無為法為所證故賢聖既爾如來亦然皆知如來凡有所說皆依自證無為豈可說其非法而有差別者謂雖以無為為證而賢聖地位不同前後淺深有異是知如來凡有所說皆為隨順機宜方便非真豈可說其非是非法所說既爾所得亦然以是如其所得說故既可例思故不另釋亦可以何以下釋說無定說所以下釋得無定得言既皆以無為不可說有得以本自具足故而有差別不可說無得以宛有位地故若準彌勒之偈前意為正以彼亦唯釋說故如下自見偈說法不二取無說離言相合云上句頌不可取謂佛所說法不可於中有能取所取二種執故下句頌不可說非法非非法謂佛所說法無能於中說非說是以法離言相不可說故伏疑既破淨信斯生總結成就信心竟三較量持福三一能較量二所較量三釋伏疑初須菩提於意云何若人滿三千大千世界七寶以用布施是人所得福德寧為多不須菩提言甚多世尊何以故是福德即非福德性是故如來說福德多開口便言於意云何者欲其著意故後皆倣此若人者謂設若有人以下所說乃假設之事故三千大千世界者俱舍偈云四大洲日月蘇迷盧欲天初禪各一千上覆一二禪名一小千界此小千千倍上覆一三禪說名一中千此中千千倍上覆一四禪名為大千界論偈義少不周雙書小字乃今疏加之末二句亦少更易詳論意蓋是以三次言千疊成大千世界謂三千之大千依士釋也七寶者金銀琉璃玻璃硨磲赤珠瑪瑙見彌陀經佛意以大千地廣七寶珍貴以珍貴之七寶滿大千之界地用為布施其福可謂勝矣寧猶可也問以可為多不者欲假此福形顯下之二福為最勝故答以甚多者已諭佛意故恐招濫許之難故又徵起而瓜豆之言是福雖勝但是財施所感有為有漏名福德相即非法施所感無為無漏名福德性即此二語已顯此福不及下之二福以相屬可壞性是不可壞故又相有分限性屬無分限故是故如來四字略斷一斷說福德多另作一句猶云以是非福德性之故今對如來說以福德甚多以有分限故意顯若是福德性者我則不說甚多以無分限故也能較量竟二所較量若復有人於此經中受持乃至四句偈等為他人說其福勝彼何以故須菩提一切諸佛及諸佛阿耨多羅三藐三菩提法皆從此經出科首應有佛言或須菩提字樣以此下皆屬佛語或譯者脫故若復有人者謂設更有人於此經中者即指前所說淨信既生為義略周故得以此經稱之是知自下所說但推廣此中之義受持者領受執持謂文義雙攝且約自利言之乃至者超略之詞謂多則全分半分少則乃至四句偈或再少而至一句故置等言問上唯長行何以言偈答此有二說一者不必一定四言五言七言但以四句義周則為一偈如圭峯指凡所有相四句可例二者長行恐難記憶貫成伽陀如慈氏依經作偈之類為他人說者以己所見說之於人乃約利他言也其福者即指持說之福勝彼者超過前人以是法施所感無為無漏是福德性故恐猶未明故再徵釋一切諸佛者能證人也阿耨菩提者所證道也皆從此經出者有三因緣一者是福德性性能隨緣隨修因之緣而成佛隨成佛之緣而證道故二者經是信分能生淨信為道之元為功德母故三者信心清淨即生實相實相無為成佛證道皆以無為有差別故偈受持法及說不空於福德福不趣菩提二能趣菩提於實名了因亦為餘生因唯獨諸佛法福成第一體合云前四句總頌能較所較受持法及說者謂受持此法乃至四句偈等為他人說也此具二種福德一持二說空猶徒也不空於福德者謂此持說不徒說於福德且是福德性故意顯財施徒說福德但是福德相耳福不趣菩提者謂財施福德不趣菩提以是有為有漏福故二能趣菩提者謂此持說二福能趣菩提以是無為無漏福故校量文勢與經少異經中以財施校法施顯法施福勝此中以法施校財施顯財施福劣其意一也後四句別頌徵起釋成偈無徵詞準經中說故若取周備應補徵詞云所以趣菩提以何因緣故再接本偈讀之義則暢矣實即本覺亦即衆生自性久隱情識唯持說可了故曰於實名了因餘即始覺亦即菩薩地位萬行修習唯持說得生故曰亦為餘生因此猶未顯極勝唯獨諸佛及法皆以此福所成此福乃第一最勝有真實體所謂能趣菩提者以此所校量竟三釋伏疑疑云如我前言得無定得說無定說佛既無詞即是忍可佛今又言佛及佛法從此經出然佛法有出似是菩提可得是經能出似有此法可說得毋前後相違令兩處義宗皆不成耶釋云須菩提所謂佛法者即非佛法言我所謂諸佛菩提及所說法者即非諸佛菩提及所說法以佛本無我雖成佛不見成相雖得菩提不見得相雖說法不見說相仍與前語不相違反復何疑哉偈不可取及說自果不取故合云取者證義不可取及說者謂不可說有菩提可證及有法可說此明得菩提不見得相說法不見說相自果即佛謂成自佛果也不取者於成佛時不生執取此明成佛不見成相故者通承上三謂以是三相俱不見故所以與前所說義不相違總結大科略明降住生信分竟
