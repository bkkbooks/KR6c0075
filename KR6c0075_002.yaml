body:
  text: 京西山敕建香界寺傳講沙門通理謹述二推廣降住開解分降心住心事非一端故須推廣略聞已隨語生信廣聞合依義開解此復有三一推廣降住二成就解慧三顯示經功初三一正與推廣二略示周足三盡斷餘疑初二一推廣降心之法二推廣住心之法初四一初果離相二二果離相三三果離相四四果離相初須菩提於意云何須陀洹能作是念我得須陀洹果不須菩提言不也世尊何以故須陀洹名為入流而無所入不入色聲香味觸法是名須陀洹佛意以前示降心唯約度生恐於證果時依然不能降伏故此又約小乘四果以推廣降心之法須陀洹者小乘初果之名梵語須陀洹此云入流謂於凡夫地中發出界取滅之心以十六心斷三界見煩惱盡乍見空理得入聖人之流類故或云預流謂雖非極聖亦能參預於其類也然雖乍見空理而已知無我昧理故念自然不能如來問以能不者亦明知不能而故問焉我即我相是知能作念者則我執俱在有違空理空生乃過來之人故直以不也答之言入流聖人斷不能自昧其理故作有我之念是固知其無我相矣又雖曰無我若我所不忘我相猶未全離故承此徵起以進明我所亦無言須陀洹不過名為入流而實無所入以空無形相豈真有所入之跡既無所入之跡所謂依空理而入聖流者亦唯名字而已然名不虗彰必有所以故云不入色聲香味觸法是名須陀洹言不入色等者約斷見為言以見惑乃對境分別既斷見惑則無對境分別故云不入色等以色等皆所對境故是但不入於此義似入彼故以入流為名豈真有所入哉知此義者則不唯無我兼亦無有我所二者俱無乃真無我無我則無念無念則無妄可降如來示問良有以也二二果離相須菩提於意云何斯陀含能作是念我得斯陀含果不須菩提言不也世尊何以故斯陀含名一往來而實無往來是名斯陀含斯陀含者小乘二果之名梵語斯陀含此云一往來謂前於見道位中已斷見煩惱盡今於修道位中先斷欲思但欲界思惑有九品謂上上品上中品上下品中上品中中品中下品下上品下中品下下品也上上品潤二生謂兩生天上兩來人間方能斷故上中品上下品各潤一生是上三品合潤四生也中上品潤一生中中品中下品共潤一生是中三品合潤二生也至此已斷欲思前六品即證二果餘有下上品潤半生下中品下下品共潤半生是下三品合潤一生謂一往天上一來人間即斷以是二果名一往來然入理既深益不能昧理作念亦故問也答意準前可知何以下亦進破我所之執言斯陀含不過名一往來而實無有往來以我空理中豈有往來之跡既無往來之跡所謂依空理而證一來果者亦唯約已斷前六品思是名斯陀含耳降心意準上可知三三果離相須菩提於意云何阿那含能作是念我得阿那含果不須菩提言不也世尊何以故阿那含名為不來而實無不來是故名阿那含阿那含三果名也梵語阿那含此云不來謂前於二果位中進斷欲界下三品思即證三果自此欲界無潤生之感不復還來受生以是義故名為不來然入理又深猶其不能昧理作念故問實答俱同前說徵釋中言阿那含亦不過名為不來而於我空理中實無不來之相但以欲界無潤生之惑是故假立名字為阿那含是亦以理中本無進破我所執也四四果離相二一問答顯離二引己作證初須菩提於意云何阿羅漢能作是念我得阿羅漢道不須菩提言不也世尊何以故實無有法名阿羅漢世尊若阿羅漢作是念我得阿羅漢道即為著我人衆生壽者阿羅漢四果名也雖具三義為順一來不來義故且約不生釋之謂前於三果位中欲界思盡上生色界於那含天中進斷上二界七十二品思惑盡超出三界永不受後有之生故以不生為名然見理既圓深證無我自不能作有我之念亦故問而實答也徵釋中言實無有法名阿羅漢者以我空理中實無不生之法可名羅漢以理無形相既不見生豈有不生之相所謂尋名責實實無當名之義則我所亦空矣作念我得羅漢即為著我等者以我我所執二俱在故我相既在餘三可知以皆依我相生故問答顯離竟二引己作證世尊佛說我得無諍三昧人中最為第一是第一離欲阿羅漢世尊我不作是念我是離欲阿羅漢世尊我若作是念我得阿羅漢道世尊則不說須菩提是樂阿蘭那行者以須菩提實無所行而名須菩提是樂阿蘭那行恐謂念在於心作與不作誰其見之故重啓世尊而引己作證佛說者指在異時謂佛於異時曾有此說但未見教乘耳無諍三昧者理無能所事忘角立不與物競名曰無諍初修勉強不成三昧久而自然則三昧成矣如涅槃云須菩提住虗空地若有衆生嫌我立者我當終日端坐不起嫌我坐者我當終日立不移處由此不與物競物無勝者故於人中最為第一不但人中最為第一且是第一離欲羅漢以無諍由於離欲無諍之極即離欲之極是羅漢雖皆離欲而空生猶為第一以是任運離欲不假功勳即此可為降心標準況是佛說足徵不虗於此不矜倍更為難空生不爾故重啓世尊而云我不作是念我是離欲阿羅漢空生所以作是說者意顯我已至此尚不作念況餘羅漢其不作念也必矣又恐謂汝今自說不作是念誰其信之故再啓世尊而言我若作是念我得阿羅漢道則是我及我所二執俱在佛則不說我須菩提是樂阿蘭那行者以阿蘭那此云離誼亦云寂靜即無諍義其意以我我所執為誼諍本即不寂靜若俱在者世尊豈妄許哉此反顯也下乃正明正以我須菩提實無所行之念而世尊乃名我須菩提是樂阿蘭那行此中行即是作名亦同說但略變其文耳然推廣降心偏約小乘四果說者意顯降心不難但如小乘四果離於我我所相足矣偈依彼善吉者說離二種障合云上句者字應連下句說字此通頌四果四段以四段皆依善吉者說故離二種障即是所說之義謂說初果離見惑障說後三果離思惑障以能障我空理故又見惑即我執分別思惑即我執俱生離二則無我無我即降心法也總結推廣降心之法竟二推廣住心之法二一修因無住二得果無住初三一得記無住二嚴土無住三總以結示初佛告須菩提於意云何如來昔在然燈佛所於法有所得不不也世尊如來在然燈佛所於法實無所得佛意前示住心唯約布施恐於修因期果依然不能安住故此又約得記嚴土等以推廣住心之法然燈佛乃釋迦第二僧祗授記本師故自述云如來昔在然燈佛所蓋昔之一字即指第二僧祗說也如來於爾時已登八地似於授記之法實有所得其實不爾故問以有所得不佛意以有得即有住有住則覺心不能住矣答以不也者是空生已知如來於授記法無所得也渾言不也恐不明顯故又以如來在然燈等而申明之良以所得之法唯是自心自智所現不從授記而得是知所謂授記者亦唯授記語言名字而已既唯語言名字知不應住不應住則不住不住則覺心常住如來示問蓋為此也偈佛於然燈語不取理實智以是真實義成彼無取說合云首句謂佛於昔日在然燈佛所蒙彼授記語也不取者謂於彼授記之語不生住取以授記中實無有法為可得故若爾位登八地證無生忍彼無生理何所自耳以其理實唯自智所現故曰理實智也以是真實義者謂以是自心自智中所現真實義故所以雖能成就彼忍而亦無取於然燈所說故云成彼無取說也得記無住竟二嚴土無住須菩提於意云何菩薩莊嚴佛土不不也世尊何以故莊嚴佛土者即非莊嚴是名莊嚴雖得記無住恐於嚴土時猶未忘懷故此又約嚴土以明無住莊嚴佛土者因中於此行道果上於此成佛則行道者正莊嚴果上之報土也依於此義似有土為可嚴其實不爾故問以莊嚴佛土不佛意以有嚴則有住覺心不住亦同上說答以不也者空生已知無土為可嚴也何以句徵莊嚴下釋言所謂莊嚴佛土者唯是莊嚴自心非是莊嚴報土故曰即非莊嚴良以果上報土皆是唯心唯識所現莊嚴自心即是莊嚴報土以心淨則佛土淨故是知所謂莊嚴者但是名字故曰是名莊嚴既是名莊嚴則嚴土不應住偈智習唯識通如是取淨土非形第一體非嚴莊嚴意合云首句言菩薩欲嚴報土必先依觀照般若修習唯心識定若了三界唯心萬法唯識即是通也次句言既了三界唯心萬法唯識即依如是唯心唯識之義而取淨土是則所嚴者非形相之土乃第一義諦而言體者以第一義諦即是自心為諸土體故末句結會經文言所謂非形者即經中非莊嚴意所謂第一義諦為諸土體者以心淨土淨即經中名莊嚴意也嚴土無住竟三總以結示是故須菩提諸菩薩摩訶薩應如是生清淨心不應住色生心不應住聲香味觸法生心應無所住而生其心是故等者謂以是上來二俱不住之故呼須菩提而結示之意以大凡諸菩薩摩訶薩於一切時一切處皆應如是不住而生清淨之心蓋清淨心即指覺心說也不應住色生心者謂見色之時不應住著於色而生其心以住色生心即妄心故不應住聲等生心例此可知應無所住者謂應於一切法都無所住都無所住而生其心即是覺心夫如是則覺心常住總結修因無住竟二得果無住須菩提譬如有人身如須彌山王於意云何是身為大不須菩提言甚大世尊何以故佛說非身是名大身雖修因無住猶恐於得果時未能忘懷故此又約果報身以顯無住也譬如有人意喻大乘菩薩願行周圓果報於色究竟處示現一切世間最高大身故以須彌山王喻之既以須彌山王為喻似是最高大身其實不爾故問以是身為大不佛意以若取於相不名為大以有數量故蓋須彌者四洲中央大主山也梵語須彌此云妙高體是四寶所成故名為妙出水八萬四千由旬故名為高超出七金之上故名為王然出水既唯八萬四千由旬是雖大而有數量可紀答中不唯言大且言甚大蓋須菩提亦知如來所說不取於相故徵釋中言佛說非身者謂佛雖說身如須彌非是取於有相之身所以我說甚大以離相觀身絶數量故若唯取於有相之身不過是名為大非是真大既非真大則報身可無住矣偈如山王無取受報亦復然遠離於諸漏及有為法故合云首句先約喻言謂如彼山王雖高雖大而不自取我高我大以山王無住心故次句乃以法合謂佛受果報之身而亦不取果報以佛無住心故準喻可知故云亦復然也不住果報即果報而見法身故曰遠離諸漏及有為法以法身是無為無漏性故無為無漏之性橫遍竪窮彼報身者又何足為大哉總結正與推廣竟二略示周足三一校量持福二取劣況勝三請示經名初二一能校量二所校量初二一極顯恆河沙多二極顯寶施福多初須菩提如恆河中所有沙數如是沙等恆河於意云何是諸恆河沙寧為多不須菩提言甚多世尊但諸恆河尚多無數何況其沙恆河中沙其細如麵以沙論數可謂其數多矣又復以如是沙計河之數與沙數相等之恆河其河可謂多矣是諸恆河所有沙數自然甚多問以寧為多不者佛不自說欲令空生答出借此顯下界數多故空生答以甚多而又言但諸恆河等者正以見所答之不虗耳二極顯寶施福多須菩提我今實言告汝若有善男子善女人以七寶滿爾所恆河沙數三千大千世界以用布施得福多不須菩提言甚多世尊我今實言句說雖在此意為所校量福恐福勝難信令其必信故爾猶彼也爾所恆河者謂彼諸所有恆河即指前一恆河沙所計恆河言也沙數三千等者又以此多河中沙而計世界之數則世界甚多可知而乃以七寶滿中用為布施其得福甚多不待言矣問以得福多不者亦佛不自說欲令空生答出為下持說之福作能校量故答以甚多者不知持說之福猶勝於此也總結能校量竟二所校量佛告須菩提若善男子善女人於此經中乃至受持四句偈等為他人說而此福德勝前福德乃至受持等準前可知而此福德勝前福德者前是有為有漏此是無為無漏福故蒙引云恆沙寶施不了自心持說此經言下見性見性成佛福孰可校故說此福勝前古德云摩尼一枚壓倒海寶千般可為此譬校量未久重復校量者義漸深故偈說多義差別亦成勝校量後福過於前故重說勝喻合云上二句頌重復校量意言多義差別者指解分以來所說謂望前信分有多種不同如前示降心唯約度生此則別約小乘因果言之前示住心唯約布施此則別約大乘因果言之亦者例前信分言信分中業已顯勝校量此既望前多義差別亦德成立顯勝校量之義下二句頌能校勝前意言信分能校之喻唯約一界寶施此中能校之喻乃約衆多恆河沙世界寶施者以持說後分之福過於持說前分之福故於能校量中重說勝前之喻蓋喻者比也以寶施為能比法也總結校量持福竟二取劣況勝二一隨說尚勝二何況盡持初復次須菩提隨說是經乃至四句偈等當知此處一切世間天人阿修羅皆應供養如佛塔廟恐謂持說雙行自他兼利福德勝前無可議者設若自無受持之功隨便為人演說未必有福故此約隨說之處以顯勝也復次須菩提者謂復於校顯之次重呼當機而再告之隨說是經者謂機無論大小文無論豐約處無論勝劣時無論長短隨便演說非誠意說故四句偈等約說之最少者言此處者即隨說之處人多忽之故教以當知顯不可忽耳一切世間意攝四衆天人修羅意攝八部皆應供養者人是佛遣法是佛說代佛宣揚即同佛在故如佛塔廟者塔安佛身廟像佛容舉世知供故為喻也法華云能竊為一人說法華經乃至一句是人則為如來所遣行如來事今經隨說亦應同彼故其處最勝又處尚最勝人可知矣隨說尚勝竟二何況盡持何況有人盡能受持讀誦須菩提當知是人成就最上第一希有之法若是經典所在之處即為有佛若尊重弟子此復有二一正況人勝恐謂隨說是經尊勝若此設有雖不能說而能盡持者其人又當何如故即承隨說之人而況顯之言隨說之人尚爾尊勝若此何況有人盡能受持讀誦自應益勝故再呼當機而教以當知等也成就者圓滿具足之義實相般若名為最上以是諸佛所證故觀照般若名為第一以是發覺初心故文字般若名為希有以是待時而說故三種般若盡在此經故盡能受持者即能成就若是下二兼顯處勝恐謂隨說之處尊勝若彼設若經所在處又當何如故即約經所在處而顯示之經典所在者無論支提脫闍寺塔壇幢等凡有安供處即是也即為有佛者是佛法身故又若有尊重弟子者具差別智故弟子而言尊重者謂各具一德可尊可重如舍利慧目連通等各稱第一是也又經是無為賢聖共依故曰即為有佛若尊重弟子蒙引云如益州新繁荀生者指畫虗空以寫經即成一片金剛地至今慶雲時雨不濕而草不生此經殊勝不信然乎偈尊重於二處因習證大體合云此合頌上科及此科義也尊重者尊敬珍重二處者謂說經處及經在處也又尊重亦攝供養謂一切衆生皆應尊敬珍重種種供養不可忽耳因習句出其所以謂因於二處可聽可持有熏習義能證大體故言大體者即是法身橫遍竪窮故稱為大為報化本故稱為體總結取劣況勝竟三請示經名二一當機請名奉持二如來如請為示初爾時須菩提白佛言世尊當何名此經我等云何奉持降住之功用既彰校況而殊勝又顯似應無說故當機請名奉持當何名此經者謂當以何等名字而目此經此請名也古德云依文解義三世佛冤離經一字即同魔說為遮此二故問云何奉持此請持也二如來如請為示佛告須菩提是經名為金剛般若波羅蜜以是名字汝當奉持所以者何須菩提佛說般若波羅蜜即非般若波羅蜜是名般若波羅蜜是經名為金剛般若波羅蜜者以此中所詮般若同金剛之堅利是究竟法能到彼岸非餘經所能及故此示名也以是名字汝當奉持者謂以是金剛般若到岸名字汝等當因名思議而奉持之徵釋中言如來所以教其以名奉持者何也以金剛有堅利二義由堅義故知般若不壞實能到岸故佛說般若波羅蜜當依言奉持由利義故知般若不住到無所到故即非般若波羅蜜當離言奉持是則名惟假有故曰是名等也偈彼因習煩惱此降伏染福苦身勝於彼希有及上義彼智岸難量亦不同餘法堅實解深義勝餘修多羅大因及清淨福中勝福德合云首四句對前顯勝彼字指寶施福德因是有漏有熏習義故能生一切煩惱如貪瞋等皆依有漏熏習生故此指是經降伏者對治義染福二字應連下句苦身二字以染福是有漏之福能為苦身因故是經能對治彼故能勝於彼是則此經非世間所有故曰希有能超出世間故曰及上義也彼智下正頌經義彼智是般若智為能到彼岸是涅槃岸為所到二俱甚深故曰難量亦不同餘法者揀異小乘及於法相非甚深故堅實者如金剛之堅解深義者如金剛之利不約破惑明利者與上降伏染福互影說故勝餘句顯以是名字當奉持也佛說般若波羅蜜能成大因即非般若波羅蜜能令清淨如是而持於諸福中為最勝福德所謂亦不同餘法是也總結略示周足竟三盡斷餘疑三一斷是名何必強說疑二斷無說云何攝界疑三斷名界云何現相疑初須菩提於意云何如來有所說法不須菩提白佛言世尊如來無所說恐謂如來說法不立名相既唯是名何必強說故問以於意云何將謂如來有所說法不佛意以如言取執則似有法可說若得意忘言豈當固執文字是故如來臨滅度時文殊請佛再轉法輪佛言我住世四十九年未曾說著一字汝將謂我曾轉法輪耶佛今示問亦同於彼但看空生如何理會耳空生亦伶俐納子一提便醒故答以如來無說所謂歸家罷問程到岸不須舟也二斷無說云何攝界疑須菩提於意云何三千大千世界所有微塵是為多不須菩提言甚多世尊須菩提諸微塵如來說非微塵是名微塵如來說世界非世界是名世界空生雖答無說不是一向無說所謂但去其病不存其藥恐有執藥成病者言若果一向無說云何攝化三千世界而為說法主耶由是如來呼當機之名而探問之良以三千世界乃聚微而成故問以界所有塵是為多不佛意以塵可析空界是假有其奈須菩提未會佛意而答以甚多所謂好箇阿師又恁麼去也如來見其不會乃呼其名而救之曰所謂諸微塵者如來說非微塵以展轉分析可使空故是知微塵無體但是假名故曰是名微塵以是而知如來說世界非世界以合時似有析時便無故是知世界亦唯假名故云是名世界三斷名界云何現相疑須菩提於意云何可以三十二相見如來不不也世尊不可以三十二相得見如來何以故如來說三十二相即是非相是名三十二相恐謂世界唯名無可依者云何如來依界現相為防此疑故問以於意云何將謂可以三十二相見如來不佛意以界既非界相亦非相二俱從緣何礙相依喜空生已知佛意直答以不也世尊不可以三十二相見如來其意以離相方見真佛應自有真界為所依耳徵釋中言如來說三十二相即是非相者以依性現相執相者必至迷性故曰即非是知三十二相但有其名故曰是名三十二相且不可執相而迷性也然一切衆生所以得度者佛也一切諸佛所依現相者界也攝界度生所依成化者法也若有定法可說則不能攝界以界無定故若有實界可依則不能現相以相隨緣故是知如來隨衆生緣現水月相依空華界說谷嚮法了三者唯是假名用繁興而無住純一覺不存纖礙智常靜而鑑周雖曰盡斷餘疑亦示覺心令住此三科彌勒無偈者以從請示經名中生非正說故總結推廣降住竟二成就解慧五一校量經功二信解感嘆三類明餘度四會合前語五遮疑助解初須菩提若有善男子善女人以恆河沙等身命布施若復有人於此經中乃至受持四句偈等為他人說其福甚多餘疑已盡勝解將成寶施外財無能校量故此又約身命內財校之言衆生所最愛者身最重者命也身施或易命施猶難今兼二施其功德可謂大矣且一生只有一個身命今言恆河沙等者顯非一生十生及與百生千生等將生生世世皆以身命布施其功德可謂多矣雖曰大曰多若施相不忘仍住有漏如世之殺身成仁捨命居名比干介子之流曾未聞有成佛事也此經雖一偈一句如一枚一粒金剛受持演說如自食食他終竟不銷出則有用故言其福甚多以恆沙身命布施所不及故偈能忍於苦行以苦行有善彼福不可量如是最勝義離我及瞋恚實無於苦惱共樂有慈悲如是苦行果為不捨心起修行及堅固為忍波羅蜜合云首三句頌內施福多恆沙身命布施即是能忍苦行以若不能忍雖一身一命施之猶難況於恆沙等乎以苦行有善者謂由彼苦行成就有漏善法以未能忘相故彼福不可量者謂雖屬有漏善法以世智觀之彼所得福德亦不可量矣次四句頌持說福勝如是最勝義者指此經所詮乃勝義中真勝義性故持此則不見有我故云離我離我則絶諸對待故及瞋恚亦離以瞋恚生於對待故也既離瞋恚不見苦惱故曰實無反顯彼雖能忍時或有瞋未能全忘苦惱相故若說此者願他共樂兼有慈悲是持說皆成無漏彼內施福德殆不可同年而語明矣末四句出勝所以言如是能忍苦行所感福果所以不及持說者為其於受福之時或有慳貪不捨心起因之而造業者有之又如是依教持說修二利行及堅固力所以能勝內施者為其於持說之時成就堅固能忍之力因之而到岸者有之校量經功竟二信解感歎三一當機聞解悲感二讚嘆信解功德三如來印許證釋初爾時須菩提聞說是經深解義趣涕淚悲泣而白佛言希有世尊佛說如是甚深經典我從昔來所得慧眼未曾得聞如是之經爾時者從正宗已來以至此番校量已竟時也初聞略示降住不過隨語生信次聞推廣降住乃覺胸茨漸銷請示經名時已有微解三疑淨盡處徹底通明且聞內財校量不如自是義天星象燦著故云聞說是經深解義趣又義者差別義相如分析降心住心隨事各別趣者理之所歸如顯示降心住心總一無為若但解其義尚不名深兼解其趣乃名為深也又初聞略示但是以自心燭經幽旨故唯成淨信繼聞推廣乃能以經意照鑑自心故兼成深解喜極成悲所以涕淚悲泣如久違慈親一朝邂逅自不禁中心凄然而傷其一向不遇也鼻出曰涕目出曰淚大慟曰悲微痛曰泣謂始而涕淚繼而大慟後而微泣微泣者收痛將陳故曰而白佛言希有者有三義一讚自能聞以此法能聞者希故二讚佛能說以此法能說者希故三兼讚二所以此法時至方聞時至方說非常聞非常說故此亦深解之後方知三皆不易而讚嘆之也甚深經典者揀異小乘曰深并揀法相曰甚深此明所說希有唯佛所說如是則是能說者亦希有也我從昔來者從阿含覲佛已來所得慧眼者已得人空慧眼此經不唯空人兼能空法故未曾得聞此顯能聞希有唯如為是之經則是所聞者亦希有也當機聞解悲感竟二讚歎信解功德二一現前信解功德二當來信解功德初世尊若復有人得聞是經信心清淨即生實相當知是人成就第一希有功德世尊是實相者即是非相是故如來說名實相空生意謂我以得聞是經力故始而信心清淨繼而即生實相妙解自覺向去成益良多設若復有一人如我得聞是經如我信心清淨如我即生實相妙解以我方彼應無少異故曰當知是人等也成就者亦具足義第一希有仍指觀照文字二種般若言此二種般若皆以實相為體是人既生實相妙解則二種般若不期具足而自無不具矣破自他惑名之為功成二利行名之為德此正明也世尊下乃兼防轉執恐聞能成功德轉執實相為有故曰是實相者即是非相此有二釋一者金屑雖貴落眼成塵雖生實相妙解此解亦不可住故言非相正見其不可住耳二者若實有相即屬可壞是不堅法不名實相故言非相謂不唯非有相亦復非無相正顯其不可壞也是故如來說名實相者亦有二義一者實相妙解雖不可住有因緣故亦可得說是故如來為彼不解實相義者說名實相令因名而思義也二者有不能有無不能無是堅實法不可破壞是故如來為欲顯示不可壞義說名實相顯除此皆不實也現前信解功德竟二當來信解功德二一正以讚歎二展轉徵釋初世尊我今得聞如是經典信解受持不足為難若當來世後五百歲其有衆生得聞是經信解受持是人即為第一希有我今得聞者顯是親承教諭如是經典者通指以前所說然既親承教諭雖信心清淨妙解實相自是領受執持是皆不足為難以如來三業殊勝見聞隨喜即能感發信解受持心故若當來世後五百歲者顯是去聖時遙其有衆生得聞是經者唯是展轉傳受然既當去聖時遙又係展轉傳受信心清淨即難妙解實相尤難況復領受執持非有宿因定係佛遣故曰是人即為第一希有以能依實相之體發起觀照文字二種般若用故二展轉徵釋何以故此人無我相無人相無衆生相無壽者相所以者何我相即是非相人相衆生相壽者相即是非相何以故離一切諸相即名諸佛文分三段初承徵承釋言信解受持之人以何以故名為第一希有以此人久無四相密為如來所遣行如來事若不然者何能於後五百歲濁惡世中突然躍出常流而信解受持此離相甚深法哉所以下轉徵轉釋言我人等相所以必要無者抑又何也以我人等相皆為非相以是依他法故若更於中執有我人等相則是於依他法上重起遍計誠為妄中之妄故須無也何以下合徵合釋言縱達非相亦不執有以何以故便為第一希有蓋以久無四相之執已離我相又達四相非相并法相亦離既能離一切相則內之根身外之器界應念化成無上知覺故曰即名諸佛所謂第一希有者宜矣此上彌勒無偈者以是當機之語非佛說故總結讚歎信解功德竟三如來印許證釋二一正與印證二徵起轉釋初佛告須菩提如是如是若復有人得聞是經不驚不怖不畏當知是人甚為希有如是如是者印其兩說皆不謬也言此經甚深現在信解即難當來信解尤難此亦空生解後方知故得所說無謬猶如過來人指示向去路自然的當故如來二皆印許蓋欲現在當來得聞此經者亦求如空生焉可矣若復下乃以劣證勝猶見其所說為不謬故有人等者無論現在當來但法音經耳者皆攝也不驚者信是佛說不生驚惶非真信也不怖者知是大乘不生怕怖非真解也不畏者尋行數墨不生畏避非真能受持也如是之人常為甚希況復真信真解真能受持者自應稱為第一希有非過譽耳二徵起轉釋何以故須菩提如來說第一波羅蜜即非第一波羅蜜是名第一波羅蜜言不驚不怖不畏只是尋常以何以故得名甚希以如來隨說隨掃隨立理無一定語似有違聞之而不生驚惶不生怕怖不生畏避者誠難其人矣言第一波羅蜜者即指今經所詮般若度也如金剛鎞云六波羅蜜中般若最勝以六度若無般若則在因無破惑之功在果無法身之德是知破惑證真不離般若故稱第一然此之釋詞即前請示經名中語但彼云般若此云第一雖略變其文蓋即取彼以見易驚易怖易畏之一端耳總結信解感歎竟三類明餘度二一類明忍度二總結一切初二一正以類明二引事證釋初須菩提忍辱波羅蜜如來說非忍辱波羅蜜是名忍辱波羅蜜言此經所以易驚易怖易畏者不唯般若之一端即如依此經而行忍辱波羅蜜者如來亦說非忍辱波羅蜜以無我故不過為彼不能忍者對治瞋恚假立是名呼為忍辱波羅蜜行不善會者鮮有不驚怖而畏避者矣忍辱說非之義至下引證自見二引事證釋二一詳引近事二略引遠事初何以故須菩提如我昔為歌利王割截身體我於爾時無我相無人相無衆生相無壽者相何以故我於往昔節節支解時若有我相人相衆生相壽者相應生瞋恨文分為二初承徵承釋言忍辱波羅蜜如來說非者何以故也引釋中如我昔為等者據法苑引涅槃義云我念賢劫中生於南天竺國富單那城婆羅門家為衆生故林野禪思時國有王名迦羅富此經譯為歌利陳譯迦陵伽唐譯羯利梵音少異耳此云極惡以彼經云其性暴惡憍慢自在故率諸婇女出城遊玩王倦少憩諸女因採華果來至我所而為說法王從覺已不見諸女仗劒尋至瞋怒責曰何將幻術誘我諸女與貪欲耶我時報言我持淨戒實無染心王問以何為戒我答以忍為戒王即以劒斷我手足及兩耳鼻責云忍不我言假使大王分我殘質猶如微塵我終能忍不起瞋念羣臣爭諫王怒不息時四天王雨金剛砂王見恐怖回瞋懺謝我即立誓若我實無瞋念令我此身平復如故作是誓已身即還復更願我於來世先度大王是故我今成佛先度憍陳如也此是約義而引至今經又促舉其事耳為猶被也割截身體即指斷手足及耳鼻事無四相者正顯其無瞋以無我則無受者無人則不計報復無衆生則不見苦相無壽者則不護命根是皆可以離瞋念也何以下轉徵轉釋謂正當被割截時以何以故見其無有四相以我於往昔被其割截手足耳鼻節節支離解散之時若有我人等相者應生瞋恨以有受思報不忘苦護命根故試思我昔尚願先度豈復有瞋故知彼時無有四相詳引近事竟二略引遠事須菩提又念過去於五百世作忍辱仙人於爾所世無我相無人相無衆生相無壽者相恐謂身被割截能忍即難況復無瞋彼婆羅門子何以遽能爾耶故又引遠事而證釋之過去指賢劫以前應是莊嚴劫中時也五百世作忍仙者見其行忍之久爾所世無四相者顯其習空已熟由久行故能忍由熟習故無瞋有志行忍者亦求如佛焉可耳偈習彼能學心合云此合頌此科及上科義也能學心即指忍行以忍行能學菩薩求菩提心故但忍不遽成故須習彼謂生生世世練習彼行如佛於五百世作忍仙等是也類明忍度竟二總結一切是故須菩提菩薩應離一切相發阿耨多羅三藐三菩提心不應住色生心不應住聲香味觸法生心應生無所住心若心有住即為非住文分三段初正結布施居六度之首故首言布施離相般若居六度之後故次言般若離相忍辱亦攝精進居六度之中故類明中言忍辱離相初後中間既爾餘可例思以是義故呼當機而總結之曰菩薩應離一切相謂持戒離戒相修禪離禪相乃至萬行繁興離萬行相如是而發菩提之心則覺心可安住矣不應下反顯不應住色生心者謂不應住著於眼所見色而生染心以色如熱金丸執之則燒故不應住聲香味觸法生心者謂不應住著於耳所聞聲乃至意所緣法而生染心以聲如塗毒鼓聞之必死香如憋龍氣嗅之則病味如塗蜜刀舐之則傷觸如臥獅子近之則嚙法如入室賊不防則害故此又於住心中兼示降心之義應生無所住心者謂色等來時無所粘染色等去時亦無踪跡如鏡現像而無取於像如風度樹而不留於樹夫如是雖萬境紛然而於我菩提覺心無所與矣若心下結示若心有住即為非住者謂一有所住則是妄心妄心一興則為不住菩提之心有志住心者其念之哉總結類明餘度竟四會合前語二一正與會合二兼釋伏疑初是故佛說菩薩心不應住色布施不應住色等布施是如來前示住心之語今承上文義便又復會合前語謂以是有住則為非住之故所以如來最初便說菩薩之心不應住色等布施顯始終無有異說尤見其可信也二兼釋伏疑須菩提菩薩為利益一切衆生故應如是布施如來說一切諸相即是非相又說一切衆生即非衆生此中伏疑有二一承生疑二轉成疑承生疑者謂承前離相發心布施亦可不行何故強要行施既要行施又何必定要不住相耶故此釋云菩薩為利益一切衆生故應如是無住布施以不行布施則不能利益衆生住相布施又不能利益一切諸衆生故轉成疑者恐謂利益衆生衆生豈不是相況衆生所依五陰豈不是一切相耶故此釋云如來說一切諸相即是非相以色陰如聚沫受陰如水泡想陰如陽𦦨行陰如芭蕉識陰如幻化故又說一切衆生即非衆生以是五陰和合假立名字陰且不實名復何有是雖利益衆生仍與無住行施義不相違偈修行利衆生如是因當識衆生及事相遠離亦應知假名及陰事如來離彼相諸佛無彼二以見實法故果雖不住道而道能為因合云此合頌此料及上科義也修行者經中承上文義便但言不住行施此則渾言修一切行耳恐謂離相發心何必強要修行故以利衆生釋之如是因當識者因即是行識即是知謂如是無住之行應當識知能利益一切諸衆生故又恐謂利益衆生衆生豈不是相所依陰事豈不是一切相耶故次云衆生及事相遠離亦應知謂菩薩於所利衆生及彼所依五陰事相不礙遠離亦應了知以衆生假名及彼所依陰事二俱非相以如來離彼相故恐謂如來有何所見而離彼相故次云諸佛無彼二以見實法故實法即性以見性是真自能了相為妄故無彼二據此則見性說果不住利益衆生之道而菩薩學佛亦不應利益衆生何故必要修行利衆生耶故言果雖不住道而道能為因謂果中雖不住利益衆生之道而利益衆生之道能為佛因如華嚴行願品云因於衆生而起大悲因於大悲生菩提心因菩提心成等正覺此菩薩所以必要修行利衆生耳總結會合前語竟五遮疑助解二一以語遮疑二以喻助解初須菩提如來是真語者實語者如語者不誑語者不異語者須菩提如來所得法此法無實無虗恐有疑云如佛所說菩薩應離一切相似約真諦說之又令發阿耨多羅三藐三菩提心似約俗諦說之既真俗角立似非如所如說莫是誑彼初學真俗異說耶故此遮云如來是真語者等楞嚴云無上法王是真實語如所如說不誑不妄指掌疏釋云顯示真諦曰真語如云無是見是也顯示俗諦曰實語如云無非見是也顯示中道曰如所如說謂如己所證真如之理而說如上反覆致詳是非雙絶妄情俱盡是也不誑者不欺初學不妄者無異彼此此示義同五語相應深信今云菩薩應離一切相亦是顯示真諦故曰真語又令發阿耨多羅三藐三菩提心亦是顯示俗諦故曰實語至云不應住色等生心應生無所住心等反覆致辨亦是顯示中道故曰如語為對偏執並非誑彼初發心人故曰不誑語所說必驗不異彼此同彼楞嚴無妄故曰不異語如是而說復何疑哉此遮承生疑也又恐疑云如語妙契中道應是真實真語實語各據一邊豈得不涉虗妄誑初學異彼此耶故轉遮云須菩提如來所得法等言真諦俗諦亦是如來所得之法依此說法皆無有實以是對治門故亦無有虗以能如說證故此又遮轉成疑耳偈以諸佛實語彼智有四種實智及小乘說摩訶衍法及一切受記以不虗說故隨順彼實智說不實不虗如聞聲取證對治如是說合云前六句頌遮承生疑也為遮前疑顯示所說不虗故云以諸佛實語此之實語總該下之五種非是五種中實語如十一色法之色非是眼所對色故此先總遮下乃詳明彼智句標四智該五語也實智即佛之所證說此者名為如語小乘四諦中滅諦是真餘三皆俗說此者名為真語實語摩訶衍此云大乘為深位說不誑初心即不誑語一切受記所說必驗即不異語又不異語不止受記一法蓋是取一法為例真語實語不止說小乘準知以不虗說句乃結歸前之遮詞以不虗即實語故後四句頌遮轉成疑也言如語固是實智而真語實語亦是隨順實智而說以能成就彼故如是而說不實不虗云何不虗以能如所聞聲而取證故云何不實以為對治偏執如是說故以語遮疑竟二以喻助解須菩提若菩薩心住於法而行布施如人入暗即無所見若菩薩心不住法而行布施如人有目日光明照見種種色承前重重開示已解住心之法第恐習氣深重行與解違為助妙解故重拈布施之法雙陳二喻以顯住法不住之得失也於中先顯住法之失謂設若菩薩心中明知法不應住至行施時力不自由依然住著於法是謂住法行施住法則無智能照故以如人入暗喻之以暗能障目可喻無智能照義故無智能照不得真如故以即無所見喻之以無見則觸途成窒可喻不得真如義故若菩下次顯不住之得謂設若菩薩心中既知法不應住至行施時元解不昧備達三輪體空是謂不住行施不住則有智受法故以如人有目日光明照喻之以目能受明可喻智慧受佛法義故智慧受法能得真如故以見種種色喻之以種種色相可喻真如具恆沙淨德義故偈時及處實有而不得真如無智以住法餘者有智得暗如愚無智明者如有智對法及對治得滅法如是於何法修行得何等福德復成就何業如是說修行合云初八句正頌經意經中單約施言偈中義含萬行故不言施而但言時處謂修行之時及修行之處也住相者必以時長生退處多生厭名為實有如是修行不得真如云何不得真如以無智故云何無智以住法故餘有不住法者不覺時長不嫌處多以有智故能得真如此先頌法中之義經中依法立喻故曰如人入暗此中以喻比法故曰暗如愚無智等暗者境暗障目愚無智即指住相修行者言明者有目受明有智即指無住修行者言對法及對治等者謂無住修行是能對治法住相修行是所對治障以能對所故得滅彼住相之執住心之法如是而已次四句兼釋伏疑恐謂何不亦同經中單約布施說耶釋云於何法修行得何等福德等意以前說檀義攝六乃約大略言之其實於何法修行得何等福德謂以因感果非全同也果既不同依果所起業用亦自不同故云復成就何業依如是義應通說修行雖不言施而義可攝問推廣分中少示降心多示住心者何也答覺心如主妄心如客但使覺心安住自令妄心不興亦如主人若悟客邪不得其便總結成就解慧竟三顯示經功信解既成修證可期傳持此道專望知音故爾顯示以發衆生讀誦受持為人演說之勝心也分四一分門略顯二四義詳示三引因校量四總以結歎初三一顯示自持功德二校量聞信功德三況顯兼說功德初須菩提當來之世若有善男子善女人能於此經受持讀誦即為如來以佛智慧悉知是人悉見是人皆得成就無量無邊功德當來之世應指末法如前所謂後五百歲時也宿植善根現具正信名為善男善女受謂領受其文持謂執持其義皆默憶也讀謂對本而讀誦謂背本而誦皆顯念也言時當末法人多不善貪著成風法尚有為若有善男善女別具超常之見能於此經或受持或讀誦是不唯過去因深已足見當來果勝故曰即為如來以佛智慧等悉知者知之悉悉見者見之悉謂無始盡際前因後果纖芥無遺故不言心知眼見而云智慧知見者以妄心肉眼各有限量智心慧眼乃無障礙故皆得者受持讀誦無不得也成就有二謂以今驗昔為已成就以今驗後為當成就此經既密通於圓而因該果海果徹因源故皆言無量無邊謂前因後果一切功德不可限量無有邊際除佛一人餘皆無能知無能見也二校量聞信功德須菩提若有善男子善女人初日分以恆河沙等身布施中日分復以恆河沙等身布施後日分亦以恆河沙等身布施如是無量百千萬億劫以身布施若復有人聞此經典信心不逆其福勝彼文三初能校行勝恆沙身命其施可謂重矣日以三時其行可謂勤矣況經無量百千萬億劫如是而行其時可謂長矣以長時而勤行重施非具神通妙用分身促時者不能也若復下所校機劣聞此方及解分其聞可謂少矣信心但曰不逆其信可謂微矣況得聞不過一時其時可謂促矣以促時而少聞微信凡有宿因及現前根利者皆能也其福句果報反勝然既能較行勝所校機劣而劣者之福反勝於彼者略有三義一者彼是示現此是實行示現捨身易實行住信難如幻人蠲軀固不若書生入泮之為勝故二者彼約深位但期常居因門不欲速成此約淺位信心便是初基誓期圓證是乃以速成佛不速成佛而分勝之與劣如舉子不務上進生員矢志連登可為譬也三者彼是假設謂設能如此亦屬有漏以不聞此經不信無漏法故故知聞信不逆其福勝彼又此與前番校量均屬內施而前番能校者劣以但言恆沙命施不言日以三時及久經多劫故此番所校者劣以但言聞信不逆不言受持及演說故是則前番以劣行校勝機雖勝不為勝此番以勝行校劣機其勝乃為勝良以前方推廣降住此則徹底悟解勝劣天淵固其宜矣三況顯兼說功德何況書寫受持讀誦為人解說承前聞信不逆尚超最勝施福何況書寫此經受持讀誦兼復為人解說其福益勝可知偈名字三種法受持聞廣說修從他及內得聞是修智此為自淳熟餘者化衆生以事及時大福中勝福德合云此合頌分門略顯中義也名字指能詮之法不出名言及文字故此亦是教三種指所詮法以所詮之法不出理行果故受持義該讀誦聞亦攝信廣說即為人解說此同一弘經而為門不同也既為門不同何故先讚受持以受持讀誦是修行門故次讚聞信者以修必先從他聞次及內信謂聞而信信而修也是則得聞者乃起修之智故因修而讚之也然此聞信受持皆為自己淳厚善根成熟道種餘者即指廣說以自利之餘乃能廣說故說而云廣者長時利他故云化衆生也問受持功德經唯直顯而聞信獨用校量兼說獨用況顯者何也答以事及時大福中勝福德言聞信事大以是起修智故兼說時大以是長時說故事大福勝非校量莫顯時大福勝非況顯莫知故爾校況顯此二種福德乃是福德中勝福德故總結分門略顯竟二四義詳示四一約教理顯德二約行果顯德三約依處顯德四約功用顯德初須菩提以要言之是經有不可思議不可稱量無邊功德受持聞說福德靡涯意欲盡言言不能盡佛以少言而該多義故曰以要言之是經即教不可思議等即理也言語道斷心行處滅心將緣而慮亡口欲談而詞喪故云不可思議仰之彌高鑽之彌堅故不可稱謂讚莫能盡也瞻之在前忽焉在後故不可量謂測無能窮也法音經耳功報彌劫一念信心永為道種故云無邊功德教理如是受持聞說者福德可勝言哉二約行果顯德如來為發大乘者說為發最上乘者說若有人能受持讀誦廣為人說如來悉知是人悉見是人皆得成就不可量不可稱無有邊不可思議功德如是人等即為荷擔如來阿耨多羅三藐三菩提何以故須菩提若樂小法者著我見人見衆生見壽者見即於此經不能聽受讀誦為人解說文四初為大機謂此經教理既大信解亦大依此發心名為發大乘心者為此人說顯此經行果俱大故然大乘有權有實如大乘始教為權終頓圓三為實此經不唯是權亦兼是實謂進之可入終頓再進之可入圓乘故云為發最上乘者說以終頓屬上乘圓教為最上乘故若有下示大行受持讀誦自利行也廣為人說化他行也從性起修全修即性全修即性性無不備故曰如來悉知悉見皆得成就等又皆得成就等者以此經是一切諸佛本所乘故如起信說如是下顯大果背負曰荷肩任曰擔此喻言也言是人既能受持讀誦又能廣為人說則是大智上求大悲下化以三藐三菩提為己任誓期必證不至於阿耨多羅而不已故曰即為荷擔如來等又即為荷擔等者以一切菩薩皆乘此法到如來地故亦如起信何以下揀非機樂小法者聲聞緣覺也聲聞緣覺已達我空而云著我見者以雖空我相若空我之心未亡仍屬我見人見衆生見壽者見例此可知即於此經不能聽受讀誦解說者以此經不唯空我乃并彼空我之心亦俱空故既不相應雖聽受讀誦解說皆不相應故直以不能斥之由此觀之則受持讀誦解說功德偉矣三約依處顯德須菩提在在處處若有此經一切世間天人阿修羅所應供養當知此處即為是塔皆應恭敬作禮圍繞以諸華香而散其處在在處處者無論城邑聚落莊宅園館僧伽藍摩等若有此經者無論琅函貝葉白氎素紙粉牆石壁等一切世間天人修羅所應供養者尊重於法也當知此處等出其應供之故即為是塔者塔安佛身以經所在處即是佛在故恭敬者志念專注意業虔誠作禮者五體投地身業虔誠圍繞者相向讚詠口業虔誠華散其處者借此為因回向佛乘以一華稱性一切因行皆具足故依處尚爾況復受持讀誦廣為人說其人不益可恭敬供養乎哉四約功用顯德復次須菩提若善男子善女人受持讀誦此經若為人輕賤是人先世罪業應墮惡道以今世人輕賤故先世罪業即為銷滅當得阿耨多羅三藐三菩提經所在處尚應恭敬供養受持讀誦反為人所輕賤其故何也恐有是難故復於其次呼當機之名而告之為猶被也或罵詈毀辱或訕謗憎嫉或杖木瓦石而打擲之皆名輕賤是人下出其深故先世罪業應墮惡道者顯是罪之極重如五逆十惡及毀謗大乘等以今世人輕賤者顯是報之最輕以輕報而可償重罪故曰先世罪業即為銷滅然善惡之報如影隨形假使百千劫所作業不亡今既以輕報而銷重罪則罪之輕者自應不報可知非緣經功何以能爾不唯此也且能以此為因不壞道種因緣會遇必當作佛故云當得阿耨等則此經功用詎可思議偈非餘者境界唯依大人說及希聞信法滿足無上界受持真妙法尊重身得福及遠離諸障復能速證法合云此頌四義詳示中義也餘者指聲聞緣覺二種教理可思議可稱量有邊際是經有不可思議不可稱量無邊功德故曰非彼境界此頌約教理顯德又此亦含下文中揀非機義以下文云樂小法者著我見等不能聽受讀誦為人解說亦非彼境界義也唯依大人說者大人即大乘之人所謂是經為發大乘者說故希聞信法者謂希求聞法生信滿足無上界者界即是因無上界即是佛因滿足者由信而修圓滿具足如是之人則為荷擔如來阿耨菩提及者兼義所謂為發最上乘者說故此頌約行果顯德約依處顯德彌勒不頌者以易知故受持真妙法者真妙法即指此經正屬始教空宗曰真兼攝終頓圓三曰妙經云受持讀誦此經是也尊重者以是當來成佛人故不唯當來成佛亦能現身得福以是世間所應供故此約先世無障者說若先世有障者重則輕受即銷輕則直銷不受故曰及遠離諸障不唯離障且以此為因當得菩提故曰復能速證法蓋法即菩提法也此頌約功用顯德總結四義詳示竟三引因校量前云日以三時各捨恆沙身命經無量百千萬億劫不及聞信功德若受持讀誦於後末世時者又將何以校之恐有是疑故自引因中實跡而為校量須菩提我念過去無量阿僧祗劫於然燈佛前得值八百四千萬億那由他諸佛悉皆供養承事無空過者若復有人於後末世能受持讀誦此經所得功德於我所供養諸佛功德百分不及一千萬億分乃至算數譬喻所不能及我念過去者以宿命智憶念過去劫也劫非一十百千萬等僅可以無量阿僧祗計之阿僧祗此云無央數乃華嚴十大數中第一阿僧祗阿僧祇為一無量今云無量阿僧祗者蓋是以僧祗積至無量復以僧祗所積無量而計僧祗極言其所經之劫唯佛能知耳此等劫數俱在然燈佛前準權教然燈佛是釋迦佛第二僧祗授記本師據此則然燈佛前只有一箇僧祗今云無量僧祗者顯尋常所說三祗煉行亦對機方便之言故法華云我說然燈佛等又復言其入於涅槃如是皆以方便分別值遇也得值八百四千等者即無量僧祗劫中所遇佛也金剛鎞云十億為洛叉十洛叉為俱胝十俱胝為那由他則那由他當千億矣今以八百四千萬億而計那由他者極言其所遇之佛亦唯佛能知耳悉皆供養者如意奉贍如飲食衣服臥具醫藥等悉皆承事者順命侍使如執巾司瓶汲水採果等一一佛所不缺不越故曰無空過者不言聞法者對下顯劣且約福門言之後末世時法久弊生波旬熾盛人根淺薄況復離相無為之經拂情違世之道率多憎嫉誰能信順今日能受能持能讀能誦其猶火裏蓮華固不可以等閒論也於字應作以字言此人所得功德以我所供佛功德校之則供佛功德百分不及受持此經功德一分不唯百分即千分萬分億分亦不及一分若究極而言洛叉分俱胝分乃至算數所不及分譬喻所不及分皆不及一分良以多福不如少慧以福為苦因慧為道種福可盡慧不可盡寸金丈鉛可為明喻故達摩答梁武帝云造寺齊僧實無功德性淨妙圓體自空寂性空之中功德無極通前五番校量初以一界寶施不及持說二以無量世界寶施不及持說三以恆沙身施不及持說四以無量恆沙身施不及聞信至此解分將終內施外施無可校量故特引佛因供佛而校量之則解之所關者重矣引因校量竟四總以結歎須菩提若善男子善女人於後末世有受持讀誦此經所得功德我若具說者或有人聞心即狂亂狐疑不信須菩提當知是經義不可思議果報亦不可思議文二初顯示難以盡說恐謂佛因校量尚不能及盍具說之以生信樂故如來重呼當機而進示之言善男善女當彼末世之時猶能獨具正見受持讀誦此經就其所得功德誠難具說我若不辭饒舌而具說者有能信樂則誠善矣設或有人不得意者一聞此說心即狂亂狐疑良以中行之士難得其人率多流於狂狷狂者有過高之行一聞此說勢必成就高狂知見惑亂自心狷者多不及之弊一聞此說既不敢必以為是又不敢決以為非是非兩疑如狐履冰名曰狐疑此二者皆不能信具說無益若更以此破法則不唯無益而反有損矣須菩下結歎二不思議雖不具說亦應總示故教以當知一往似屬空宗沉思亦兼終頓密通於圓無義不收故曰是經義不可思議隨機修證淺深自殊深證固能該淺淺證亦可通深故云果報亦不可思議所以至德難校具說多疑者此也偈成種種勢力得大妙果報如是等勝業於法修行知合云上二句頌後攝前經義不可思議故能成就種種勢力如斷惑證真降魔制外嚴土利生等皆勢力也果報亦不可思議故能得大勝妙果報以始終頓佛皆大圓佛則妙也而云攝前者以佛因難校具說多疑者正由此故下二句結前起後如是成力得果此等皆為勝業此結前也而云起後者以雖為勝業要必於前所解之法精進修行乃能證知此亦下屬修分之一證耳總結大科推廣降住開解分竟三究竟降住起修分二一當機重問降住二如來原問發明初爾時須菩提白佛言世尊善男子善女人發阿耨多羅三藐三菩提心云何應住云何降伏其心此中發菩提心與前不同前約博地凡夫發起上求下化之心懸期佛果此約信解之後發起稱理修行之心尅求必證前或有退以是從邪定聚入不定聚故此則無退以是從不定聚入正定聚故仍稱善男善女者行起解絶還同未解以便幻修設立解者勢必以菩薩自居修則不力故重問住降者謂雖解其理未驗於事第恐習氣深重行與解違故重問發菩提心歷事進修時云何應住云何降伏其意蓋欲究竟所解以造其實昭明判為究竟無我或有見於此耳二如來原問發明三一降心離相二住心無住三校量持福初二一略明二詳示初佛告須菩提善男子善女人發阿耨多羅三藐三菩提心者當生如是心我應滅度一切衆生滅度一切衆生已而無有一衆生實滅度者何以故須菩提若菩薩有我相人相衆生相壽者相即非菩薩所以者何須菩提實無有法發阿耨多羅三藐三菩提心者文四初標示善男子等牒其所為之人言重問降住正為進發修習菩提心人故當生句示以應生渾言如是下乃明示但以當生之言教令留意耳我應下正明我應滅度等者以一切衆生與我一體彼苦即同我苦我欲滅度亦應令彼滅度同體慈悲法如是也要知我應二字則是降心要訣以我應則不以為功不以為功自能忘我人等相進發修習菩提心者不可不知滅度一切衆生等者謂縱至盡令滅度亦不見有一滅度者以忘相故何以下徵釋謂以何義故無有滅度故以若菩薩等而反顯之正明既是菩薩自應無有我人等相既無我人等相豈復見有滅度相哉謂之實無固其宜矣所以下轉釋言所以有相即非菩薩者何也以實無有法可發菩提心者以一切衆生本來是佛故是則佛果尚不應住果是菩薩豈復更著我人等相知此意者一念不生生如是心無妄可降矣偈於內心修行存我為菩薩此則障於心違於不住道合云此略頌本科義也於內心修行者謂勝解既成內心無住即於內心無住中修習菩薩度生之行所謂稱理起修是也既稱理起修若更存我相而謂我為菩薩者此則障於內心違於不住之道所以經中斥以即非菩薩偈中不顯度生但渾言修行者以上云於法修行知承上語便足攝度生義故略明竟二詳示四一得記離相二感報離相三修因離相四知見離相初四一問答略明二印證詳釋三徵起轉顯四結示中道初須菩提於意云何如來於然燈佛所有法得阿耨多羅三藐三菩提不不也世尊如我解佛所說義佛於然燈佛所無有法得阿耨多羅三藐三菩提文二初如來示問此亦承前發端恐謂無法發心亦應無法得果何故如來於然燈佛所有法得果而蒙然燈之記為防此難故問以於意云何將謂如來於然燈佛所有法得菩提不佛意為顯實無有法得阿耨菩提但不欲直言乃故為示問使當機神會自諭問設言有法得菩提者當有何過答略有二過一者因果不類以前云實無有法發菩提心故二者妄心難降以若有法可得菩提則能所宛然分別從生故不也下當機裁答以佛說為定量故直答不也世尊顯無疑也佛所說義即指上科所說無法發心之義言如佛所問如此若如我解佛上來所說之義以因例果果必類因則佛於然燈佛所無有法可得菩提是知所謂然燈授記者亦屬方便語耳問答略明竟二印證詳釋二一印證二詳釋初佛言如是如是須菩提實無有法如來得阿耨多羅三藐三菩提以因例果因前知後所說不謬可啓衆迷故印言如是謂如汝所說者是也重言者顯決定故既已印定而又言實無有法等者自明本意便是如是是空生所答不唯可啓衆迷且深契佛心尤足為降心者作司南耳二詳釋須菩提若有法如來得阿耨多羅三藐三菩提者然燈佛即不與我授記汝於來世當得作佛號釋迦牟尼以實無有法得阿耨多羅三藐三菩提是故然燈佛與我授記作是言汝於來世當得作佛號釋迦牟尼文二初反顯若有法可得菩提則是能所未忘法我俱在心且難降詎堪作佛故然燈不與授記授記者謂授以當來作佛之號令其分明記憶取驗於後時也汝於來世等即昔日授記之語梵語釋迦牟尼此云能仁寂默上姓下名可知若合取其義者慈悲普覆曰能仁無為密證曰寂默住相則不能普覆有法則乘於無為佛不授記無足異也以實下正明無法可得菩提則理絶能所執空我法一念不生即心是佛故然燈與我授記許以當得作佛而云號釋迦牟尼者能仁則不住涅槃寂默則不住生死名德相符記斯可矣總結印證詳釋竟三徵起轉顯何以故如來者即諸法如義若有人言如來得阿耨多羅三藐三菩提須菩提實無有法佛得阿耨多羅三藐三菩提文三首句徵起謂以何義故有法得菩提則不與記無法得菩提乃與記耶如來下轉顯以佛稱如來如來者即諸法中如如不動義也有法可得菩提即不如如無法可得菩提適符如義此與記不與記之所以耳若有下防難難云既無法可得菩提然燈授記亦虗何故人言如來於菩提樹下得菩提耶故此防云若有人言如來於菩提樹下得菩提者須菩提你便向他說道實無有法佛得阿耨多羅三藐三菩提據此則離相得記離相得果二義相符同歸無念進發修習菩提心者不可不知徵起轉顯竟四結示中道須菩提如來所得阿耨多羅三藐三菩提於是中無實無虗是故如來說一切法皆是佛法須菩提所言一切法者即非一切法是故名一切法文三初承前遮疑恐謂無法發心無法得記無法成佛將一向無法永沈斷滅耶為遮此疑故云如來所得阿耨多羅三藐三菩提於是中無實無虗云何無實方便示現故云何無虗隨緣成益故無實故不違前說無虗故不沈斷滅執藥成病於醫何與哉是故下正為結示是故者謂以是無實無虗之故也無實故無妨如來說一切法以說有不有說空不空故無虗故說有說空皆是佛法以說有不有為妙有說空不空為真空故須菩下重以申明以上云說一切法皆是佛法恐猶未了故重呼當機而申明之曰所言一切法者皆為對治方便故云即非一切法謂說空對有說有對空非真實也雖非真實為欲顯示真空妙有義故是故假立名字說一切法此又於開示降心中顯示中道第一義也偈以後時授記然燈行非上菩提彼行等非實有為相彼即非相相以不虗妄說是法諸佛法一切自體相合云此通頌得記離相一大科義也亦應承上疑云菩薩既不存我亦不住道無法可得何故昔在然燈以後時作佛授記故彌勒以此偈釋之言昔在然燈以後時作佛授記者正以佛於然燈佛所修菩薩行不自以為上故經云無法得菩提然燈佛與授記也反此不記可知故彌勒不頌至於菩提樹下得成菩提亦不以為上故曰與彼行等此即經中實無有法佛得菩提義也人言反此可知故亦不頌恐生斷滅之疑故曰非實有為相言如來所得菩提非實方便示現故此則不違前說即經中無實義也雖曰非實而是有所作為之相此則不沉斷滅即經中無虗義也彼即非相相者言彼所謂得菩提者即是於非相中立相既於非相中立相而說亦於無說中立說以故如來曾不虗妄說法蓋說必如所證故如是說法說空不空說有不有說空不空為真空說有不有為妙有皆是諸佛所證之法故經云如來說一切法皆是佛法據此則一切法即非一切法是名一切法顯唯有中道為一切諸法實自體相總結得記離相竟二感報離相須菩提譬如人身長大須菩提言世尊如來說人身長大即為非大身是名大身此亦承前發端恐謂應化非真可說無得報體修成豈亦無得耶為防此疑故曰譬如人身長大此重拈解分中須彌山王之喻以彼云譬如有人身如須彌山王言須彌橫海落羣峯之高以此喻身則長而且大可知故此但言人身長大即知是仍取前喻若不然者何故才說人身長大空生便悟蓋是前所已知暫時忘懷耳一提便醒故不容佛說而自釋言世尊如來說人身長大若但取於相即為非大身以有數量故不過對小言大但是假立名言說為大身蓋必離相觀身乃為真大又何容生心於其間哉偈依彼法身佛故說大身喻身離一切障及遍一切境功德及大體故即說大身非身即是身是故說大身合云此頌本科義也法身有二一自性法身謂自性清淨即法身故二報得法身謂無量功德法之所成故今是第二即果報身也報身雖大以有數量可比故依之而說大身之喻若自性法身理絶數量無可喻者故知非彼又報身有二一自報二他報偈云離一切障即是自報即滿淨義也遍一切境即是他報即光明遍照義也功德及大體者約能依兼所依說能依者萬德莊嚴故曰功德所依者千丈金軀故曰大體為對世間小身故即說為大身非是真大若解此身非身即是自性法身理絶數量乃為真大是故經中如來說譬如人身長大蓋為令知非大身義也感報離相竟三修因離相二一承前總以例明二約事別為遣相初須菩提菩薩亦如是言菩薩非菩薩是名菩薩亦如人身長大是也所以例者以衆生多以我能修因自稱菩薩殊不知我為能修因為所修二相俱在非是真實菩薩但是對彼不能修因者假立名字說名菩薩耳二約事別為遣相二一約度生遣相二約嚴土遣相初若作是言我當滅度無量衆生即不名菩薩何以故須菩提實無有法名為菩薩是故佛說一切法無我無人無衆生無壽者文三初就言出過作言者有自負意自謂既是菩薩應以度生為任故云我當滅度無量衆生儒典云以斯道覺斯民非豫覺之而誰與略同此意然此意固善但不可作言自負若作言自負則是心中實有我為能度生為所度故斥以不名菩薩問前言我應此言我當同耶異耶答字義似同心意實異前是憶念同體此是自負其能觀前文下有無生滅度之言此中下有斥非菩薩之語其意異可見何以下徵起釋成徵意可知釋中謂一切諸法緣會而生緣會而生則生法本無故曰實無有法無法則無我無我則諸相俱盡解此俱盡者則是入無生忍故曰名為菩薩上既反是所以不名也是故下結應離相是故者承上二義言之言不名菩薩如彼名為菩薩若此以是義故所以佛於三十年來說一切大小乘法總為顯示二無我理無我則人相衆生相壽者相一切皆無佛說如是為菩薩者宜應離相約度生遣相竟二約嚴土遣相須菩提若菩薩作是言我當莊嚴佛土是不名菩薩何以故如來說莊嚴佛土者即非莊嚴是名莊嚴須菩提若菩薩通達無我法者如來說名真是菩薩文亦三初就言出過義同上科但隨事異說可爾何以下徵起釋成釋中言如來說莊嚴佛土者土唯心現嚴亦心生唯是一心喚誰嚴誰故曰即非莊嚴是知莊嚴佛土者但約建化門頭假立名字故曰是名莊嚴須菩下結應離相言既莊嚴唯是假名則知無我無法若菩薩於莊嚴佛土時通達無我無法者進可成佛如來說名真是菩薩嚴土菩薩可弗離相偈不達真法界起度衆生意及清淨國土生心即是倒衆生及菩薩知諸法無我非聖自智信及聖以有智合云此通頌一大科義也一真法界離能所絶對待自他無二依正同源不達乎此所以起度生意及嚴土心清淨即莊嚴義也然起意即是生心既違法界即是顛倒所以經中斥其不名菩薩及猶至也若是衆生果能至於菩薩地者自能了知法無我理離於諸相契真法界雖未成佛非是大聖而自覺聖智可信將來必及於聖以有我法二空之智以為成佛階降所以經中許以真是菩薩總結修因離相竟四知見離相二一見無定相二知無實相初須菩提於意云何如來有肉眼不如是世尊如來有肉眼須菩提於意云何如來有天眼不如是世尊如來有天眼須菩提於意云何如來有慧眼不如是世尊如來有慧眼須菩提於意云何如來有法眼不如是世尊如來有法眼須菩提於意云何如來有佛眼不如是世尊如來有佛眼此亦承上發端恐謂度生不見生相嚴土不見土相果必類因成佛時亦應不知不見果其爾者何故前言如來悉知悉見為防此疑故示知見離相今且約見以示金剛鎞云肉眼者色香味觸四塵名肉勝義淨根依肉而住依肉而發有所照見名為肉眼然其功能但觀障內之色天眼者謂作觀行依肉眼邊想外境界觀想成故方能見障外之色慧眼者根本實智照真空之理也法眼者後得權智照差別之事也佛眼者智無不極照無不圓故古德頌云天眼通非礙肉眼礙非通法眼能觀俗慧眼了真空佛眼如千日照異體還同又金剛鎞云初二通於凡夫後二聲聞所無菩薩但無佛眼而復各各淺深不同唯佛則圓具前四一一殊勝皆名佛眼其如四河入海河不可得是故凡夫肉眼唯見障內天眼障外佛之肉眼見無數世界二乘天眼唯見一大千界佛之天眼見恆沙界二乘慧眼唯照我空地上菩薩亦皆分證法空佛之慧眼圓照三空洞徹真性菩薩法眼所知未盡各有分限佛之法眼所知皆盡無有分限故曰一一殊勝然如來各以於意云何及有不為問者有二意一顯無見之見無所不見猶如明鏡無心現物乃無物不現此約釋疑說也二顯雖能盡見無有定相以本唯一見隨緣而成五見其猶開池引月因池之異而說月之異若決堤通水則又以池之一而說月之一應知異固非異一亦非一以月例見豈有定相此約離相說也偈雖不見諸法非無了境眼諸佛五種實以見彼顛倒合云此頌本科義也見謂於諸法中而起分別情見佛無是事故曰不也了謂離於分別情見而遇境便了佛有是事故曰非無雖之一字乃應其所疑而縱依之言雖依所疑無有分別妄見非無了境真見何疑乎如來悉見義也下二句乃釋成上二句義言如來所以能了境者謂諸佛五種皆實以是從性起故以何義故不見諸法以若見彼諸法則有分別心生名為顛倒見無定相竟二知無實相須菩提於意云何如恆河中所有沙佛說是沙不如是世尊如來說是沙須菩提於意云何如一恆河中所有沙有如是沙等恆河是諸恆河所有沙數佛世界如是寧為多不甚多世尊佛告須菩提爾所國土中所有衆生若干種心如來悉知何以故如來說諸心皆為非心是名為心所以者何須菩提過去心不可得現在心不可得未來心不可得文四初疊河論沙顯界多言如來說法凡遇數之多者往往以恆沙說之問答可知次云於意云何等謂以前一河中沙而論恆河之數以顯恆河多也是諸恆河等乃又以多河中沙而論世界之數是不唯顯世界之多且甚多也其問答亦可知佛告下約界論生顯心多爾所國土者即指上多河沙世界言之所有衆生者如華嚴云十方剎海所有衆生種種差別所謂卵生胎生濕生化生或有依於地水火風而生住者或有依空及諸卉木而生住者種種生類種種色身等其心行差別可知故云若干種心若干猶如許也如來下約佛能知顯彼妄如來悉知者以彼有念故佛自徵云以何以故能悉知也又自釋云如來說諸心皆為非心謂非是真心不過以其暫有用故是名為心顯其是妄心也蒙引云昔南陽忠國師代宗迎止光宅時有西天大耳三藏自謂得他心通宗令師與驗試師頃曰汝道老僧即今在甚麼處藏曰和尚乃一國之師却去西川看競渡師少頃又問即今又在甚麼處藏曰却在天津橋上看弄猢猻師寂然少頃再問藏即不知師斥曰野狐精他心通在甚麼處藏無對是知機心才動早被他知若曰一念不生佛亦莫知其兆所以下釋妄顯知亦無實所以句徵起言衆生之心所以非真是妄者何也蓋以三心皆不可得謂已滅不可得不住不可得未生不可得故然佛以一知而悉知衆心義似有體其奈衆心虗妄三際叵得是雖知而本無所知豈有實相偈種種顛倒識以離於實念不住彼實智是故說顛倒合云此頌本科義也種種即若干義言衆生若干種心皆為顛倒之識以是離於實智起妄念故如來不住於彼妄念名為實智是故能知於彼說名顛倒顛倒即非心名心義也由此兩科觀之佛知佛見尚無定實況夫未到佛地妄知妄見固知其為徹體虗妄不待降伏矣總結降心離相竟二住心無住二一略明二詳示初須菩提於意云何若有人滿三千大千世界七寶以用布施是人以是因緣得福多不如是世尊此人以是因緣得福甚多須菩提若福德有實如來不說得福德多以福德無故如來說得福德多文二初問答施福前言無住施福猶如虗空不可思量恐於修行之時行未相應重疑施福故又約假設之事此例言之若有人者謂設若有是人也滿界寶施其福似多若住相則不多為顯斯義故問以以是因緣得福多不試看空生如何理會答以以是因緣得福甚多者亦知如來為顯為住福也須菩下重為揀辨如來見其答處依俙恐墮似是不避饒舌重為眉目而言若住相布施不達性空福德有實者汝雖說多如來不說為多以是無住布施已知性空福德無故不惟汝說為多如來亦說為多但只要所修之行與無住相應耳然此修分之中略明降心仍約度生無度略明住心仍約布施無住者為顯行解相應所謂如是而解如是而修如目與足如是而見如是而行若行不如見恐誤前程行與解違亦復如是偈佛智慧根本非顛倒功德以是福德相故重說譬喻合云此頌本科義也上二句言前說無住布施是佛智慧根本以能生佛智慧故非同住相布施名為顛倒功德以不出輪回苦故但恐不知無住布施是福德性者以為是福德相以是之故重說滿界寶施之譬而比喻之以顯無住福多義也略明竟二詳示四一見佛無住二聞法無住三得果無住四修因無住初二一見身無住二見相無住初須菩提於意云何佛可以具足色身見不不也世尊如來不應以具足色身見何以故如來說具足色身即非具足色身是名具足色身此與下科義似復前而有二義不同一正兼不同二化報不同正兼不同者以信分中明不可以身相見如來而解分中明不可以三十二相見如來其意皆是兼為釋疑非正示降住之文今乃正示住心故不同也化報不同者謂前二說身說相初無具足之言次有四八之數明知其為應化之身今身相皆以具足見稱者應指實報之身蓋必萬德莊嚴方稱具足以具足即圓滿義也良以修行漸深將見報體設有所住亦礙法身故又約此以明無住最高大身勝妙之色無少不足故云具足色身問以可以等者恐其有住心故答以不應等者以住則成礙不見法身故徵意可知釋中如來說具足色身者以是劫海修因之所感故然既屬因感即是緣起緣起無性故曰即非具足色身但為舉果勸樂生信假立名字故曰是名具足色身既曰是名應當求實明知其不應住矣二見相無住須菩提於意云何如來可以具足諸相見不不也世尊如來不應以具足諸相見何以故如來說諸相具足即非具足是名諸相具足色身為總諸相為別諸相為能嚴色身為所嚴所嚴之妙全在能嚴猶為難忘故復約此以明無住準華嚴相海品略明有九十七種大人相廣明有十華藏世界海微塵數大人相一無少缺故云具足即非是名等準上可知偈法身畢竟體非彼相好身以非相成就非彼法身故不離於法身彼二非不佛故重說成就亦無二及有合云此合頌此科與上科義也於中復二前七句正頌言佛真法身畢竟有體非彼相好及於身相故經言不可以色身見不可以諸相見也經中無好有色者色必具好偈中去色存好者與經影顯故以非相成就者非字應作無字謂以法身無相隨緣成就具足身相所以經言即非身相者謂非彼法身故又言是名者以身相不離於法身故何故身相不離於法身耶以彼二原依法身現起非不是法身之佛所以既云即非而又重說隨緣成就隨緣成就即是名義也末句拂執亦無二及有者謂如來為破有故亦說無二為破無故亦說有二是知經言即非是名皆為對機施設而淨法界中不唯有不可說即無亦不可說耳總結見佛無住竟二聞法無住二一說者無住二聞者無住初須菩提汝勿謂如來作是念我當有所說法莫作是念何以故若人言如來有所說法即為謗佛不能解我所說故須菩提說法者無法可說是名說法恐謂既不可以身相見佛將必要見法身真佛但法身無形何以對機作念而說諸法佛知空生已萌斯疑故不待其問而遮之曰汝勿謂如來作是念等言如來雖已隨機說法皆以無緣而應實不預為作念我今當為說何等法是雖終日說法而實無所住矣纂要云谷中無人能作音聲亦顯法身不念說法故以勿謂遮也既遮勿謂而又言莫作是念者言不唯不可說即是念亦不可作故何以句徵意可知釋中謂設若有人言如來有所說法者即為謗佛法執未空以實有所說即法執故若論佛無敢謗所以謗者非是有心以不能解我所說如谷嚮同法界故此是反顯法不應住下乃正明言如來凡言說法者皆為隨機施設淨法界中都無是事故云無法可說是知說法唯是假名正顯其不應住也偈如佛法亦然所說二差別不離於法界說法無自相合云此頌本科義也例上佛既不可以身相見法亦不可以音聲求故曰如佛法亦然說有說無對機不同故云所說二差別雖有差別不離法界以所說之法唯依他起無自相故說者無住竟二聞者無住爾時慧命須菩提白佛言世尊頗有衆生於未來世聞說是法生信心不佛言須菩提彼非衆生非不衆生何以故須菩提衆生衆生者如來說非衆生是名衆生此段約魏本有秦本則無近時秦本中乃後人補入纂要不釋刊定記略要敘釋今見彌勒偈中義有故準前後釋之名冠慧命者以魏譯長老為慧命約智慧能續法身故佛不可以相見法不可以聲求二義俱深末法衆生恐難信受故問以頗有衆生於未來世等顯現在或庶幾耳佛意以非無信者但彼非衆生以能信此理者即名為佛故雖名為佛若不發解起行終無實證故曰非不衆生謂依然還是衆生此寓有䇿修意也徵意可知釋中言此等衆生應名為佛所以還名衆生者以雖名衆生如來以能信故說非衆生又以未能解修假立名字說為衆生豈可自住衆生之相而起抱迷絶分之見哉偈所說說者深非無能信者非衆生衆生非聖非不聖合云此亦頌本科義也所說即法說者即佛佛不可以相見法不可以聲求故二俱言深也非無能信者語出反顯正明亦有信者但此人非是衆生以能信即佛故依然還是衆生以無解與行故解行不圓終無實證故非聖此釋還是衆生義也能信即佛畢竟當成故非不聖此釋非是衆生義也總結聞法無住竟三得果無住二一空生問得為無二如來印答無得初須菩提白佛言世尊佛得阿耨多羅三藐三菩提為無所得耶空生意謂如我前言無有定法名阿耨菩提指在信分至後如來亦言實無有法得阿耨菩提指在修分今觀能信之人如來說其非是衆生以是成佛人故但以解行未圓而說是名衆生是知若有解行決定成佛況今如來現得阿耨菩提是皆與前相違試問如來佛今所得阿耨多羅三藐三菩提為是無所得耶此問蓋為印證前語以便進修非有無雙疑觀下印答自知二如來印答無得佛言如是如是須菩提我於阿耨多羅三藐三菩提乃至無有少法可得是名阿耨多羅三藐三菩提文二初印定空生雖知無得尚有所疑故問為無如來極力承當徹根為斷故印言如是謂如汝所問者是矣重言者顯決定故須菩下二申答謂應其所問申明其義而答之也言我於阿耨菩提初似有得其次漸無乃至最後無有少法可得以一念不生故但以妄盡理圓假立名字說為阿耨菩提故曰是名等固知其不應住耳偈彼處無少法知菩提無上合云此但頌印答無得義也彼處者指修證之處猶言地位也若有少法可得則是妄未盡理未圓不名無上故必至無有少法乃證之菩提無上總結得果無住竟四修因無住復次須菩提是法平等無有高下是名阿耨多羅三藐三菩提以無我無人無衆生無壽者修一切善法即得阿耨多羅三藐三菩提須菩提所言善法者如來說即非善法是名善法文三初理本無修恐謂果既無得因亦無修何故菩薩發心修善故如來先以理本無修示之是法即指菩提三種中且約自性菩提言之平等者在凡不減在聖不增在聖不增故無高在凡不減故無下無高無下絶諸對待是名阿耨多羅謂無上也性本具足一切善法是名三藐謂正等也性本不為四相所弊是名三菩提謂正覺也然此但約理具非關事造故亦唯是假名顯非實證縱至信解相應亦不可執理廢事永嘉云豁達空撥因果莾莾蕩蕩招殃禍蓋深救此弊以無下事須有修言既曰是法平等無有高下而現見生佛判然者蓋以凡夫為四相所弊不得正覺二乘不修善法失於正等菩薩修而不具未及無上佛以無我無人無衆生無壽者異凡夫之不覺名為正覺佛以修善異二乘之偏枯名曰正等佛以具修一切善法異菩薩之有上名曰無上故曰即得阿耨等是知發心菩薩要須於無修中立修而如來證果亦唯向無得中立得仍不違無得義也須菩下顯不應住恐聞具修善法又起住因之見故曰所言善法者如來說即非善法以無我人等相修同無修故但為斷妄復真假立名言說為善法故曰是名知此則修因不應住矣偈法界不增減淨平等自相有無上方便及離於漏法是故非淨法即是清淨法合云首二句頌理本無修法界者一真法界即是自性菩提經言是法者指此不增減者出平等義淨平等者立平等名謂清淨平等離差別染也自相者自性天然之相無高下絶對待非修得故次二句頌事須有修言雖曰清淨平等亦惟理具若欲事造亦有無上菩提方便法門如經言無我人等相即方便法門也既得方便法門還須具修衆善故云及離於漏法離於漏法即指無漏善法是所應修故是故下頌顯不應住是故者謂以是依於無我等方便修習離於漏法故自然不住於相故非淨法經言即非善法是也但為斷妄復真假立名言故云即是淨法經言是名善法是也總結住心無住竟三校量持福須菩提若三千大千世界中所有諸須彌山王如是等七寶聚有人持用布施若人以此般若波羅蜜經乃至四句偈等受持讀誦為他人說於前福德百分不及一百千萬億分乃至算數譬喻所不能及文三初舉能校準教中一大千內有百億須彌今以如是須彌山等七寶為聚用作布施其施可謂大矣若人下明所校經惟以此偈至四句甚至等於不及受持讀誦兼說其行可謂微矣於前下顯不及於前福德者謂以後持說之福校於前之福德百分不及一等謂以前寶施福德不及此之持說此亦由於福不趣菩提此能趣菩提故百千萬億等準前可知按前五番校量初以一界寶施二以無量界寶施三以恆沙身施四以無量恆沙身施五以如來因地供佛從劣向勝顯法漸深無可議矣今當第六校量但以百億須彌等寶施尚劣第一何況第二乃至第五後劣於前於理何申蓋以修前信解難解後修證易大經云發心究竟二不別如是二心先心難難則校量須勝易或隨便拈題此則為是修分已終聊用校量以發行人勝進之意耳偈雖言無記法而說是彼因是故一法寶勝無量珍寶數力無似勝無似因亦然一切世間法不可得為喻合云此約義而頌也前四句先顯經勝言欲得菩提須修善法而修習善法要在持說此經但經唯名句文身是無記法云何持說能得菩提為遮此難故曰雖言無記法而說是彼因謂雖言此經是無記法攝而亦說此經是彼菩提之因是故此一法寶勝彼無量珍寶無量珍寶即指經中等百億須彌之寶聚也後四句次顯持勝言寶施之數極盡其分析之力無能似於此經之勝經既無能似者而持說為因亦然況復一切諸世間法不可得而為喻而等須彌之寶聚自應校量不及總結究竟降住起修分竟四決定降住成證分三一降心離相二住心無住三結歸問意初二一略明二詳示初須菩提於意云何汝等勿謂如來作是念我當度衆生須菩提莫作是念何以故實無有衆生如來度者若有衆生如來度者如來即有我人衆生壽者須菩提如來說有我者即非有我而凡夫之人以為有我須菩提凡夫者如來說即非凡夫是名凡夫文三初預遮謬疑恐謂如來歷示降心皆言度生無度何故佛於最初成道三七思惟作念度生如法華經說佛知空生已萌斯疑故不待其問而遮之曰須菩提於意云何汝等勿謂如來作是念我當度衆生佛意以三七思惟作念度生是約小機所見非真實耳既遮勿謂而又教以莫作是念者決定遮故何以下徵顯無度徵意可知顯中先正明次反顯正明中言如來證真法界無法不融一切衆生一時成道豈復見有能度所度反顯中若果見有衆生為如來所度則是如來以我為能度故曰有我我相既立人相衆生相壽者相將必因之俱有如來不爾故知無度須菩下兼防謬難恐謂佛若無我何故如來最初成道而言我是如來應供正遍知我是一切知者一切見者等亦如法華經說為防斯難故云如來說有我者即非有我以是最初成道為揀邪宗非遍計故而彼世間凡夫不知斯意以為如來有我亦謬計也又恐謂既無衆生焉有凡夫而言凡夫之人以為有我故防云凡夫者即非凡夫謂凡夫亦法界故雖亦法界但以未能證故對彼聖者能證假立名字故曰是名凡夫偈平等真法界佛不度衆生以名共彼陰不離於法界取我度為過以取彼法是取度衆生故不取彼應知合云此單頌徵顯無度中義也首句明所證之理言一真法界凡聖平等故云平等真法界佛證此理不見衆生可度故云佛不度衆生以名二句顯無衆生共猶與也言佛所以不度生者以衆生之名與彼所依五陰二皆不離一真法界謂緣起無性故取我四句顯無能度取猶執也取我度為過者謂若執取我為能度則為二過為猶成也二過者以取彼法是取度衆生故彼法指所依五陰是猶實也取彼五陰是實則是法執取所度衆生之名為我所度則是我執是則經中但顯有我不顯有法偈則雙顯蓋經亦意含也末句言佛不取彼五陰及名應知無度問此中度生無度與前何別答前約菩薩未得決定勉而行之此約佛地已得決定安而行之是證修亦自不同況夫信分中無度視此更天淵矣無降而降唯佛極證發心菩薩可為準的略明竟二詳示二一觀相離相二離相亦離初三一探定本見二驗出非真三權以偈安初須菩提於意云何可以三十二相觀如來不須菩提言如是如是以三十二相觀如來文二初就相探問蓋以空生歷承開示相似心空未免欲立心空之見若果心空相即無相故問以於意云何可以三十二相觀如來不佛意蓋為只恐不是玉也問前於解分中已有此問與此何別答有二不同一者前為斷除餘疑此為探其本見二者前云見是約現量此云觀是約比量蓋如來已知空生相似心空未能親見相即無相身耳須菩下依問呈見如是者謂如佛所說者是矣重言者顯決無異說故其意以但自無心一切色是佛色故無妨以三十二相觀如來所謂是則也是非則實非著眼探定本見竟二驗出非真佛言須菩提若以三十二相觀如來者轉輪聖王即是如來須菩提白佛言世尊如我解佛所說義不應以三十二相觀如來文二初約喻以驗空生唯知順水推舟如來故為簸糠眯目而言若以三十二相觀如來者如彼轉輪聖王亦具三十二相應亦即是如來然輪王是如來世間不許佛不可以相觀明矣須菩下果異前說空生不解逆風把柁而言如我解佛所說義然既云解佛所說其見處不穩可知況又云不應以三十二相觀如來出乎爾反乎爾空生決不如此蓋為後世之腳跟不點地者示現作覆轍耳問山河及大地全露法王身況夫如來三十二相豈不即是法身何故如來不許即相觀反令離相觀耶答如來不許即相觀者非是不許但恐其見墮相似終礙實證至云若以相觀輪王即如來者非是教令離相乃勘驗龍蛇之語空生若果頭角崢嶸終不隨他撥波覓水所謂竿頭絲線從君弄不犯清波意自殊其奈一沙在眼觸途迷蒙而云不應以三十二相觀如來是又被世尊舌頭瞞矣驗出非真竟三權以偈安爾時世尊而說偈言若以色見我以音聲求我是人行邪道不能見如來應化非真佛故不可以色見亦非說法者故不可以聲求若以色見聲求非正知見縱有所修必陷邪徑故曰是人行邪道且色聲皆法也見求皆執也法執既未盡袪法身豈能全露故曰不能見如來然佛說此偈者良以不以相觀是空生舊見可以相觀是空生新解新解既被搖動仍歸舊見舊見自覺非是豈甘固守正是前無新證退失故居歷覽二際自生艱險故如來不敢更斥其非且暫安其心令其守舊而示之以離色離聲至於竿頭進步佛意容再圖之耳偈非是色身相可比諸如來諸佛唯法身轉輪王非佛非相好果報依福德成就而得真法身方便異相故唯見色聞聲是人不知佛以真如法身非是識境故合云經有三科偈無探定本見唯存後二於中前八句義頌驗出非真非是色身等者謂非是金色之身三十二相可以比知諸佛如來以諸佛如來無別色身相好唯有法身獨存如轉輪王雖具三十二相是王非佛可知此義非相好等者謂由上輪王之喻觀之足知如來非相好有為有漏果報依因中植福修德成就而其所得者乃真如法身彼色身相好者殆為方便度生隨機示現別異相故空生之意如是其所言可以相觀者似解非真矣後四句義頌權以偈安唯見色等者謂唯以見色觀佛聞聲求佛是人縱有所修必陷邪徑不能知見於佛以真如法身離言說相離心緣相非是眼識耳識及意識境故如來所說如是其教以安心守舊意有所待矣總結觀相離相竟二離相亦離二一遮念離相二明遮所以初須菩提汝若作是念如來不以具足相故得阿耨多羅三藐三菩提須菩提莫作是念如來不以具足相故得阿耨多羅三藐三菩提恐謂諸佛如來既不可以相見亦不可以相得若爾則修因種相皆為徒勞大心不須發小乘宜自守耶才萌斯念佛即遮之曰我言色見聲求是行邪道者乃為遣有相之執汝若因此便作是念如來不以具足相故得阿耨菩提者是又執無相為是其猶執藥成病出囿而入網矣出囿入網解脫良難執藥成病纏綿更甚故誡以莫作是念等蓋深遮之斷不可萌斯念耳二明遮所以須菩提汝若作是念發阿耨多羅三藐三菩提心者說諸法斷滅莫作是念何以故發阿耨多羅三藐三菩提心者於法不說斷滅相文二初出過重叮言如來所以教汝莫作是念者以汝是衆中標榜後學龜鑑汝若作是念者致令一類發菩提心者說諸法斷滅成焦芽敗種墮一闡提佛亦難救所謂寧使著有如須彌山不使著空如芥子許也恐其是念已萌未能遽忘故重教莫作是念以示諄諄叮嚀之意何以下徵釋其故言如來所以諄諄叮嚀莫作是念者何以故耶良以發菩提心者於法不說斷滅相今汝亦屬發菩提心人更作是念夫豈可哉華嚴云色身非是佛音聲亦復然亦不離色聲見佛神通力前二句義當觀相離相後二句義當離相亦離是知有執則墮斷常遞互相背無執則合中道遞互相成讀是經者但求盡執焉可矣偈不失功德因及彼勝果報合云此約義略頌也修因種相功無唐捐故曰不失功德因以因感果勝報必成故云及彼勝果報若此者豈可作念不以具足相故得菩提耶總結降心離相竟二住心無住二一略明二詳示初二一無住福勝二明其所以初須菩提若菩薩以滿恆河沙等世界七寶持用布施若復有人知一切法無我得成於忍此菩薩勝前菩薩所得功德滿恆沙世界七寶布施約未知法無我理者言之若復有人亦約行布施者言之但於行布施時了知一切諸法皆悉無我由是內不見施者外不見受者中亦不見所施所受一體空寂忍可於心故曰得成於忍又得成於忍者謂堪忍行施毫無動念於其間也此等菩薩可謂決定無住故得勝前菩薩所得功德以前之菩薩未知法無我理未得決定無住行故二明其所以何以故須菩提以諸菩薩不受福德故須菩提白佛言世尊云何菩薩不受福德須菩提菩薩所作福德不應貪著是故說不受福德文二初承徵自釋不受福德者不願自己受用但願回此功德以向佛道如法華經諸天回向偈云我所有福業今世若過世及見佛功德盡回向佛道是也反顯前之菩薩受福德不回向此勝劣之所由分耳須菩下因問答釋不受德福此事良難問以云何蓋欲得其意而取法之也答以不應貪著者以一有貪著即墮有漏不知法無我理者固應如是菩薩既知法無我理自然不應以是故我說得忍菩薩決定不受福德問此與信分解分修分略明住心中皆約不住施福為言何所異耶答前三唯顯不住福多啓發信解修行之心此則的指得忍菩薩決定不受福德有志決定者亦知所取法可爾偈得勝忍不失以得無垢果示勝福德相是故說譬喻是福德無報如是受不取是福德應報為化諸衆生自然如是業諸佛現十方合云此通頌略明住心一科義也首二句言菩薩於行布施時知法無我得成勝忍永無退失以此能得無垢之果無垢即佛果也示勝二句言為欲顯示勝福德相是故重說恆沙世界七寶布施之譬而比喻之是福二句言是福是德無有果報以於如是受用不取著故後四句恐謂既無果報空說福德何所益耶故又言是福是德應有果報必待為化諸衆生時以為化衆生自然顯現如是相好之身勝妙業用如彼諸佛顯現十方其福德何其勝哉略明竟二詳示二一正報無住二依報無住初須菩提若有人言如來若來若去若坐若臥是人不解我所說義何以故如來者無所從來亦無所去故名如來文二初防疑斥言疑云因中既不受福德果上自應無有相好莊嚴何故現有人言如來以相好莊嚴之身去來坐臥為諸衆生作利益事耶防云設若有人作如是言如來若來若去若坐若臥利衆生者亦是尋常聞我所說然是人雖是聞我所說而實不解我所說義以彼執實有非我所說義故何以下徵起申明謂以何以故斥其不解我所說義以我言如來者謂內證不變之體為如外現隨緣之用名來如是則來唯隨緣迎之莫知其所以來故云無所從來去亦隨緣追之罔識其所以去故云亦無所去去來既爾坐臥亦然現前既爾又復應知從兜率天下閻浮提亦唯如如不動而來由拘施城詣娑羅樹亦唯如如不動而去是如來正報尚不應住降斯以還豈應有所住乎偈去來化身佛如來常不動於是法界處非一亦非異合云此頌本科義也首句言有去有來唯是應化身佛隨緣而來隨緣而去非真實也次二句言法身如來常自寂然不動於是法界之處所謂隨緣赴感靡不周而恆處此菩提座也末句言化身與法身非一謂應化隨緣方便非真故方便非真勿認波而忘水若認波忘水必招陷溺之患故佛斥言是人不解我所說義又化身與法身非異謂從真起應全應全真故全應全真勿離波而求水若離波求水終無得水之益故佛常言如來若來若去若坐若臥由此觀之則應化之身不過隨緣成益若住著於彼則不可也正報無住竟二依報無住二一微塵無住二世界無住初須菩提若善男子善女人以三千大千世界碎為微塵於意云何是微塵衆寧為多不須菩提言甚多世尊何以故若是微塵衆實有者佛即不說是微塵衆所以者何佛說微塵衆即非微塵衆是名微塵衆文四初如來示問以三千界碎為微塵者金剛鎞云約大乘宗知色唯識現於觀行中假想分析和合粗色以至極微非若小乘之實有塵可析也問以於意云何寧為多不者驗其執實不執實故須菩下空生解答答以甚多者以既不執實無妨言多何以下徵起釋成徵中謂以何以故而說甚多釋中言實有佛則不說反顯說則必非實有非實有故雖說為多抑又何礙乎所以下轉徵轉釋徵中謂實有佛則不說所以又說者何也釋中言佛說微塵衆即非微塵衆以重合成界再析成無塵名衆名二俱失故是知塵名衆名但就分析和合粗色假立名字故云是名等也然既唯是名其不應住也明矣偈世界作微塵此喻示彼義微塵碎為末示現煩惱盡合云上二句言世界碎作微塵則微塵不實可知用此為喻示彼一切可作之義皆不實故下二句碎猶析末猶無也言微塵再析則歸於無有示現不應執實不執實則煩惱盡矣微塵無住竟二世界無住世尊如來所說三千大千世界即非世界是名世界何以故若世界實有者即是一合相如來說一合相即非一合相是名一合相須菩提一合相者即是不可說但凡夫之人貪著其事文三初示不應住三千世界析之可為微塵故曰即非世界以界名一名二俱失故是知世界但約衆塵和合假立名字故曰是名世界既唯是名即不應住以無實故何以下徵顯無實徵意謂以何以故但唯是名無實體也顯中謂世界若是實有則是實有一相實有合相世界不爾以如來說一合相即非一合相以一可為衆合為可析故須菩下印說防謬言如上所說一合相者即是不可說以一不定一合非定合故恐謂既不可說即應永默何必說已又遣故為饒舌防云但以凡夫之人迷昧其理貪著其事輪轉於中莫由出期不得已而隨說隨遣設永默者憑何所遣令解法空之義偈非聚集故集非唯是一喻聚集處非彼非是差別喻但隨於音聲凡夫取顛倒非無二得道遠離於我法合云此頌世界無住義也聚集者和合義言如上所說微塵尚無說誰聚集故曰非聚集正以非聚集故無妨假立名字說聚集也非唯是一喻者謂此聚集之法非唯是一法之喻以一切聚集之法皆同此故聚集處非彼者謂聚集之處得世界名非彼微塵云何非彼微塵以微塵是差別之喻喻一切可作之法此是總相之喻喻一切聚集之法故曰非是等也若但隨於音聲聞說微塵便執微塵實有聞說世界便執世界實有是為凡夫執取於無我中計我無法中計法故以顛倒名之若解二者俱非則真空無二當下得道以能遠離於我法執故按上文詳示降心中佛以一切諸見束為斷常二見二見不生一切皆盡是為決定降伏此中乃以一切諸法束為依正二報二報不住一切俱空是為決定安住總結住心無住竟三結歸問意二一結歸云何降心問二結歸云何住心問初準前兩番請問皆以住心在前降心在後兩番開示皆以降心在前住心在後其意蓋以妄心久熾覺心乍興乍興則力微久熾則功著功著則降不容緩故在前力微則住不宜速故在後也今當開示已竟承上義便故亦先結降心後結住心文二一拂我顯無二拂法結問初二一問答拂我二徵起顯無初須菩提若人言佛說我見人見衆生見壽者見須菩提於意云何是人解我所說義不不也世尊是人不解如來所說義準前歷示降心皆令度生無我且言若菩薩有我人等相即非菩薩恐謂相由見生是如來心中先有我等相見方便人有我等相見設若如來心中原無我等相見憑何說人有我等相見如人心中無事即便無所說故為防斯疑故曰若人言佛說我見人見衆生見等問以於意云何等者為明佛無我等相見說非真說故答以不解等者是空生已知佛無我等相見說非真說解斯義者必不言佛有說故二徵起顯無何以故世尊說我見人見衆生見壽者見即非我見人見衆生見壽者見是名我見人見衆生見壽者見徵意謂以何以故說彼不解如來所說義也釋中言世尊說我見人見衆生見壽者見即非我見人見衆生見壽者見以如來心中原無我等相見說非真說如谷嚮無實性故但為對治彼故假立名言而說彼有我等相見故曰是名等也然說既是名而說已便休心中曾無絲毫影跡豈若世間衆生未及口說先已心形口說既盡心中影跡猶未全銷此是微細深惑唯佛能盡故假空生拈提以為菩薩未到佛地者法偈見我即不見無實虗妄見此是微細障見真如遠離合云此合頌此科與上科義也首二句言若於心中見彼有我者即不見真如依然是無實虗妄見故此是地上菩薩微細惑障必待佛地圓見真如乃能遠離是知如來雖說我等相見心中實無我等相見蓋為機之所至暫現有說如雲雨無心而巨細咸潤耳總結拂我顯無竟二拂法結問須菩提發阿耨多羅三藐三菩提心者於一切法應如是知如是見如是信解不生法相須菩提所言法相者如來說即非法相是名法相按前空生兩番請問皆為發菩提心者起見故今結歸問意亦約發菩提心者言之一切法通指正宗以來所說降心之法知者聞而知比量知也信者知而信隨語信也見者照而見現量見也解者見而解如理解也此約信解二分為結不生法相者謂信解之後漸次究竟以至決定降伏則並所說一切法相心中亦不復生此約行證二分為結佛意以空生兩番致問發菩提心云何降心前已歷談降心之法故今教以於前所說如是知如是見等果能如此則妄心不待降矣恐謂既落言詮已屬法相依之信解修證心中何得不生故又遣之曰所言法相者即非法相以如來心中原無法相之見雖說法相如吹籟無少留故但為對彼執法相者假立名言故曰是名法相知此義者自然不生以無可生故是則上科除我執細相此科除法執細相也偈二智及三昧如是得遠離合云此偈義少不足應問云法執細障遠離云何故云二智及三昧如是得遠離謂執法細障必以初地見道智二地已上修道智及等覺位中金剛三昧如是漸次而斷至佛地乃得遠離總結結歸云何降心問竟二結歸云何住心問二一校顯持說二示說結問初須菩提若有人以滿無量阿僧祗世界七寶持用布施若有善男子善女人發菩提心者持於此經乃至四句偈等受持讀誦為人演說其福勝彼按前歷示住心皆顯無住布施其福最勝恐謂若實爾者但應無住行施則已受持讀誦此經為人演說似不必耳何故自正說已來數數校量勸持勸說耶如是如來重為校量而言滿無量僧祗世界七寶持用布施者即約無住行施者言持此經者持有二義一持以自利二持以利他乃至四句等者無論多持與少持故此總標也受持讀誦則是持以自利為人演說則是持以利他此別明也其福勝彼者不得此經妙旨無住之行不能成故二示說結問二一示說不取二不取之故初云何為人演說不取於相如如不動恐謂受持無住易演說無住難故自徵云云何為人演說又自釋云不取於相如如不動言不取於相者謂不取說者聽者及所說所聽法相如是而說三輪體空唯如如理常時現前寂然不動所謂無說無聞是名真說般若其所得福勝於寶施者宜矣偈化身示現福非無無盡福諸佛說法時不言是化身以不如是說是故彼說正非有為非離諸如來涅槃合云此通頌上科與此科義也言此經乃化身示現所說持說此者似應無福故曰此福非無且是無盡之福以諸佛說法之時不言我是化身若言是化身所說福則劣矣正以不如是說是故彼說名為中道正法蓋以不取於相如如不動不住有為又雖言如如不動而亦不廢說法不住無為不住有為則不沉生死不住無為則不滯涅槃是為妙契中道即諸佛如來無住處大涅槃法持說此者必當作佛豈前寶施所能校量二不取之故何以故一切有為法如夢幻泡影如露亦如電應作如是觀徵意謂以何以故不取於相耶釋中言一切諸相皆屬有為之法如夢幻等故若詳釋者復有三義一正釋秦本二兼出魏譯三兩經會合正釋秦本者一切即相不止如上所釋而如上所釋亦在其中以凡屬因緣和合之法皆有為攝故然有為攝法雖多束之不出五陰色心喻中有總有別總則猶如夢事眠時似有寤時實無五陰色心亦爾迷時似有悟時實無故別則幻謂幻事由幻術力換愚人眼色陰亦爾由心緣力迷者執有故泡謂水泡因雨擊生起滅不恆受陰亦爾因境感現現無常現故影謂鏡影托外物現無物無跡想陰亦爾托塵似有離塵實無故露謂朝露乘夜氣生日照則無行陰亦爾無明業運智鑑元空故電謂電光虗明暫發閃爍無定識陰亦爾妄照忽起變現靡澄故是知一一皆是無常法法總歸壞滅作如是觀自然不取於相如如不動故云應也空生兩問住心至此方以結歸以果能如是無患乎覺心之不住矣又金剛鎞云夢幻泡影皆喻本空如露如電同彰迅滅妙符破相之宗巧示忘情之觀亦可不作斷疑但是解釋不取相等以觀諸有為如夢如幻等自不取不著契合真如無有分別動搖矣兼出魏譯者魏本云一切有為法如星翳燈幻露泡夢電雲應作如是觀前後二句全同秦本中二句有九喻可喻九種有為九種有為者別相有六總相有三別相六者見相識器身受也見即見分準楞嚴乃真見中妄見如淨目中翳九喻中第二翳喻似之相即相分由妄見生如患翳者目前見金星等九喻中第一星喻似之法中先見後相喻中先相後見者法約生起為次喻約還滅為次故識即賴耶迷位有用如燈能照夜九喻中第三燈喻似之器即器界敗壞無常猶如幻事第四幻喻可比身即根身三相遷移猶如朝露第五露喻可比受即領納起滅不恆猶如水泡第六泡喻可比總相三者過去法現在法未來法也過去叵得猶如夢事第七夢喻如之現在暫停猶如電光第八電喻如之未來莫辨如雲虗覆第九雲喻如之兩經會合者問魏本九喻秦本六喻兩經不同者何也答什師義翻以六攝九謂色攝相器以相分屬細色器界屬粗色故受攝受用以受用即受陰故五陰總相攝身以根身乃五陰合故想行攝三世以三世體是行陰但行陰密移憑心想現故識攝見識以見即賴耶之見分同為識陰攝故法既可攝喻亦隨法六九本不相違五陰法相常見什師妙譯為取易明讀是經者得意忘言可也偈九種有為法妙智正觀故見相及於識器身受用事過去現在法亦觀未來世觀相及受用觀於三世事於有為法中得無垢自在合云偈有三義一總標正觀二別明有為三顯示無礙經承上文釋不取相意偈承上文釋非有為二句意也言所以非有為非離等者以於九種有為法中以空有無礙之妙智正觀中道故此總標也別明中合魏經九喻言之見即賴耶見分相即賴耶相分識即賴耶此是細相三法器即器界身即根身受謂器身相對中間所生覺受謂於違順中庸等境而生苦樂捨之三受此是粗相三法過去現在句乃總結上之六法以細相屬過去粗相是現在法故亦觀未來世者未來未至例現在觀故所觀之法同乎現在故曰相及受用此相與上不同上是相分此兼身器故此上合星翳燈幻露泡六喻如經文釋觀於三世事者此又總觀過去事如夢現在事如電未來事如雲也後二句顯示無礙言果能如上觀察則於一切有為法中得無垢染所謂不取於相如如不動是也既得如如不動然後應機說法得大自在猶如塵盡鏡明萬象斯鑑所謂非有為非離諸如來涅槃是也總結正宗分竟三流通分佛說是經已長老須菩提及諸比丘比丘尼優婆塞優婆夷一切世間天人阿修羅聞佛所說皆大歡喜信受奉行一卷經內說通師資但云佛說者就勝為言故生信發解起行證果利益已周故云說是經已首舉須菩提者為長老是當機故次舉比丘者是知識為常隨故比丘尼隨佛出家依衆修行應在比丘之後優婆塞優婆夷此云淨信男淨信女亦云近事男近事女蓋是具清淨信持齊奉戒又能親近三寶承事供養者也一切世間總該多衆天人修羅者略舉天上人間及非天神衆餘以意含此等皆權實未定或亦內祕菩薩外現護法跡耳皆大歡喜者以當機全身擔荷餘衆隨分受益三草二木各得增長乃喜其成佛有分非常喜也信謂忍其教受謂領其理奉則遵教循理行則自行化他夫如是則慧水長流法脈永通衍塵劫而不滯利萬彚而無遺矣回向偈曰輕塵足泰嶽墜露添瀛流筆舌力有限高深義莫求我聞持說功財命施難儔願以回生界同躋般若舟
