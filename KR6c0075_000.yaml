body:
  text: 金剛般若經偈會本敘夫金剛般若經者劈我法之巨斧啓修證之要關也其義深遠其詞疏雜非大智無以導其微豈小慧可能搆其緒所以慈氏頌之無著受之世親承之乃致教流印土若金烏之𦦨赫扶桑義闡神州等玉兔之光浮雪嶺義淨法師云無著菩薩昔於覩史多天慈氏尊處親受八十行頌又云能斷金剛西方乃有多釋考其始也此頌最先是金剛般若經之有頌而頌之出於慈氏者有明證矣然義師既知此頌是慈氏所傳其所譯頌本乃云無著造者蓋命字之誤耳且所譯之頌與菩提留支所譯者校之猶輪一籌故令注疏家多取留支譯也今撰新疏亦用留本但不同諸家隨意取舍前後參差務使經偈相對勢如合璧意旨互通資並交蘆逐段銷釋體皆如此亦有無偈者疏中各出其由檢閲自知第慮夫講者依疏並談聽者執經無偈遂令師啓雙戶資獲半珠得毋便於講而不便於聽乎緣製會本辨疏流通庶後講者聽者各有所憑宛如兩鏡相對一燈中然不唯齊照互容且彼此酷肖焉將付剞劂略述此以示鄙意云爾時乾隆三十年歲次乙酉十一月望前三日賢宗後學通理謹識金剛般若經偈會本經姚秦鳩摩羅什譯偈元魏菩提留支譯如是我聞一時佛在舍衛國祗樹給孤獨園與大比丘衆千二百五十人俱爾時世尊食時著衣持鉢入舍衛大城乞食於其城中次第乞已還至本處飯食訖收衣鉢洗足已敷座而坐時長老須菩提在大衆中即從座起偏袒右肩右膝著地合掌恭敬而白佛言希有世尊如來善護念諸菩薩善付囑諸菩薩世尊善男子善女人發阿耨多羅三藐三菩提心云何應住云何降伏其心巧護義應知加彼身同行不退得未得是名善付囑佛言善哉善哉須菩提如汝所説如來善護念諸菩薩善付囑諸菩薩汝今諦聽當為汝説善男子善女人發阿耨多羅三藐三菩提心應如是住如是降伏其心唯然世尊願樂欲聞佛告須菩提諸菩薩摩訶薩應如是降伏其心所有一切衆生之類若卵生若胎生若濕生若化生若有色若無色若有想若無想若非有想非無想我皆令入無餘涅槃而滅度之如是滅度無量無數無邊衆生實無衆生得滅度者何以故須菩提若菩薩有我相人相衆生相壽者相即非菩薩廣大第一常其心不顛倒利益深心住此乘功德滿復次須菩提菩薩於法應無所住行於布施檀義攝於六資生無畏法此中一二三名為修行住所謂不住色布施不住聲香味觸法布施自身及報恩果報斯不著護存己不施防求於異事須菩提菩薩應如是布施不住於相何以故若菩薩不住相布施其福德不可思量須菩提於意云何東方虗空可思量不不也世尊須菩提南西北方四維上下虗空可思量不不也世尊須菩提菩薩無住相布施福德亦復如是不可思量須菩提菩薩但應如所教住調伏彼事中遠離取相心及斷種種疑亦防生成心須菩提於意云何可以身相見如來不不也世尊不可以身相得見如來何以故如來所説身相即非身相佛告須菩提凡所有相皆是虗妄若見諸相非相即見如來分別有為體防彼成就得三相異體故離彼是如來須菩提白佛言世尊頗有衆生得聞如是言説章句生實信不佛告須菩提莫作是説如來滅後後五百歲有持戒修福者於此章句能生信心以此為實説因果深義於後惡世時不空以有實菩薩三德備當知是人不於一佛二佛三四五佛而種善根已於無量千萬佛所種諸善根修戒於過去及種諸善根聞是章句乃至一念生淨信者須菩提如來悉知悉見是諸衆生得如是無量福德戒具於諸佛亦説功德滿何以故是諸衆生無復我相人相衆生相壽者相無法相亦無非法相彼壽者及法遠離於取相亦説知彼相依八八義別差別相續體不斷至命住復趣於異道是我相四種一切空無物實有不可説依言詞而説是法相四種彼人依信心恭敬生實相聞聲不正取正説如是取佛不見果知願智力現見求供養恭敬彼人不能説何以故是諸衆生若心取相即為著我人衆生壽者若取法相即著我人衆生壽者何以故若取非法相則著我人衆生壽者是故不應取法不應取非法以是義故如來常説汝等比丘知我説法如筏喻者法尚應捨何況非法彼不住隨順於法中證智如人捨船筏法中義亦然須菩提於意云何如來得阿耨多羅三藐三菩提耶如來有所説法耶須菩提言如我解佛所説義無有定法名阿耨多羅三藐三菩提亦無有定法如來可説應化非真佛亦非説法者何以故如來所説法皆不可取不可説非法非非法所以者何一切聖賢皆以無為法而有差別説法不二取無説離言相須菩提於意云何若人滿三千大千世界七寶以用布施是人所得福德寧為多不須菩提言甚多世尊何以故是福德即非福德性是故如來説福德多若復有人於此經中受持乃至四句偈等為他人説其福勝彼何以故須菩提一切諸佛及諸佛阿耨多羅三藐三菩提法皆從此經出受持法及説不空於福德福不趣菩提二能趣菩提於實名了因亦為餘生因唯獨諸佛法福成第一體須菩提所謂佛法者即非佛法不可取及説自果不取故須菩提於意云何須陀洹能作是念我得須陀洹果不須菩提言不也世尊何以故須陀洹名為入流而無所入不入色聲香味觸法是名須陀洹須菩提於意云何斯陀含能作是念我得斯陀含果不須菩提言不也世尊何以故斯陀含名一往來而實無往來是名斯陀含須菩提於意云何阿那含能作是念我得阿那含果不須菩提言不也世尊何以故阿那含名為不來而實無不來是故名阿那含須菩提於意云何阿羅漢能作是念我得阿羅漢道不須菩提言不也世尊何以故實無有法名阿羅漢世尊若阿羅漢作是念我得阿羅漢道即為著我人衆生壽者世尊佛説我得無諍三昧人中最為第一是第一離欲阿羅漢世尊我不作是念我是離欲阿羅漢世尊我若作是念我得阿羅漢道世尊則不説須菩提是樂阿蘭那行者以須菩提實無所行而名須菩提是樂阿蘭那行依彼善吉者説離二種障佛告須菩提於意云何如來昔在然燈佛所於法有所得不不也世尊如來在然燈佛所於法實無所得佛於然燈語不取理實智以是真實義成彼無取説須菩提於意云何菩薩莊嚴佛土不不也世尊何以故莊嚴佛土者即非莊嚴是名莊嚴智習唯識通如是取淨土非形第一體非嚴莊嚴意是故須菩提諸菩薩摩訶薩應如是生清淨心不應住色生心不應住聲香味觸法生心應無所住而生其心須菩提譬如有人身如須彌山王於意云何是身為大不須菩提言甚大世尊何以故佛説非身是名大身如山王無取受報亦復然遠離於諸漏及有為法故須菩提如恆河中所有沙數如是沙等恆河於意云何是諸恆河沙寧為多不須菩提言甚多世尊但諸恆河尚多無數何況其沙須菩提我今實言告汝若有善男子善女人以七寶滿爾所恆河沙數三千大千世界以用布施得福多不須菩提言甚多世尊佛告須菩提若善男子善女人於此經中乃至受持四句偈等為他人説而此福德勝前福德説多義差別亦成勝校量後福過於前故重説勝喻復次須菩提隨説是經乃至四句偈等當知此處一切世間天人阿修羅皆應供養如佛塔廟何況有人盡能受持讀誦須菩提當知是人成就最上第一希有之法若是經典所在之處即為有佛若尊重弟子尊重於二處因習證大體爾時須菩提白佛言世尊當何名此經我等云何奉持佛告須菩提是經名為金剛般若波羅蜜以是名字汝當奉持所以者何須菩提佛説般若波羅蜜即非般若波羅蜜是名般若波羅蜜彼因習煩惱此降伏染福苦身勝於彼希有及上義彼智岸難量亦不同餘法堅實解深義勝餘修多羅大因及清淨福中勝福德須菩提於意云何如來有所説法不須菩提白佛言世尊如來無所説須菩提於意云何三千大千世界所有微塵是為多不須菩提言甚多世尊須菩提諸微塵如來説非微塵是名微塵如來説世界非世界是名世界須菩提於意云何可以三十二相見如來不不也世尊不可以三十二相得見如來何以故如來説三十二相即是非相是名三十二相須菩提若有善男子善女人以恆河沙等身命布施若復有人於此經中乃至受持四句偈等為他人説其福甚多能忍於苦行以苦行有善彼福不可量如是最勝義離我及瞋恚實無於苦惱共樂有慈悲如是苦行果為不捨心起修行及堅固為忍波羅蜜爾時須菩提聞説是經深解義趣涕淚悲泣而白佛言希有世尊佛説如是甚深經典我從昔來所得慧眼未曾得聞如是之經世尊若復有人得聞是經信心清淨即生實相當知是人成就第一希有功德世尊是實相者即是非相是故如來説名實相世尊我今得聞如是經典信解受持不足為難若當來世後五百歲其有衆生得聞是經信解受持是人即為第一希有何以故此人無我相無人相無衆生相無壽者相所以者何我相即是非相人相衆生相壽者相即是非相何以故離一切諸相即名諸佛佛告須菩提如是如是若復有人得聞是經不驚不怖不畏當知是人甚為希有何以故須菩提如來説第一波羅蜜即非第一波羅蜜是名第一波羅蜜須菩提忍辱波羅蜜如來説非忍辱波羅蜜是名忍辱波羅蜜何以故須菩提如我昔為歌利王割截身體我於爾時無我相無人相無衆生相無壽者相何以故我於往昔節節支解時若有我相人相衆生相壽者相應生瞋恨須菩提又念過去於五百世作忍辱仙人於爾所世無我相無人相無衆生相無壽者相習彼能學心是故須菩提菩薩應離一切相發阿耨多羅三藐三菩提心不應住色生心不應住聲香味觸法生心應生無所住心若心有住即為非住是故佛説菩薩心不應住色布施須菩提菩薩為利益一切衆生故應如是布施如來説一切諸相即是非相又説一切衆生即非衆生修行利衆生如是故當識衆生及事相遠離亦應知假名及陰事如來離彼相諸佛無彼二以見實法故果雖不住道而道能為因須菩提如來是真語者實語者如語者不誑語者不異語者須菩提如來所得法此法無實無虗以諸佛實語彼智有四種實智及小乘説摩訶衍法及一切受記以不虗説故隨順彼實智説不實不虗如聞聲取證對治如是説須菩提若菩薩心住於法而行布施如人入暗即無所見若菩薩心不住法而行布施如人有目日光明照見種種色時及處實有而不得真如無智以住法餘者有智得暗如愚無智明者如有智對法及對治得滅法如是於何法修行得何等福德復成就何業如是説修行須菩提當來之世若有善男子善女人能於此經受持讀誦即為如來以佛智慧悉知是人悉見是人皆得成就無量無邊功德須菩提若有善男子善女人初日分以恆河沙等身布施中日分復以恆河沙等身布施後日分亦以恆河沙等身布施如是無量百千萬億劫以身布施若復有人聞此經典信心不逆其福勝彼何況書寫受持讀誦為人解説名字三種法受持聞廣説修從他及內得聞是修智此為自淳熟餘者化衆生以事及時大福中勝福德須菩提以要言之是經有不可思議不可稱量無邊功德如來為發大乘者説為發最上乘者説若有人能受持讀誦廣為人説如來悉知是人悉見是人皆得成就不可量不可稱無有邊不可思議功德如是人等即為荷擔如來阿耨多羅三藐三菩提何以故須菩提若樂小法者著我見人見衆生見壽者見即於此經不能聽受讀誦為人解説須菩提在在處處若有此經一切世間天人阿修羅所應供養當知此處即為是塔皆應恭敬作禮圍繞以諸華香而散其處復次須菩提若善男子善女人受持讀誦此經若為人輕賤是人先世罪業應墮惡道以今世人輕賤故先世罪業即為銷滅當得阿耨多羅三藐三菩提非餘者境界唯依大人説及希聞信法滿足無上界受持真妙法尊重身得福及遠離諸障復能速證法須菩提我念過去無量阿僧祗劫於然燈佛前得值八百四千萬億那由他諸佛悉皆供養承事無空過者若復有人於後末世能受持讀誦此經所得功德於我所供養諸佛功德百分不及一千萬億分乃至算數譬喻所不能及須菩提若善男子善女人於後末世有受持讀誦此經所得功德我若具説者或有人聞心即狂亂狐疑不信須菩提當知是經義不可思議果報亦不可思議成種種勢力得大妙果報如是等勝業於法修行知爾時須菩提白佛言世尊善男子善女人發阿耨多羅三藐三菩提心云何應住云何降伏其心佛告須菩提善男子善女人發阿耨多羅三藐三菩提心者當生如是心我應滅度一切衆生滅度一切衆生已而無有一衆生實滅度者何以故須菩提若菩薩有我相人相衆生相壽者相即非菩薩所以者何須菩提實無有法發阿耨多羅三藐三菩提心者於內心修行存我為菩薩此則障於心違於不住道須菩提於意云何如來於然燈佛所有法得阿耨多羅三藐三菩提不不也世尊如我解佛所説義佛於然燈佛所無有法得阿耨多羅三藐三菩提佛言如是如是須菩提實無有法如來得阿耨多羅三藐三菩提須菩提若有法如來得阿耨多羅三藐三菩提者然燈佛即不與我授記汝於來世當得作佛號釋迦牟尼以實無有法得阿耨多羅三藐三菩提是故然燈佛與我授記作是言汝於來世當得作佛號釋迦牟尼何以故如來者即諸法如義若有人言如來得阿耨多羅三藐三菩提須菩提實無有法佛得阿耨多羅三藐三菩提須菩提如來所得阿耨多羅三藐三菩提於是中無實無虗是故如來説一切法皆是佛法須菩提所言一切法者即非一切法是故名一切法以後時授記然燈行非上菩提彼行等非實有為相彼即非相相以不虗妄説是法諸佛法一切自體相須菩提譬如人身長大須菩提言世尊如來説人身長大即為非大身是名大身依彼法身佛故説大身喻身離一切障及遍一切境功德及大體故即説大身非身即是身是故説大身須菩提菩薩亦如是若作是言我當滅度無量衆生即不名菩薩何以故須菩提實無有法名為菩薩是故佛説一切法無我無人無衆生無壽者須菩提若菩薩作是言我當莊嚴佛土是不名菩薩何以故如來説莊嚴佛土者即非莊嚴是名莊嚴須菩提若菩薩通達無我法者如來説名真是菩薩不達真法界起度衆生意及清淨國土生心即是倒衆生及菩薩知諸法無我非聖自智信及聖以有智須菩提於意云何如來有肉眼不如是世尊如來有肉眼須菩提於意云何如來有天眼不如是世尊如來有天眼須菩提於意云何如來有慧眼不如是世尊如來有慧眼須菩提於意云何如來有法眼不如是世尊如來有法眼須菩提於意云何如來有佛眼不如是世尊如來有佛眼雖不見諸法非無了境眼諸佛無種實以見彼顛倒須菩提於意云何如恆河中所有沙佛説是沙不如是世尊如來説是沙須菩提於意云何如一恆河中所有沙有如是沙等恆河是諸恆河所有沙數佛世界如是寧為多不甚多世尊佛告須菩提爾所國土中所有衆生若干種心如來悉知何以故如來説諸心皆為非心是名為心所以者何須菩提過去心不可得現在心不可得未來心不可得種種顛倒識以離於實念不住彼實智是故説顛倒須菩提於意云何若有人滿三千大千世界七寶以用布施是人以是因緣得福多不如是世尊此人以是因緣得福甚多須菩提若福德有實如來不説得福德多以福德無故如來説得福德多佛智慧根本非顛倒功德以是福德相故重説譬喻須菩提於意云何佛可以具足色身見不不也世尊如來不應以具足色身見何以故如來説具足色身即非具足色身是名具足色身須菩提於意云何如來可以具足諸相見不不也世尊如來不應以具足諸相見何以故如來説諸相具足即非具足是名諸相具足法身畢竟體非彼相好身以非相成就非彼法身故不離於法身彼二非不佛故重説成就亦無二及有須菩提汝勿謂如來作是念我當有所説法莫作是念何以故若人言如來有所説法即為謗佛不能解我所説故須菩提説法者無法可説是名説法如佛法亦然所説二差別不離於法界説法無自相爾時慧命須菩提白佛言世尊頗有衆生於未來世聞説是法生信心不佛言須菩提彼非衆生非不衆生何以故須菩提衆生衆生者如來説非衆生是名衆生所説説者深非無能信者非衆生衆生非聖非不聖須菩提白佛言世尊佛得阿耨多羅三藐三菩提為無所得耶佛言如是如是須菩提我於阿耨多羅三藐三菩提乃至無有少法可得是名阿耨多羅三藐三菩提彼處無少法知菩提無上復次須菩提是法平等無有高下是名阿耨多羅三藐三菩提以無我無人無衆生無壽者修一切善法即得阿耨多羅三藐三菩提須菩提所言善法者如來説即非善法是名善法法界不增減淨平等自相有無上方便及離及漏法是故非淨法即是清淨法須菩提若三千大千世界中所有諸須彌山王如是等七寶聚有人持用布施若人以此般若波羅蜜經乃至四句偈等受持讀誦為他人説於前福德百分不及一百千萬億分乃至算數譬喻所不能及雖言無記法而説是彼因是故一法寶勝無量珍寶數力無似勝無似因亦然一切世間法不可得為喻須菩提於意云何汝等勿謂如來作是念我當度衆生須菩提莫作是念何以故實無有衆生如來度者若有衆生如來度者如來即有我人衆生壽者須菩提如來説有我者即非有我而凡夫之人以為有我須菩提凡夫者如來説即非凡夫是名凡夫平等真法界佛不度衆生以名共彼陰不離於法界取我度為過以取彼法是取度衆生故不取彼應知須菩提於意云何可以三十二相觀如來不須菩提言如是如是以三十二相觀如來佛言須菩提若以三十二相觀如來者轉輪聖王即是如來須菩提白佛言世尊如我解佛所説義不應以三十二相觀如來爾時世尊而説偈言若以色見我以音聲求我是人行邪道不能見如來非是色身相可比諸如來諸佛唯法身轉輪王非佛非相好果報依福德成就而得真法身方便異相故唯見色聞聲是人不知佛以真如法身作是識境故須菩提汝若作是念如來不以具足相故得阿耨多羅三藐三菩提須菩提莫作是念如來不以具足相故得阿耨多羅三藐三菩提須菩提汝若作是念發阿耨多羅三藐三菩提心者説諸法斷滅莫作是念何以故發阿耨多羅三藐三菩提心者於法不説斷滅相不失功德因及彼勝果報須菩提若菩薩以滿恆河沙等世界七寶持用布施若復有人知一切法無我得成於忍此菩薩勝前菩薩所得功德何以故須菩提以諸菩薩不受福德故須菩提白佛言世尊云何菩薩不受福德須菩提菩薩所作福德不應貪著是故説不受福德得勝忍不失以得無垢果示勝福德相是故説譬喻是福德無報如是受不取是福德應報為化諸衆生自然如是業諸佛現十方須菩提若有人言如來若來若去若坐若臥是人不解我所説義何以故如來者無所從來亦無所去故名如來去來化身佛如來常不動於是法界處非一亦非異須菩提若善男子善女人以三千大千世界碎為微塵於意云何是微塵衆寧為多不須菩提言甚多世尊何以故若是微塵衆實有者佛即不説是微塵衆所以者何佛説微塵衆即非微塵衆是名微塵衆世界作微塵此喻示彼義微塵碎為末示現煩惱盡世尊如來所説三千大千世界即非世界是名世界何以故若世界實有者即是一合相如來説一合相即非一合相是名一合相須菩提一合相者即是不可説但凡夫之人貪著其事非聚集故集非唯是一喻聚集處非彼非是差別喻但隨於音聲凡夫取顛倒非無二得道遠離於我法須菩提若人言佛説我見人見衆生見壽者見須菩提於意云何是人解我所説義不不也世尊是人不解如來所説義何以故世尊説我見人見衆生見壽者見即非我見人見衆生見壽者見是名我見人見衆生見壽者見見我即不見無實虗妄見此是微細障見真如遠離須菩提發阿耨多羅三藐三菩提心者於一切法應如是知如是見如是信解不生法相須菩提所言法相者如來説即非法相是名法相二智及三昧如是得遠離須菩提若有人以滿無量阿僧祗世界七寶持用布施若有善男子善女人發菩提心者持於此經乃至四句偈等受持讀誦為人演説其福勝彼云何為人演説不取於相如如不動化身示現福非無無盡福諸佛説法時不言是化身以不如是説是故彼説正非有為非離諸如來涅槃何以故一切有為法如夢幻泡影如露亦如電應作如是觀九種有為法妙智正觀故見相及於識器身受用事過去現在法亦觀未來世觀相及受用觀於三世事於有為法中得無垢自在佛説是經已長老須菩提及諸比丘比丘尼優婆塞優婆夷一切世間天人阿修羅聞佛所説皆大歡喜信受奉行金剛般若經偈會本終金剛新眼疏經偈合釋通敘大意真空不空妙有不有妙有不有有而性常自空真空不空空而性常自有遮照無礙存泯自由不可得而思議者其惟實相歟因而有空緣空而有緣空而有回萌蘖於焦芽因有而空挽狂惡於醉象聖凡俱益大小同軌亦不可得而思議者其惟金剛般若經歟故我正覺肇彼祗園當食時而入城情忘精舍乞食已而還處念絶人寰是固以無所住心隨緣而安住也至若食訖收緣洗足敷座一念不動諸法皆空是又以無所動心自然而降伏也如是則降心住心之旨已昭然於敘分中矣正宗分中諸家異判或依無著分住或依天親斷疑或依梁昭明逐分銷釋或依功德施因著立破同中有異異中有同苟能得意忘言無煩説非道是然羣盲摸象不妨隨摸異説三獸渡河亦許緣渡自知今依本經次第淺深分為四分第一略明降住生信分第二推廣降住開解分第三究竟降住起修分第四決定降住成證分第一分中首自須菩提見佛舉止驗佛威儀在在無非護念時時咸彰付囑極口稱讚為衆表揚第恐妄擬聖境反招畫鵠之譏為憐初步敬陳住降之請於是世尊重讚善哉深印其説是猶欲其於著衣持鉢去來行坐時薦取世尊護念付囑意耳其奈出廄良駒已搖鞭影傳經沉疾須設治方故世尊誡聽許説而當機唯然承旨也夫菩薩以二利得名降住從悲施入手悲則能所雙寂滅度一切衆生而無度相施則內外俱空遍行一切檀度而無住心無住心則覺心可住無度相則妄心可降降心住心略明如是第以布施一法通乎上下恐謂下濟衆生可以不住生相上供諸佛豈可不住佛相故問以可以身相見如來不空生因問得悟如來進示提持不惟應化非真乃至果報身相亦不應住以凡所有相皆是虗妄故也然義意既漸入深微而章句亦倍增玄妙於是問答激揚啓發淨信展轉徵釋結示增修至云知我説法如筏喻者則如來為衆解粘去縛之意已深切矣然既遣之又遣不合有得有説為防斯疑故爾致問當機答以得無定得説無定説則二乘隨法生取之堅執已搖動矣法執既破淨信斯生因為校量持福以終一章之義也第二推廣降住開解分中初約小乘因果以明降心者為其無我也無我則無念無念則有相皆離心無可降是真降心次約大乘因果以明住心者為其無法也無法則無執無執則是法不住覺元不昧是真住心自是校況持福請名奉持為義略周而又進示説法無説塵界非界化相非相者蓋為淨除餘疑開廣知見所以四句功德雖恆沙身命布施未足為校焉緣茲當機深解感悟涕泣歎信解功德第一希有驗當來有斯倍更為難以能離一切相即名諸佛故耳如來欲令聞讚發心見賢思齊故以如是如是而印許之復以不驚不怖不畏者而證成之其次又以般若非般若例明忍辱非忍辱佛意蓋以六度萬行一切俱非故總結之曰菩薩應離一切相發心不應住色等生心應生無所住心也前此教以不住色等布施者亦斯意耳欲遮深疑具示五語為助妙解雙陳兩喻良以有住行施則永沈長夜故以如人入暗喻之無住行施則徑達彼岸故以如人有目喻之然此推廣分中少示降心多示住心者以覺心如主妄心如客但使覺心安住自令妄心不興亦如主人若悟客邪不得其便也至此顯示經功生福與滅罪齊驅校量持福供佛兼承事莫及總以是經義不可思議果報亦不可思議但辦肯心必不相賺解分極旨盡於是矣第三究竟降住起修分中重舉發菩提心者謂信解之後發起修習菩提心也雖蒙開示已解降住之宗未歷真修莫究降住之實故重問云何應住云何降伏其意蓋欲究竟所解以造其實耳答降心中而有略明詳示二義略明中教以如前所解而究竟之故仍約度生無度顯久行即修故詳示之中復分為四第一得記離相第二感報離相第三修因離相第四知見離相第一得記離相雖事在然燈與前解分中取意不同前為遣所授法以明無住故問其於法有所得不此為遣能受法以示降伏故問以有法得菩提不答以無法印以無法者以有法則不契真如佛不與記無法乃適符如義佛始與記蓋以如來者即諸法中如如不動義也是知如來於菩提樹下得成菩提亦緣實無有法雖曰實無有法亦非一向永寂故進示以所得菩提無實無虗無實故説有不有説空不空故無妨如來説一切法無虗故説有不有為妙有説空不空為真空為欲顯示真空妙有故無妨説皆是佛法恐猶未了仍復申明故曰一切法非一切法名一切法此又如來於正説降心法中兼示中道第一義耳第二感報離相者謂法身性具可説無得報體修成寧與同倫為防斯疑故重拈解分中身如須彌山王之喻而云譬如人身長大此當機先所已悟故才聞舉處便劈空欄住而自釋也第三修因離相中先約度生遣相言菩薩亦如是者謂菩薩非菩薩亦如大身非大身是也是知彼若起心作言我當度生則是以菩薩自負却非真實菩薩以彼若知實無有法乃可名為菩薩彼既作言自負故斥以不名也至云是故佛説等者乃承引如來已向所説皆為顯示二無我理以證成之次約嚴土遣相中不名菩薩準上可知以彼若於嚴土之時通達無我無法者乃許其為真是菩薩以有二空之智決定成佛故第四知見離相中既一佛而通具五眼則是本惟一見隨緣而成五見其猶開池引月因池之異而説月之異若決堤通水則又以池之一而説月之一應知異固非異一亦非一以月例見見豈有定相哉既一知而悉知衆心義似有體其奈衆心虗妄三際叵得是雖知而本無所知知豈有實相哉據此則佛知佛見尚無定實況夫未到佛地妄知妄見固知其為徹體虗妄不待降伏矣答住心中亦有略明詳示二義略明中滿界寶施其福似多而如來問心多不者良以行布施時有住相不住之異住相則福德有實不可言多以有漏故不住則福德無故可説為多以無漏故然此修分之中略明降心仍約度生無度略明住心仍約布施無住者為顯行解相應所謂如是而解如是而修如目與足如是而見如是而行也詳示之中亦分為四一見佛無住二聞法無住三得果無住四修因無住第一見佛無住義似復前而有二意不同一兼正不同二化報不同兼正不同者以信分中明不可以身相見如來而解分中明不可以三十二相見如來其意皆是兼為釋疑非正示降住之文今則正示住心此兼正不同也化報不同者謂前二説身説相初無具足之言次有四八之數明知其為應化之身今身相皆以具足見稱者應指實報之身蓋必萬德莊嚴方稱具足以具足即圓滿義也而又言非具足者以既屬因感即是緣起緣起無性豈真具足意顯其不應住耳第二聞法無住中先明説者無住言如來雖已隨機説法皆以無緣而應實不預為作念我今當為説何等法是雖終日説法而實無所住矣次明聞者無住而言彼非衆生者以既信無住即名無佛故又云非不衆生者以雖名為佛但是理具故徵釋中言既非衆生而又名為衆生者謂佛以能信即佛説非解修未極説是也第三得果無住者準前信分云無有定法名阿耨菩提解分亦云實無有法得阿耨菩提是當機之所已知而今復以所得菩提為無所得為問者蓋為印證前語以便觀察修習故也如來印證而云無少法可得者以還復舊時性無有一法新故第四修因無住中而云是法平等無有高下者乃申明上文無少法可得之意以引生下文無我修善得菩提義也意謂是法平等無有高下而現見生佛判然者以凡夫有我不得正覺二乘不修失於正等菩薩修而不具未及無上佛以無我異凡夫之不覺名曰正覺佛以修善異二乘之偏枯名曰正等佛以具修一切善法異菩薩之有上名曰無上故云即得阿耨等也恐聞善法二字又起有法之疑故又以即非是名遣之修分之旨至此已極因為校量持福以發行人勝進之意焉第四決定降住成證分中乃有三義一降心離相二住心無住三結歸問意初中略明降心亦約度生無度而與前文逈異謂前約菩薩未得決定是勉而行之此約佛地已得決定是安而行之也詳示降心復有二義一觀相離相二離相亦離觀相離相中問雖同於解分而所為不同謂前為防疑此為破見蓋當機歷承開示相似心空未免欲立心空之見觀其答處頓改前轍其意以但自無心則見色非干色一切色是佛色矣佛既不斥其非未全非也但恐其相似心空未得決定故以輪王三十二相而勘驗之當機果是腳跟不穩而云不應以三十二相觀如來所謂依悕似曲才堪聽又被風吹別調中也佛既不印其是未全是耳又恐其前無新證退失故居歷覽二際自生艱險故惟説偈以示離色離聲且授之以把穩生涯也離相亦離者以上示離相乃為遣取相之執若更起離相之執何異從冥入冥故文中兩誠莫作是念蓋恐其以盲引盲致令一類發菩提心者説諸法斷滅成焦芽敗種墮一闡提佛亦難救所謂寧使著有如須彌山不使著空如芥子許也略明住心中亦以不住施福為言然與前有異以前文但顯不住福多啓發修習之心此中的指得忍菩薩決定不受福德有志決定者亦知取法可爾詳示住心中亦有二義一正報無住二依報無住正報無住者謂如來內證不變之體外現隨緣之用來去坐臥一味隨緣故曰如來者無所從來亦無所去故名如來是知如來正報尚不應住降斯已還豈應有所住乎次明依報無住者謂界既可析塵又可合則塵界俱非實有但凡夫之人貪著其事而入理菩薩宜應無所住矣又上文詳示降心中佛以一切諸見束為斷常二見二見不生一切皆盡是為決定降伏此中乃以一切諸法束為依正二報二報不住一切俱空是為決定安住結歸問意者準前兩番請問皆以住心在前降心在後兩番開示皆以住心在後降心在前其意以妄心久熾覺心乍興乍興則力微久熾則功著功著則降不容緩故在前力微則住不宜速故在後今當開示已竟亦先結降心後結住心結降心者以前兩答降心皆令度生無我且言若菩薩有我人等相即非菩薩恐謂説由心生如來既説人有我等相見則是如來心中先有我等相見為防斯疑故曰若人言佛説我見人見衆生見壽者見乃至云是人不解如來所説義以如來説我非我是名為我既所説尚惟是名能説心中豈先有我等相見如谷答嚮元無作者此約決定無我以結至云於一切法應如是知如是見等者由前歷示降心之法今其應於一切降心法中如是由知而見由信而解信解之後漸次究竟以至決定降伏則并前所説降心之法心中亦復不生此約決定無法以結然此心中我等相見及於法相俱屬微細深惑此既不有尚有何妄故此結歸應前云何降心問也結住心中而言滿無量僧祗世界寶施不及持説此經者以不得此經不成無住行故又恐謂受持無住易演説無住難故徵其云何為人演説而示以不取於相良以一切有為總如夢事眠時似有寤時實無況夫色陰如幻無而忽有受陰如泡虗而無實想陰如影托外物現行陰如露乘夜氣生識陰如電假明暫發一一皆是無常法法總歸滅盡作如是觀自然不取於相如如不動此約決定無住應前云何應住問也流通中當機全身擔荷餘衆隨分受益三草二木各得增長故云皆大歡喜謂喜其成佛有分非常喜也信謂忍其教受謂領其理奉則遵教循理行則自行化他夫如是則慧水常流法脈永通盡塵劫而不滯利萬彚而無遺矣理也無知謬承師印向雖歷參多席曾未得聞是經既在持誦之餘用心研究又於講演之際加意尋討將陳斯疏尚冀資成澄觀補處之偈妙契大聖之心依經求偈偈得經而詞暢藉偈通經經因偈而義明緣茲合釋用此濟美未善兩論不敢強同仍以乍異舊説恐泥先聞故總以新眼名之賜覽者願少留意歸命本尊佛演説微妙空解空第一者常隨衆聖賢願以大威神祐我成斯疏隨喜并見聞承此開新眼金剛新眼疏經偈合釋懸示京西山敕建香界寺傳講沙門通理謹述將釋此經預建章門夫雜華嚴飾為諸經中王賢首清涼乃一家之祖十門通經萬世標準雖依法隨人開合不定而忘言得意會理無殊故今解釋此經略變其式而為六門一翻譯前後二宣説時處三教乘攝屬四因緣所為五受持感通六釋題解文第一翻譯前後者以經是佛説文屬梵言翻梵成夏必得其人出譯憑時乃堪取信此經前後翻譯閲有六師一姚秦鳩摩羅什譯姚秦譯經時也後秦姚氏建都長安為別前秦符氏故稱姚秦鳩摩羅什譯主名也具云鳩摩羅什婆此翻童壽以童年有耆德故開元釋教録云一名鳩摩羅耆婆者外國製名多以父母為本什父鳩摩羅炎母字耆婆故兼取為名祖居印土家世相國其父以聰敏見稱避位出家遊學龜茲龜茲王聞以女逼而妻之乃生於什什處胎日母增慧辨如舍利弗處胎相類什生母即出家得證初果什年七歲亦俱出家從師受經日誦千偈九歲隨母到罽賓依名德法師槃頭達多習小乘經論十二歲其母攜還至月氏北山有羅漢見而異之謂其母曰此子當善守之如過三十五不毀戒度人不減毱多若破戒者止可為才明俊藝法師而已又到沙勒國見佛鉢遂頂戴之俄念鉢重即不能勝失聲下之母問其故即以唯心之義答之及還龜茲名蓋諸國至於四圍五明諸論陰陽星算等術莫不窮微盡奧後從卑摩羅叉學十誦律又從須利耶蘇摩咨稟大乘乃知從前學小之非於是傳習大乘廣求要義有頃什母預知龜茲運衰辭往天竺進證三果臨行謂什曰方等深教當闡秦都但於自身少有不利奈何什曰菩薩之行利物亡軀果其大化得行雖當爐鑊無恨乃留住龜茲止王新寺後又到罽賓為其師槃頭達多具説一乘妙義達多感悟反禮什為大乘師焉自是道播西乾聲流東震當此土前秦符堅建元九年異星現於西域分野太史奏曰當有大德智人入輔中國堅曰朕聞龜茲有羅什襄陽有道安得非此二人耶於是先致道安後遣驍騎將軍呂光率兵七萬伐龜茲致什至西涼光聞符堅為姚萇所弒乃自據涼土即三河王位什亦留止萇即位亦聞師名屢請呂光不允萇卒子興立復請不允光卒子隆立姚興伐涼請什至長安待以國師之禮當弘始三年時也因見舊譯經論率多不與梵本相應乃集沙門八百餘人新譯經論九十八部凡三百九十餘卷所譯此經名金剛般若波羅蜜什臨滅集衆謂曰自以暗昧謬充翻譯若所傳無謬當使焚身之後舌根不壞後果如之是知師舌與如來廣長舌相等無有異所以此經六譯而時所宗尚皆弘秦本今疏依之細尋什師行狀自古紀載不同愚先注法華指掌但據大成今見譯經圖紀及釋教録所載不惟與大成不符即二書亦遞相齟齬至於金剛蒙引所載益難考稽是疏且約圖紀教録斟酌去取恐有未妥故述此以俟博覽者教之二元魏菩提留支譯後魏元氏初都恆安南遷洛陽後遷鄴凡十三帝一百五十五年為別前魏曹氏故稱元魏菩提留支此云覺希北印土人也遍通三藏妙入總持志在弘法廣流視聽以魏永平之歲至止洛京宣武下敕殷勤敬勞處之永寧大寺供待甚豐七百梵僧並皆周給敕留支為譯匠創翻十地論厥初命章宣武親自筆受然後方付沙門僧辨等訖盡論文佛法隆盛英俊蔚然相從傳授孜孜如也自是翻譯不輟至永熙三年洛京遷於漳鄴留支亦至鄴翻譯前後近三十年始從洛陽宣武帝永平元年終至鄴都孝靖帝天平二年所出經論共三十九部一百二十七卷所譯此經名同秦本經有五種不同一起問不同以魏本有四問一問云何發心二問應云何住三問云何修行四問云何降心秦本則合問發於問住該問修於問降蓋以能住便能發能降乃能修故二有無不同以魏本於後半卷內有爾時慧命須菩提乃至云衆生衆生者如來説非衆生是名衆生一段秦本原無乃後人依襄陽石刻補入蓋什師譯漏也三答問不同以秦本後半卷內有佛問須菩提可以三十二相觀如來不而須菩提答以如是如是以三十二相觀如來至魏本則答以不以相見蓋留師秪知隨順前文不知空生前後見異雖後之四譯皆爾而本疏以秦本為是四詳略不同此有二處一魏本偈云若以色見我以音聲求我乃至云法體不可見彼識不能知共有八句秦本唯取前四句以八句中前四句反顯後四句正明餘四譯皆倣魏本什師以反顯足明故略後義二秦本偈云一切有為法如夢幻泡影如露亦如電應作如是觀唯有六喻魏本則有九喻餘之四本亦倣魏譯什師以六喻雖略約義可攝諸法九喻雖詳約義亦不出此且四句難收故不盡取五立分不立分不同以魏本分此經為十二分前後五譯皆不立分今秦本三十二分乃梁昭明立此五之外仍有小異者義則大同不具述三陳朝真諦譯陳氏蒞朝都建業始自武帝永定元年終至後主禎明三年凡五主共三十三年譯經緇素三人真諦其一焉梵名波羅末陀本西印土優禪尼國人婆羅門種姓頗羅墮景行澄明器宇清肅風神爽拔悠然自遠羣藏廣部罔不厝懷志在弘通隨方利物於梁武帝太清二年屆都邑武帝面伸禮敬安置於寶雲殿自是傳翻經教不羡奏時更出新文有逾齊日無何梁季崩亂所懷不果雖復翻譯栖遑靡託逮陳武帝永定二年乃還返豫章又上臨川晉安諸郡雖傳經論道缺情離遂欲泛舶往楞伽修國道俗虔請結誓留之權停南越至文帝天嘉四年楊都建元寺僧宗法淮僧忍等遠浮江表親承訪問諦欣其來意為翻攝大乘等論首尾兩載又至梁安郡欲返西國為太守王萬賖所請暫留海隅後以泛舶西引遇風瓢還廣州適逢刺史歐陽穆公頠延住制止寺請翻新文諦顧此業緣西還無指乃對沙門慧愷等翻廣義法門經及唯識論等後穆公薨世子紇重為檀越相續翻譯按諦於梁代所出經論總十一部梁末入陳復出三十八部其所譯此經名亦同於秦本經有四種不同一起問不同以秦本唯二問一問云何應住二問云何降心陳本則有三問一問發菩提心行菩薩乘云何應住二問云何修行三問云何發起菩薩心淮餘本皆末問降心或真諦誤釋降心為發心耳二有無不同此有二處一秦本前半卷內於我從昔來所得慧眼未曾得聞如是之經下別無徵釋之文陳本則加何以故世尊説般若波羅蜜即非般若波羅蜜故説般若波羅蜜三句魏本唯有前二句餘本全無疑是衍文二同魏本此有無不同也第三答問不同此亦二處一同魏本二者秦本於若以色見我之偈後直接須菩提汝若作是念如來不以具足相得菩提一段中無別文陳本則加須菩提於意云何如來可以具足相得菩提不乃至云如來不以具足相得菩提一段蓋如來前説色見聲求不得恐執此又墮斷見故急掃之云汝若作是念等疑是真諦不論此義強為聯合置此一段仍依什譯為是第四詳略不同亦同魏本此外小異大同不悉四隋朝笈多譯隋國號楊氏御極之稱也始於文帝終於煬帝二主共三十七年文帝姓楊名堅弘農華陰縣人其父楊忠仕北周有功封隋國公忠卒堅襲爵後繼周即位建都長安國號大隋故稱隋朝笈多略稱也具云達摩笈多此翻法密南天竺羅囉國人剎帝利種姓虎氏年二十三歲往中天竺耳出城黃華色伽藍出家二十五歲方受具戒受具之後遍歷西域大小乘國廣見博聞藝業內充後於迦臂施國遇北路商人聞説大支那國三寶興盛遂結契來遊跋涉積年更歷諸國隨所至處不斷講説於開皇十年來屆瓜州初契同徒或留或沒獨顧單影悲喜交集尋蒙帝旨延入京師處之名寺供給豐沃初與崛多共參備譯逮仁壽之末崛多以緣他事流擯東越自是專主傳譯及煬帝定鼎東都敬重彌隆敕於洛水南濵上林園內置翻經館始從大業初年終於大業末歲譯大方等善住意等經金剛般若等論共九部計四十六卷並文義澄潔華質顯暢今詳釋教録九部內無此經名唯彥琮笈多傳云初笈多翻金剛斷割般若波羅蜜經一卷及普樂經十五卷未及練覆值偽鄭淪廢不暇重修據此乃是後人搜訪傳流因斷割過質故以能斷易之目曰金剛能斷般若波羅蜜經譯對梵文語多倒詞意雖不乖佛旨習乃有背時機句且難尋義應莫曉蓋即彥琮所謂未及練覆不暇重修之故然以餘本求之亦皆小異大同存之在藏為備參考倘餘本有疑未決亦可取之旁通厥功不泯略此述成五唐玄奘法師譯大唐李氏都長安自高祖武德元年至開元十八年兼天后代凡一百一十三載譯經緇素三十七人唯玄奘為最玄奘本名褘俗姓陳氏陳留人也漢太邱長陳仲弓之後曾祖欽後魏上黨太守祖康北齊國子博士食邑周南子孫因家又為緱氏縣人也父惠英潔有雅操隋大業中拜江陵令解纓而返有四男奘最小其次兄長捷先出家住東都淨土寺以奘少罹窮酷攜以獎之十一歲得度出家其後隋氏失御天下沸騰昆季相攜屆於京邑住莊嚴寺洎唐武德元年國基草創兵甲尚興京城未有講肆又從兄入蜀歷席聽講年滿二十即於成都受具自後遍參諸方咸罄其旨乃自惟曰余周流吳蜀爰逮趙魏未及周秦遇有講筵率皆登踐雖已布之言蘊積胸襟而未吐之詞解籤無地若不輕生徇命誓往華胥焉能具覿成言用通神解於是於貞觀三年奮志西征遠歷多國誠重勞輕履險若夷既達印土無倦咨籌師承戒賢論制惡見印土學人咸仰盛德討論一十七周遊覽百有餘國當此土貞觀十九年正月二十四日還屆京師見帝於洛陽宮談敘真俗無爽帝旨帝曰自師行後朕奉為穆太后於西京造弘福寺將來梵本可就翻譯既承明命遂返西京廣集碩學名德沙門靈潤等五十餘人即於是年五月開演梵文翻譯大菩薩藏等經論自是翻譯無輟訖於麟德元年總出大小乘經律論等七十五部一千三百三十五卷所譯此經名能斷金剛般若波羅蜜與秦本起問相似一問云何應住二問云何修行三問云何攝心蓋攝之與降皆治伏義但多中間一問又秦本唯説四相此説八想謂有情想命者想士夫想補特伽羅想意生想摩納婆想作者想受者想蓋相即所想但四八開合稍異又秦本言如來者即諸法如義而此言如來者即是真實真如增語即是無生法性增語即是永斷道路增語即是畢竟不生增語其與秦本答問不同亦同魏本而色見聲求偈亦八句偈後加文亦與陳本小異後偈九喻亦同魏本餘皆大同秦本但浮演之文過多似未若什本直捷令人樂讀耳六唐義淨法師譯義淨齊州人俗姓張字文明齠齔之年辭親出家遍詢名匠廣探羣籍仰法顯之雅操慕玄奘之高風有志西遊未能諧願暨登具之後誓期必往於是於咸亨二年三十有七歲初結同志數滿十人洎乎泛舶餘皆退罷唯淨堅心奮志孤行備歷艱險漸達印土所至之境皆洞言音凡遇王臣咸蒙禮重鷲峯雞足鹿苑祇園佛境靈迹皆親瞻仰憩那爛陀禮菩提樹凡所遊歷三十餘國往來問道出二十年於天后證聖之元乙未仲夏還至河洛將梵本經律論近四百部并金剛座真容一鋪舍利三百粒天后敬法重人親迎於上東門外洛陽緇素備設幢幡兼陳鼓樂在前導引敕於佛授記寺安置所將梵本并令翻譯初共于闐三藏實義難陀譯華嚴經久視已後方自翻譯權輿於天后久視元年庚子投筆於睿宗景雲二年辛亥歷福先寺西明寺薦福寺等處總出經律論五十六部凡二百三十卷所譯此經名同奘本起問處亦同其與秦本不同者秦本於若是經典所在之處即為有佛若尊重弟子下別有請名奉持一段魏陳隋奘四本大略皆同此本則直接説法無説塵界非界現相非相等文而乃將請名奉持移於聞經悲泣歎昔未聞之下其意蓋以説經未久不合突然請名必是空生自歎從昔未聞是經因知非常故爾請問雖似有理但與五譯相違恐是臆見非佛本旨又秦本於色見聲求偈後恐其立斷滅見故誡以莫作是念如來不以具足相得菩提以若作是念恐令發菩提心者説諸法斷滅承上接下似為得理而魏陳隋奘四本雖各添餘文亦大同小異至此本則直問發趣菩薩乘者其所有法是斷滅不既與什譯不符視餘本亦似有缺其餘文義大同奘本而刪去浮詞尤得什師之妙翻譯前後竟第二宣説時處者以如來法不浪施因機而説機有生熟説有前後是故一代聖教説分三時第一日出先照時為圓頓大根衆生轉無上根本法輪名為直顯教令彼同教一乘人等轉同成別譬如日出先照須彌山等諸大高山其所説經即是華嚴梵網等也第二日升轉照時先總後別總者此轉照時為下中上三類衆生轉依本起末法輪名為方便教令彼三乘人等轉三成一譬如山地有高下故照有先後別者於此一時中復分三轉謂初轉中轉後轉也初轉時者謂佛初於鹿苑為鈍根下類衆生轉小乘法輪名為隱實教令彼凡夫外道轉凡成聖譬如日升轉照黑山其所説經即是提胃阿含等也中轉時者謂佛次於中時為中根一類衆生轉三乘法輪名為引攝教令彼二乘人等轉小成大譬如日升次照高原其所説經即是深密方廣等也後轉時者謂佛次於後時為利根上類衆生轉大乘法輪名為融通教令彼權教三乘轉權成實譬如日升然後普照一切大地其所説經即是妙智般若等也第三日沒還照時為上上根衆生轉攝末歸本法輪名為開會教令彼偏教五乘人等轉偏成圓譬如日沒還照高山其所説經即是法華涅槃等也然此經既屬般若應在後轉時説但般若有八部謂大品小品放光光讚道行勝天王文殊問金剛唐譯為六百卷四處十六會説一王舍城鷲峯山七會山中四會山頂三會二舍衛國給孤獨園七會三他化天摩尼寶藏殿一會四王舍城竹林園白鷺池側一會此經則第二處第九會第五百七十七卷單部別行世所共見文出大部或有未知故此分別令悉源委餘部別行亦準此知唯仁王般若一部不在其數然時處既已分明而宣説的出金口憑茲翻譯尤為可信第三教乘攝屬者此復有二一辨教二分乘辨教者謂西域東夏弘闡之流於一代聖教或合為一教或開為二三再開之而至四五人兼緇素凡有一十八家甲順乙違難盡他宗事精理備無越賢首因依賢宗諸祖略述五教一小乘教亦名愚法二乘教異大乘故逐機設故隨他語故説諸法數一向差別以其揀邪正辨聖凡明因果分欣厭然其所説法數惟七十五但説人空不明法空縱説法空少不明顯唯依六識三毒建立染淨根本未盡法源故多諍論二大乘始教亦名分教但明諸法皆空未盡大乘法理故名為始但明一切法相有成佛有不成佛故名為分廣談法相少及法性其所云性亦是相數説有百法決擇分明故少諍論三終教亦名實教謂明緣起無性一切皆如定性二乘無性闡提悉當成佛方盡大乘至極之説故名為終以稱實理故名為實多談法性少及法相其所云相亦會歸性盡大乘説故無諍論四一乘頓教但一念不生即名為佛不依地位漸次而説如思益經云得諸法正性者不從一地至於一地楞伽云初地即為八乃至無所有何次等既不同前漸次修行亦不同後圓融具德故立名頓總不説法相唯辨真性一切所有唯是妄想一切法界唯是絶言五法名相妄想正智如如三自性緣起妄想成皆空八識二無我俱遣訶教勸離毀相泯心生心即妄不生即佛亦無佛無不佛無生無不生如淨名默住等別為一類離念機故亦為對治空有俱存三種著相人故五圓教統該前四圓滿具足一位即一切位一切位即一位十信滿心即攝五位成等正覺故名為圓所説唯是無盡法界性海圓融緣起無礙相即相入如因陀羅網重重無際微細相容主伴無盡十十法門各攝法界今此經者正屬始教以般若一往屬空宗故兼屬終頓如云是法平等無有高下既無有高下則一切衆生悉當成佛即終教義又云離一切相即名為佛既離相即佛則不依地位漸次而説即頓教義若以一音説法隨類各解亦通於圓如云當知是經義不可思議果報亦不可思議是也分乘者謂教義有淺有深被機有勝有劣微細分之品類實繁大略收録乘行有三一聲聞乘依四諦法殷勤精進欲速出三界自求涅槃如羊車二辟支乘依因緣法殷勤精進求自然慧樂獨善寂深知諸法因緣如鹿車三大乘對上二小乘為言亦名菩薩乘依六度法勤修精進求一切智等利益天人度脫一切如牛車然有權有實若住相之行因果歷別則名為權若無住之修因果該徹則名為實此經屬菩薩乘實一分攝以空生兩番請問俱為發菩提心者起見且經中始終具示降心離相住心無住義故又三乘之外前加人天後足佛乘名為五乘言人天乘者依戒善禪定之法求下界五欲及上界淨妙之樂如最小之車法華經火宅喻云乃至不與最小一車猶不虗妄蓋譬人天也言佛乘者依萬行因華嚴一乘道果如大白牛車此經屬佛乘攝如文云菩薩為利益一切衆生故應如是布施檀含萬行又云此經為發最上乘者説故若以此攝彼雖人天不遺以是法平等無有高下一切衆生皆當成佛餘可準思教乘攝屬竟第四因緣所為者謂教深乘廣足發深省再辨因緣以資勝解然因緣有二一總二別總謂如來一代聖教無非為一大事因緣所謂欲令衆生開示悟入佛知見故別則別就當經略為十種因緣第一為示降心住心法故良以覺心妄心勢如漢賊妄心不降而覺心難住覺心不住而妄心難降是故覺心要住妄心須降為此雙示一得兩成如世尊食時入城乞已還處正示不住一法而覺心常住食訖收緣洗足敷坐正示不起一念而妄心自降第以如來境界初心莫擬為此説經令其言薦第二為破我執法執障故良以我法二執凡小病源凡夫依之而起煩惱小乘因之而成所知輪轉生死礙正知見如夢如醉不自覺知佛為破此因説是經如云無我相無人相無衆生相無壽者相如是語類皆為破我執也又云無法相亦無非法相如是語類皆為破法執也第三為斷現行種子疑故良以一翳在眼亂華起空片疑介心萬妄馳性約已起當起而障現未之勝解或疑理疑事竟成煩惱之根本無智自解唯佛能釋故説此經通為遮斷如經中當機有問如來為答者皆為斷現行之疑如來反徵於意云何等皆為斷種子之疑又在當時皆為現行謂佛智鑑機知其已起故望後世總名種子謂假彼空生利及將來故第四為轉重業輕業報故良以假使百千劫所作業不亡因緣會遇時果報還自受惟有懺悔力乃能得除滅然懺悔之力此經最大故爾宣説令知受持如經云若有人受持讀誦此經若為人輕賤是人先世罪業應墮惡道以今世人輕賤故先世罪業即為消滅當得阿耨菩提據此則是轉當來重報而以現前輕報抵之至於轉輕全消經雖無文義則必然以重業既輕受輕業應不受故第五為顯行解必相應故良以超凡入聖以信解為入門從因至果緣修證取實效是故有解無行必墮狂慧有行無解定落有為故此經於信解之後當機重問住降蓋自覺信解雖成習氣難除對境起念住降莫致而如來答降心仍約度生無度等答住心仍約不住施福等言者乃欲其漸次修習務令行與解相應耳第六為顯空有無礙義故良以真空不空妙有不有由不達真空義故二乘逃形於界外由不達妙有義故凡外沉迹於域中各住一邊俱違中道為此説經顯無礙義如經云如來所得菩提於是中無實無虗乃至云所言一切法者總該空有即非一切法謂説空不空説有不有故是名一切法謂説空不空為真空説有不有為妙有故無妨假立名字説為一切法如是語類皆為顯空有無礙義也第七為救知見立知弊故楞嚴云知見立知成無明本知見無見斯即涅槃無漏真淨是知金屑雖貴落眼成塵因明立所萬法從生依妄生妄積迷成迷不唯無功反成大過為救此弊因説是經如經云如來有肉眼不等乃至云過去心不可得現在心不可得未來心不可得是佛知佛見尚不應立況夫未到佛地日燈隙明者哉第八為遣即相離相見故言即相觀佛固為常見離相觀佛尤墮斷滅均為不見佛性終成凡外種族今説此經為令雙遣如經云若以三十二相觀如來者轉輪聖王即是如來等遣即相見也又云須菩提莫作是念如來不以具足相故得阿耨菩提等遣離相見也第九為破依正二報相故夫受報以根身為正器界為依根身乃四大假和器界以衆微積聚總屬緣生皆為幻妄衆生不知認為實有執我執法而輪轉於中保之守之而莫由出離為破此相因説是經如經云若有人言如來若來若去若坐若臥是人不解我所説義等是知如來應身尚自無實況夫衆生色身豈當有據又云善男子善女人以三千大千世界碎為微塵乃至云一合相者即是不可説等此則世界總相尚非實有況夫隨業所感別相勢若燈輪寧可堅執第十總示我法二空觀故言總示者以前之九種展轉生起以此經兩番請問皆為降心住心故有第一住降之要首在破執故有第二執欲破而疑惑潛生故有第三信未立而業報卒至故有第四業報既轉正解斯成行與解違終難契入故有第五欲契真空不外妙有故有第六空有無礙任運修行歷位漸證中途多滯故有第七不滯中途攀仰妙果即相離相均非實證故有第八縱獲實證證亦不住現身而不住身相令衆生知根身唯妄攝界而不住界相令衆生悟器界非真故有第九如是九種別義遞互相資門門可入皆為方便設於是中懼不速成者總以二空觀門濟之無弗克理如經云佛説我見人見衆生見壽者見即非我見人見衆生見壽者見是名我見人見衆生見壽者見此示我空境也又云於一切法應如是知如是見如是信解不生法相須菩提所言法相者即非法相是名法相此示法空境也又云云何為人演説不取於相如如不動此示能觀智也又云一切有為法如夢幻泡影如露亦如電應作如是觀此示以智對境理易顯而觀易成也此經正屬空宗且約二空言之密示俱空非顯了説如我法才言即非又云是名以即非即是二空是名則空亦不立非俱空乎灌頂直解云始教中空宗亦是密説頓門此之謂也如是十種因緣前九為別隨機各入故後一為總總能成彼故總別合論又統為一大事因緣細尋於此不待披文而勝解成矣因緣所為竟第五受持感通者因緣既深教起亦大未知受持讀誦有何感通故授此門以為有志修行者勸然感應靈迹莫可殫述今依灌頂直解擇其馴雅者録之直解云受持者僧如法藏聞仙樂而往樂尼如淨真覩寶蓮而生上品法藏隋時僧居酈州寶室寺寫金剛經百卷壽至九十九歲臨終升座説偈別衆空中彌陀佛現仙樂幢幡引往西方淨真唐時尼居長安積善寺誦金剛經十萬遍語弟子曰是五月內十度見佛兩度見寶蓮華吾已生上品矣遂逝男如孫老翁坐石不飢女如吳道媼龕身長髮唐政和中真州石匠孫翁日持此經三卷後同二十餘人入山鑿石山忽崩盡喪其中經二十年郎鑿到此見翁端坐石窟語曰始因食一酥餅至今不飢不渴還家取經視之上有一孔恰如餅狀現果録云媼吳氏濟寧人隨夫唐某至松江年四十三長齋持經六載四十九時忽告人曰吾將逝矣經云金剛不壞身可留身三年驗之乃説偈曰風捲雲霧散明月碧團圓了然無罣礙池內現金蓮沒後龕身三年啓視果不壞頂髮長一寸提督梁公遂為漆身建庵供奉額曰坐化惡如任氏脫劒樹之苦趙妻解蟹山之冤唐龍朔中任五娘暴死月餘托夢弟妹曰我好食肉殺害禽畜活魚作鱠今受刀山劍樹地獄之苦可將我遺下戶資求淨土寺寶獻大師寫金剛經七卷即脫身上七刀之苦弟妹依囑圓時復夢來謝趙妻者泗州趙璧妻李氏也氏亡璧及第歸夢氏來語曰奴在生每於蟹出之時買作醉蟹恣意食噉今墮蟹山地獄羣蟹鉗咬晝夜難當乞將房奩變賣為奴寫經流通乃可救拔璧如其言完夕夢妻謝曰承斯脫苦生天矣畜如螺螄送經蟒蛇聽法唐王待制船至漢江風浪擊作遂將平昔所持經本投中遂得風息浪靜後至鎮江見舟尾百步許有物似毬狀使漁者取之乃無數螺螄團成一毬剖之外濕內乾視中即向所投經也唐武德間陳昭江陵人長齋誦經時有大蟒來聽經畢即退鄰人力昌疑而殺之暴卒托夢於妻曰蟒願聽經百卷可以升騰只少七卷被殺不甘懇為寫經七卷誠𮘗七遍彼得生天乃放捨此事矣妻如其言子遂出家名為僧護大興佛法又若自持則箭不能傷教誦則鬼不能縛唐富陽徐為府吏一夜賊劫其家捆在箭垛上射之不著問有何術曰每日五更持金剛經三卷方入公門曾無間斷別無他術賊聞釋放並回心出家唐王陀染瘴疾發心每日念金剛經五卷一日見二鬼曰王令追汝且止念經陀聞之念經益虔鬼莫近少頃又見一鬼報曰念經善人王令權放自是晝夜受持壽延九旬施捨則起死回生隨喜則脫畜還人宋紹興間宋承信秀州華亭縣人患翻胃病百藥無效一夜夢梵僧謂曰汝施金剛經千卷病苦可除信寤即捐資行施其病漸瘥宋蘇州朱進士遊虎邱寺值佛印禪師講一切有為法四句偈聞之甚喜次午睡去夢二吏引五人同行朱亦隨後到一家厨房桶內有湯五人俱飲朱思經偈渴亦欲飲吏呵曰聽佛法人不可飲此乃驚覺訪之彼家厨養六犬內一死者朱遂棄業持經壽八十九八月十五日立化臨終偈曰八十九年朱翁兩手劈破虗空腳下踏著白雲立化菩提樹東如斯感應備在本傳普勸來學幸勿自輕況此經猶如佛母譬同金剛信願熏修定成智種受持感通竟
